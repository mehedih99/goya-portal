<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="theme-color" content="#0f172a">
<title>Goya Operations Portal V2</title>
<style>
:root{--bg:#0f172a;--bg2:#1e293b;--accent:#f59e0b;--text:#f8fafc;--text2:#94a3b8;}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;background:linear-gradient(160deg,var(--bg) 0%,#111827 50%,var(--bg2) 100%);color:var(--text);min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:24px}
.container{max-width:420px;width:100%;text-align:center}
.logo-img{width:180px;height:auto;margin-bottom:12px;filter:drop-shadow(0 0 30px rgba(245,158,11,0.15))}
.tagline{color:var(--text2);font-size:1rem;margin-bottom:8px}
.version{display:inline-block;background:rgba(245,158,11,0.1);color:var(--accent);padding:4px 14px;border-radius:20px;font-size:.75rem;font-weight:700;margin-bottom:40px;border:1px solid rgba(245,158,11,0.2)}
.portal-grid{display:grid;gap:14px;margin-bottom:40px}
.portal-card{background:var(--bg2);border:1px solid rgba(71,85,105,.4);border-radius:18px;padding:28px 20px;text-decoration:none;color:var(--text);transition:all .25s;display:flex;flex-direction:column;align-items:center;gap:12px;cursor:pointer}
.portal-card:active{transform:scale(.97)}
.portal-card:hover{border-color:var(--accent);box-shadow:0 16px 40px rgba(0,0,0,.35)}
.portal-icon{width:56px;height:56px;border-radius:14px;display:flex;align-items:center;justify-content:center;font-size:1.6rem}
.icon-staff{background:linear-gradient(135deg,rgba(59,130,246,.18),rgba(59,130,246,.05));color:#60a5fa}
.icon-admin{background:linear-gradient(135deg,rgba(245,158,11,.18),rgba(245,158,11,.05));color:var(--accent)}
.portal-title{font-size:1.15rem;font-weight:700}
.portal-desc{color:var(--text2);font-size:.85rem;line-height:1.5}
.badge{margin-top:4px;padding:5px 14px;border-radius:20px;font-size:.75rem;font-weight:700}
.badge-staff{background:rgba(59,130,246,.1);color:#60a5fa}
.badge-admin{background:rgba(245,158,11,.1);color:var(--accent)}
.features{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-bottom:36px}
.feature{text-align:center}
.feature-num{font-size:1.4rem;font-weight:800;color:var(--accent)}
.feature-label{font-size:.75rem;color:var(--text2);margin-top:2px}
.footer{color:var(--text2);font-size:.8rem}
@media(max-width:400px){.logo-img{width:140px}}
</style>
</head>
<body>
<div class="container">
<img src="goya-logo.png" alt="Goya" class="logo-img">
<div class="tagline">Restaurant Operations Portal</div>
<div class="version">V2.0 FINAL</div>
<div class="features">
<div class="feature"><div class="feature-num">5</div><div class="feature-label">Tabs</div></div>
<div class="feature"><div class="feature-num">∞</div><div class="feature-label">Items</div></div>
<div class="feature"><div class="feature-num">0</div><div class="feature-label">Paper</div></div>
</div>
<div class="portal-grid">
<a href="staff.html" class="portal-card">
<div class="portal-icon icon-staff">👨‍🍳</div>
<div class="portal-title">Staff Portal</div>
<div class="portal-desc">Orders, Production, Wastage & Inventory Count</div>
<div class="badge badge-staff">For Staff</div>
</a>
<a href="admin.html" class="portal-card">
<div class="portal-icon icon-admin">🛡️</div>
<div class="portal-title">Admin Workspace</div>
<div class="portal-desc">Manage, Monitor, Export & Control Everything</div>
<div class="badge badge-admin">For Managers</div>
</a>
</div>
<div class="footer">Powered by Google Sheets · Mobile Optimized</div>
</div>
</body>
</html>
