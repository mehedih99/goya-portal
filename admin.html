<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Portal — Admin</title>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,600;9..144,700&family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{--espresso:#2d2416;--sage:#6b8e5f;--ink:#1a1a1a;--ink-soft:#666;--line:#e5ddd0;--parchment:#f5f1e8;--parchment-2:#ede9df;--alert:#d9534f;--shadow:0 4px 16px rgba(0,0,0,0.06)}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'Inter',sans-serif;background:#faf8f5;color:var(--ink);line-height:1.5}
input,select,button,textarea{font-family:inherit;font-size:inherit;color:inherit}
.topbar{background:#fff;padding:14px 24px;display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid var(--line);box-shadow:var(--shadow);position:sticky;top:0;z-index:100}
.brand{font-weight:700;font-size:18px;font-family:'Fraunces',serif;color:var(--espresso);display:flex;align-items:center;gap:10px}
.admin-layout{display:grid;grid-template-columns:220px 1fr;gap:24px;padding:24px;max-width:1440px;margin:0 auto;align-items:start}
@media (max-width:860px){.admin-layout{grid-template-columns:1fr}}
.admin-nav{display:flex;flex-direction:column;gap:6px;background:#fff;padding:16px;border-radius:12px;box-shadow:var(--shadow);border:1px solid rgba(0,0,0,0.03);position:sticky;top:100px}
.admin-nav button{padding:12px 16px;text-align:left;border:none;background:none;cursor:pointer;border-radius:8px;font-weight:500;color:var(--ink-soft);transition:all .2s;display:flex;align-items:center;gap:10px;font-size:14.5px}
.admin-nav button.active{background:var(--parchment);color:var(--espresso);font-weight:600}
.admin-nav button:hover:not(.active){background:#faf8f5;color:var(--espresso)}
.card{background:#fff;border-radius:12px;padding:24px;margin-bottom:24px;box-shadow:var(--shadow);border:1px solid rgba(0,0,0,0.03)}
.section-title{display:flex;justify-content:space-between;align-items:center;margin-bottom:20px}
.section-title h3{font-size:20px;font-weight:700;font-family:'Fraunces',serif;color:var(--espresso)}
.row{display:flex;gap:16px;flex-wrap:wrap;align-items:center}
.row>*{min-width:0;flex:1}
.btn{padding:12px 20px;border:none;border-radius:8px;font-weight:600;cursor:pointer;transition:all .2s;font-size:14px;display:inline-flex;align-items:center;justify-content:center;gap:8px;}
.btn-primary{background:var(--sage);color:#fff}
.btn-primary:hover{background:#5a7a50;transform:translateY(-1px)}
.btn-ghost{background:transparent;border:1.5px solid var(--line);color:var(--ink)}
.btn-ghost:hover{background:var(--parchment)}
.btn-danger{background:#fdecec;color:var(--alert)}
.btn-danger:hover{background:#fad4d4}
.btn-sm{padding:8px 14px;font-size:13px}
.input-text,.input-number,.input-select{padding:12px 16px;border:1.5px solid var(--line);border-radius:8px;background:#fffdf9;width:100%;transition:all .2s;font-size:14px}
.input-text:focus,.input-number:focus,.input-select:focus{outline:none;border-color:var(--sage);box-shadow:0 0 0 3px rgba(107,142,95,.15);background:#fff}
.table-wrap{overflow-x:auto;margin:16px 0;border-radius:10px;border:1px solid var(--line)}
.table-wrap table{width:100%;border-collapse:collapse;font-size:13.5px}
.table-wrap th{background:var(--parchment);padding:14px 16px;text-align:left;font-weight:600;color:var(--espresso);text-transform:uppercase;font-size:11px;letter-spacing:0.5px;border-bottom:2px solid var(--line)}
.table-wrap td{padding:14px 16px;border-bottom:1px solid var(--line);vertical-align:middle}
.table-wrap tr:hover td{background:#faf8f5}
.table-wrap tr:last-child td{border-bottom:none}
.gate-wrap{display:flex;align-items:center;justify-content:center;min-height:100vh;background:var(--espresso);padding:20px;}
.gate-card{background:#fff;padding:48px 40px;border-radius:16px;box-shadow:0 20px 60px rgba(0,0,0,.3);max-width:440px;width:100%}
.badge{display:inline-block;padding:4px 10px;border-radius:20px;font-size:11px;font-weight:700;text-transform:uppercase;background:var(--parchment-2);color:var(--ink)}
.tag{display:inline-block;padding:6px 12px;border-radius:6px;background:#e3ecdd;color:var(--sage);font-size:12px;font-weight:700}
.filters{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:16px;margin-bottom:24px;background:var(--parchment);padding:20px;border-radius:10px;border:1px solid var(--line)}
.filter-item label{display:block;font-size:12px;font-weight:700;color:var(--espresso);margin-bottom:8px;text-transform:uppercase;letter-spacing:0.5px}
.pin-pad{text-align:center}
.pin-grid{display:grid;grid-template-columns:repeat(3,70px);gap:12px;justify-content:center;margin-bottom:20px}
.pin-grid button{width:70px;height:70px;font-size:24px;font-weight:600;border:1.5px solid var(--line);background:#fff;border-radius:12px;cursor:pointer;transition:all 0.1s}
.pin-grid button:active{background:var(--parchment);transform:scale(0.95)}
.overlay{position:fixed;inset:0;background:rgba(45,36,22,0.8);backdrop-filter:blur(4px);display:flex;align-items:center;justify-content:center;z-index:9999}
.modal{background:#fff;padding:32px;border-radius:16px;box-shadow:0 20px 40px rgba(0,0,0,.2);max-width:400px;width:90%}
</style>
</head>
<body>
<div id="app"></div>
<script>
/* ================= STANDALONE CORE ================= */
const OWNER_EMAIL = 'mehedi.src@gmail.com';
const STATUSES = ['PENDING','ORDERED','RECEIVED','NOT_RECEIVED','REJECTED'];
const STATUS_LABEL = {PENDING:'Pending',ORDERED:'Ordered',RECEIVED:'Received',NOT_RECEIVED:'Not Received',REJECTED:'Rejected'};
const SECTIONS = ['kitchen','pastry','bar','packaging'];
const SECTION_LABEL = {kitchen:'Kitchen',pastry:'Pastry',bar:'Bar',packaging:'Packaging'};

let SHEET_URL = '';
let LOCAL_DB = null;

async function getLocalSetting(key){ try{ return JSON.parse(localStorage.getItem(key)||'null'); }catch(e){ return null; } }
async function setLocalSetting(key, val){ localStorage.setItem(key, JSON.stringify(val)); }

async function initBackend(){ SHEET_URL = await getLocalSetting('goya-sheet-url') || ''; }
async function connectSheet(url){ SHEET_URL = (url||'').trim(); await setLocalSetting('goya-sheet-url', SHEET_URL); }

async function sheetPost(action, body){
  if(!SHEET_URL) throw new Error('Sheet not connected');
  const resp = await fetch(SHEET_URL, {method:'POST', body:JSON.stringify({action,...body})});
  return resp.json();
}

const api = {
  async getAll(){ if(!SHEET_URL) return seedData(); try{ const resp = await fetch(SHEET_URL+'?action=getAll'); return resp.json(); }catch(e){ return seedData(); } },
  async updateOrderStatus(timestamp, status, receivedDate){ if(SHEET_URL) await sheetPost('updateOrderStatus',{timestamp,status,receivedDate}); else{ const o=LOCAL_DB.orders.find(x=>x['Timestamp']===timestamp); if(o) o['Status']=status; await saveLocalDB(); } },
  async bulkUpdateOrderStatus(timestamps, status){ if(SHEET_URL) await sheetPost('bulkUpdateOrderStatus',{timestamps,status}); else{ LOCAL_DB.orders.forEach(o=>{ if(timestamps.includes(o['Timestamp'])) o['Status']=status; }); await saveLocalDB(); } },
  async updateLogStatus(sheet, timestamp, status){ if(SHEET_URL) await sheetPost('updateLogStatus',{sheet,timestamp,status}); else{ const arr=sheet==='Production'?LOCAL_DB.production:LOCAL_DB.wastage; const r=arr.find(x=>x['Timestamp']===timestamp); if(r) r['Status']=status; await saveLocalDB(); } },
  async upsertItem(item){ if(SHEET_URL) return sheetPost('upsertItem',{item}); else{ const i=LOCAL_DB.items.find(x=>x['Row ID']===item.rowId); const row={'Row ID':item.rowId||Date.now().toString(),'Name':item.name,'SKU':item.sku||'','Storage Unit':item.storageUnit||'','Ingredient Unit':item.ingredientUnit||'','Supplier':item.supplier||'','Items Type':item.itemsType||'kitchen'}; if(i) Object.assign(i,row); else LOCAL_DB.items.push(row); await saveLocalDB(); } },
  async deleteItem(rowId){ if(SHEET_URL) await sheetPost('deleteItem',{rowId}); else{ LOCAL_DB.items=LOCAL_DB.items.filter(x=>x['Row ID']!==rowId); await saveLocalDB(); } },
  async upsertStaff(staff, oldPin){ if(SHEET_URL) return sheetPost('upsertStaff',{staff,oldPin}); else{ const matchPin=oldPin||staff.pin; const s=LOCAL_DB.staff.find(x=>x['PIN Code']===matchPin); const row={'PIN Code':staff.pin,'Staff Full Name':staff.name,'Allowed Sections':(staff.allowedSections||[]).join(',')}; if(s) Object.assign(s,row); else LOCAL_DB.staff.push(row); await saveLocalDB(); } },
  async deleteStaff(pin){ if(SHEET_URL) await sheetPost('deleteStaff',{pin}); else{ LOCAL_DB.staff=LOCAL_DB.staff.filter(x=>x['PIN Code']!==pin); await saveLocalDB(); } },
  async upsertSupplier(supplier, oldName){ if(SHEET_URL) return sheetPost('upsertSupplier',{supplier,oldName}); else{ const matchName=oldName||supplier.name; const s=LOCAL_DB.suppliers.find(x=>x['Name']===matchName); const row={'Name':supplier.name,'Phone':supplier.phone||'','Group Link':supplier.groupLink||''}; if(s) Object.assign(s,row); else LOCAL_DB.suppliers.push(row); await saveLocalDB(); } },
  async deleteSupplier(name){ if(SHEET_URL) await sheetPost('deleteSupplier',{name}); else{ LOCAL_DB.suppliers=LOCAL_DB.suppliers.filter(x=>x['Name']!==name); await saveLocalDB(); } },
  async setSetting(key, value){ if(SHEET_URL) return sheetPost('setSetting',{key,value}); else{ LOCAL_DB.settings[key]=value; await saveLocalDB(); } }
};

function seedData(){
  return { items:[], staff:[], orders:[], production:[], wastage:[], inventoryCounts:[], suppliers:[], settings:{ MasterPin:'9988', ConnectionPin:'9988', InventoryCountEnabled:'true' } };
}

async function saveLocalDB(){ if(LOCAL_DB) localStorage.setItem('goya-local-db', JSON.stringify(LOCAL_DB)); }
async function loadLocalDB(){ try{ LOCAL_DB = JSON.parse(localStorage.getItem('goya-local-db')); if(!LOCAL_DB) LOCAL_DB = seedData(); }catch(e){ LOCAL_DB = seedData(); } }

function escHtml(s){ return String(s||'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function fmtDate(iso){ return iso? iso.slice(0,10) : ''; }
function fmtDateTime(iso){ return iso? iso.slice(0,16).replace('T',' ') : ''; }
function todayISO(){ return new Date().toISOString().slice(0,10); }

function showToast(msg){
  const t = document.createElement('div');
  t.style.cssText = 'position:fixed;bottom:24px;left:50%;transform:translateX(-50%);background:var(--espresso);color:#fff;padding:14px 24px;border-radius:8px;font-size:14px;font-weight:500;z-index:9999;box-shadow:0 10px 30px rgba(0,0,0,0.2)';
  t.textContent = msg; document.body.appendChild(t); setTimeout(()=>t.remove(), 2500);
}

function openPinPad(title, onSubmit){
  const holder = document.createElement('div'); holder.className='overlay'; let input = '';
  const pad = `<div class="pin-pad"><h3 style="margin-bottom:20px;font-family:'Fraunces',serif;font-size:22px;color:var(--espresso);">${escHtml(title)}</h3><input type="password" id="pin-input" placeholder="••••" readonly style="text-align:center;font-size:28px;letter-spacing:12px;width:160px;height:60px;border:2px solid var(--line);border-radius:12px;margin:0 auto 24px;display:block;background:#fffdf9;color:var(--espresso)"><div class="pin-grid">${[1,2,3,4,5,6,7,8,9,0].map(n=>`<button onclick="insertPin(${n})">${n}</button>`).join('')}<button onclick="deletePin()" style="grid-column:2;background:var(--parchment-2);color:var(--ink-soft)">⌫</button></div><div class="row" style="margin-top:20px;"><button class="btn btn-primary" style="width:100%;padding:14px;" onclick="submitPin()">Confirm</button></div></div>`;
  holder.innerHTML = `<div class="modal">${pad}</div>`; document.body.appendChild(holder);
  window.pinInput = () => document.getElementById('pin-input');
  window.insertPin = (n) => { if(input.length<4){input+=n; window.pinInput().value='•'.repeat(input.length);} };
  window.deletePin = () => { input = input.slice(0,-1); window.pinInput().value='•'.repeat(input.length); };
  window.submitPin = async () => { if(await onSubmit(input)){ holder.remove(); } else { showToast('Incorrect PIN'); input=''; window.pinInput().value=''; } };
}

/* ================= CSV EXPORT ENGINE ================= */
function downloadCSV(filename, headers, rows){
  const csvRows = [headers.map(h => `"${String(h).replace(/"/g, '""')}"`).join(',')];
  rows.forEach(r => {
    const rowStr = r.map(cell => `"${String(cell).replace(/"/g, '""')}"`).join(',');
    csvRows.push(rowStr);
  });
  const blob = new Blob([csvRows.join('\n')], { type: 'text/csv;charset=utf-8;' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = filename; a.click();
  URL.revokeObjectURL(url);
}

/* ================= ADMIN LOGIC ================= */
let DB={items:[],staff:[],orders:[],production:[],wastage:[],inventoryCounts:[],suppliers:[],settings:{}};
let UI={loaded:false,unlocked:false,tab:'orders',orderFilters:{search:'',status:'',supplier:'',from:'',to:''},orderSelected:{},monitorFilters:{type:'production',from:'',to:''},monitorSelected:{}};

async function boot(){ await loadLocalDB(); await initBackend(); DB=await api.getAll(); UI.loaded=true; render(); }

function render(){
  const app=document.getElementById('app');
  if(!UI.loaded){app.innerHTML=`<div class="gate-wrap"><div class="gate-card"><h2 style="text-align:center;font-family:'Fraunces',serif;font-size:28px;">Admin Panel</h2><p style="text-align:center;color:var(--ink-soft);margin-top:8px;">Loading securely...</p></div></div>`;return;}
  if(!UI.unlocked){app.innerHTML=`<div class="gate-wrap"><div class="gate-card"><h2 style="text-align:center;font-family:'Fraunces',serif;font-size:28px;color:var(--espresso);margin-bottom:8px;">Admin Access</h2><p style="text-align:center;color:var(--ink-soft);margin-bottom:24px;">Enter Master PIN to continue.</p><button class="btn btn-primary" style="width:100%;padding:14px;font-size:15px;" onclick="openPinPad('Master PIN', async(e)=>{if(e===(DB.settings.MasterPin||'9988')){UI.unlocked=true;render();return true;}return false;})">Unlock Panel</button></div></div>`;return;}
  let html=`<div class="topbar"><div class="brand">🚀 Goya Admin Workspace</div><button class="btn btn-ghost btn-sm" onclick="UI.unlocked=false;render();">Lock Session</button></div>`;
  html+=`<div class="admin-layout"><div class="admin-nav">${[['orders','📦 Order Management'],['items','📋 Items & Suppliers'],['staff','👥 Staff Directory'],['monitor','📊 Prod & Waste'],['counts','🛒 Inventory Counts'],['export','📥 Data Export'],['settings','⚙️ Settings']].map(([k,l])=>`<button class="${UI.tab===k?'active':''}" onclick="UI.tab='${k}';render();">${l}</button>`).join('')}</div><div>`;
  if(UI.tab==='orders') html+=renderOrders(); else if(UI.tab==='items') html+=renderItems(); else if(UI.tab==='staff') html+=renderStaff(); else if(UI.tab==='monitor') html+=renderMonitor(); else if(UI.tab==='counts') html+=renderCounts(); else if(UI.tab==='export') html+=renderExport(); else html+=renderSettings();
  html+=`</div></div>`; app.innerHTML=html;
}

/* 1. ORDERS */
function renderOrders(){
  let html=`<div class="card"><div class="section-title"><h3>Orders Management</h3><span class="badge" style="background:#e3ecdd;color:var(--sage)">${DB.orders.length} Records</span></div><div class="filters"><div class="filter-item"><label>Search Item</label><input type="text" class="input-text" value="${escHtml(UI.orderFilters.search)}" oninput="UI.orderFilters.search=this.value;render();"></div><div class="filter-item"><label>Status</label><select class="input-select" onchange="UI.orderFilters.status=this.value;render();"><option value="">All Statuses</option>${STATUSES.map(s=>`<option value="${s}" ${UI.orderFilters.status===s?'selected':''}>${STATUS_LABEL[s]}</option>`).join('')}</select></div><div class="filter-item"><label>Supplier</label><select class="input-select" onchange="UI.orderFilters.supplier=this.value;render();"><option value="">All Suppliers</option>${[...new Set(DB.orders.map(o=>o['Supplier']))].filter(Boolean).map(s=>`<option value="${escHtml(s)}" ${UI.orderFilters.supplier===s?'selected':''}>${escHtml(s)}</option>`).join('')}</select></div><div class="filter-item"><label>Date From</label><input type="date" class="input-text" value="${UI.orderFilters.from}" onchange="UI.orderFilters.from=this.value;render();"></div><div class="filter-item"><label>Date To</label><input type="date" class="input-text" value="${UI.orderFilters.to}" onchange="UI.orderFilters.to=this.value;render();"></div></div>`;
  let rows=DB.orders.slice().sort((a,b)=>new Date(b['Timestamp'])-new Date(a['Timestamp']));
  if(UI.orderFilters.search)rows=rows.filter(o=>o['Item Name'].toLowerCase().includes(UI.orderFilters.search.toLowerCase()));
  if(UI.orderFilters.status)rows=rows.filter(o=>o['Status']===UI.orderFilters.status);
  if(UI.orderFilters.supplier)rows=rows.filter(o=>o['Supplier']===UI.orderFilters.supplier);
  if(UI.orderFilters.from)rows=rows.filter(o=>o['Timestamp'].slice(0,10)>=UI.orderFilters.from);
  if(UI.orderFilters.to)rows=rows.filter(o=>o['Timestamp'].slice(0,10)<=UI.orderFilters.to);
  const selectedTs=Object.keys(UI.orderSelected).filter(k=>UI.orderSelected[k]);
  
  if(selectedTs.length>0){
    html+=`<div class="card" style="background:var(--parchment-2);border-color:var(--line);padding:16px;"><div class="row" style="align-items:center"><span style="font-weight:700;color:var(--espresso);font-size:15px;">${selectedTs.length} Items Selected</span><div class="row" style="flex:none"><select class="input-select" id="bulk-status" style="width:160px;"><option value="PENDING">Pending</option><option value="ORDERED">Ordered</option><option value="RECEIVED">Received</option></select><button class="btn btn-primary" onclick="bulkStatus()">Apply Status</button></div></div></div>`;
  }
  html+=`<div class="table-wrap"><table><tr><th><input type="checkbox" onchange="Object.keys(UI.orderSelected).forEach(k=>{UI.orderSelected[k]=this.checked;});render();" style="width:16px;height:16px;cursor:pointer"></th><th>Date</th><th>Item Details</th><th>Qty</th><th>Supplier</th><th>Status</th><th>Logged By</th></tr>${rows.map(o=>`<tr><td><input type="checkbox" ${UI.orderSelected[o['Timestamp']]?'checked':''} onchange="UI.orderSelected['${o['Timestamp']}']=this.checked;render();" style="width:16px;height:16px;cursor:pointer"></td><td style="font-family:'IBM Plex Mono',monospace;font-size:12px;color:var(--ink-soft)">${fmtDateTime(o['Timestamp'])}</td><td><div style="font-weight:600;color:var(--espresso)">${escHtml(o['Item Name'])}</div></td><td><span class="tag">${o['Quantity']} ${escHtml(o['Unit'])}</span></td><td>${escHtml(o['Supplier'])}</td><td><select class="input-select" onchange="setOrderStatus('${o['Timestamp']}',this.value);" style="width:130px;font-size:13px;padding:8px;"><option value="PENDING" ${o['Status']==='PENDING'?'selected':''}>Pending</option><option value="ORDERED" ${o['Status']==='ORDERED'?'selected':''}>Ordered</option><option value="RECEIVED" ${o['Status']==='RECEIVED'?'selected':''}>Received</option></select></td><td>${escHtml(o['Logged By'])}</td></tr>`).join('')}</table></div></div>`; return html;
}
async function setOrderStatus(ts,st){await api.updateOrderStatus(ts,st,st==='RECEIVED'?todayISO():'');DB=await api.getAll();showToast('Status Updated');render();}
async function bulkStatus(){const st=document.getElementById('bulk-status').value;const tsList=Object.keys(UI.orderSelected).filter(k=>UI.orderSelected[k]);await api.bulkUpdateOrderStatus(tsList,st);DB=await api.getAll();UI.orderSelected={};showToast('Bulk Update Applied');render();}

/* 2. ITEMS & SUPPLIERS */
function renderItems(){
  let html=`<div class="card"><div class="section-title"><h3>Supplier Contacts</h3></div><div class="table-wrap"><table><tr><th>Supplier Name</th><th>WhatsApp Phone</th><th>Actions</th></tr>${DB.suppliers.map(s=>`<tr><td><input class="input-text" value="${escHtml(s['Name'])}" onchange="updateSupplier('${escHtml(s['Name'])}','name',this.value);"></td><td><input class="input-text" value="${escHtml(s['Phone'])}" onchange="updateSupplier('${escHtml(s['Name'])}','phone',this.value);" placeholder="e.g. +971501234567"></td><td><button class="btn btn-danger btn-sm" onclick="deleteSupplier('${escHtml(s['Name'])}')">Delete</button></td></tr>`).join('')}</table></div><div class="row" style="margin-top:20px;padding-top:20px;border-top:1px solid var(--line)"><input class="input-text" id="new-sup-name" placeholder="New Supplier Name"><input class="input-text" id="new-sup-phone" placeholder="WhatsApp Phone"><button class="btn btn-primary" onclick="addSupplier()">Add Supplier</button></div></div>`;
  html+=`<div class="card"><div class="section-title"><h3>Master Items Database</h3><span class="badge">${DB.items.length} Items</span></div><div class="table-wrap"><table><tr><th>Item Name</th><th>SKU</th><th>Storage Unit</th><th>Ingredient Unit</th><th>Supplier</th><th>Category Type</th><th>Actions</th></tr>${DB.items.map(it=>`<tr><td><input class="input-text" value="${escHtml(it['Name'])}" onchange="updateItem('${it['Row ID']}','name',this.value);"></td><td><input class="input-text" style="width:100px;font-family:monospace" value="${escHtml(it['SKU'])}" onchange="updateItem('${it['Row ID']}','sku',this.value);"></td><td><input class="input-text" style="width:100px;" value="${escHtml(it['Storage Unit'])}" onchange="updateItem('${it['Row ID']}','storageUnit',this.value);"></td><td><input class="input-text" style="width:100px;" value="${escHtml(it['Ingredient Unit'])}" onchange="updateItem('${it['Row ID']}','ingredientUnit',this.value);"></td><td><select class="input-select" onchange="updateItem('${it['Row ID']}','supplier',this.value);"><option value="">— Internal Batch —</option>${DB.suppliers.map(s=>`<option value="${escHtml(s['Name'])}" ${it['Supplier']===s['Name']?'selected':''}>${escHtml(s['Name'])}</option>`).join('')}</select></td><td><select class="input-select" onchange="updateItem('${it['Row ID']}','type',this.value);"><option value="kitchen" ${it['Items Type']==='kitchen'?'selected':''}>Kitchen</option><option value="pastry" ${it['Items Type']==='pastry'?'selected':''}>Pastry</option><option value="bar" ${it['Items Type']==='bar'?'selected':''}>Bar</option><option value="packaging" ${it['Items Type']==='packaging'?'selected':''}>Packaging</option></select></td><td><button class="btn btn-danger btn-sm" onclick="deleteItem('${it['Row ID']}')">Delete</button></td></tr>`).join('')}</table></div><div class="row" style="margin-top:20px;padding-top:20px;border-top:1px solid var(--line);align-items:flex-start"><input class="input-text" id="new-item-name" placeholder="Item Name (e.g. Just Chill Vanilla Powder)"><input class="input-text" id="new-item-sku" placeholder="SKU"><div style="display:flex;flex-direction:column;gap:12px;flex:1"><input class="input-text" id="new-item-storage" placeholder="Storage Unit (e.g. KG)"><input class="input-text" id="new-item-ingredient" placeholder="Ingredient Unit (e.g. GRAM)"></div><div style="display:flex;flex-direction:column;gap:12px;flex:1"><select class="input-select" id="new-item-supplier"><option value="">— Internal Batch —</option>${DB.suppliers.map(s=>`<option value="${escHtml(s['Name'])}">${escHtml(s['Name'])}</option>`).join('')}</select><select class="input-select" id="new-item-type"><option value="kitchen">Kitchen</option><option value="pastry">Pastry</option><option value="bar">Bar</option><option value="packaging">Packaging</option></select></div><button class="btn btn-primary" style="align-self:stretch" onclick="addItem()">Add Item</button></div></div>`; return html;
}
async function updateSupplier(o,f,v){const s=DB.suppliers.find(x=>x['Name']===o);if(!s)return;await api.upsertSupplier({name:f==='name'?v:s['Name'],phone:f==='phone'?v:s['Phone'],groupLink:s['Group Link']},o);DB=await api.getAll();render();}
async function deleteSupplier(n){await api.deleteSupplier(n);DB=await api.getAll();render();}
async function addSupplier(){const n=document.getElementById('new-sup-name').value.trim();if(!n)return;await api.upsertSupplier({name:n,phone:document.getElementById('new-sup-phone').value.trim(),groupLink:''});DB=await api.getAll();render();}
async function updateItem(r,f,v){const it=DB.items.find(x=>x['Row ID']===r);if(!it)return;await api.upsertItem({rowId:r,name:f==='name'?v:it['Name'],sku:f==='sku'?v:it['SKU'],storageUnit:f==='storageUnit'?v:it['Storage Unit'],ingredientUnit:f==='ingredientUnit'?v:it['Ingredient Unit'],supplier:f==='supplier'?v:it['Supplier'],itemsType:f==='type'?v:it['Items Type']});DB=await api.getAll();showToast('Saved');}
async function deleteItem(r){await api.deleteItem(r);DB=await api.getAll();render();}
async function addItem(){const n=document.getElementById('new-item-name').value.trim();if(!n)return;await api.upsertItem({rowId:Date.now().toString(),name:n,sku:document.getElementById('new-item-sku').value.trim(),storageUnit:document.getElementById('new-item-storage').value.trim(),ingredientUnit:document.getElementById('new-item-ingredient').value.trim(),supplier:document.getElementById('new-item-supplier').value,itemsType:document.getElementById('new-item-type').value});DB=await api.getAll();render();}

/* 3. STAFF */
function renderStaff(){
  let html=`<div class="card"><div class="section-title"><h3>Staff Directory</h3><span class="badge">${DB.staff.length} Active Staff</span></div><div class="table-wrap"><table><tr><th>Staff PIN</th><th>Full Name</th><th>Section Access (Comma separated)</th><th>Actions</th></tr>${DB.staff.map(s=>`<tr><td><input class="input-text" style="width:100px;font-family:monospace" value="${escHtml(s['PIN Code'])}" onchange="updateStaff('${escHtml(s['PIN Code'])}','pin',this.value);"></td><td><input class="input-text" value="${escHtml(s['Staff Full Name'])}" onchange="updateStaff('${escHtml(s['PIN Code'])}','name',this.value);"></td><td><input class="input-text" value="${escHtml(s['Allowed Sections'])}" onchange="updateStaff('${escHtml(s['PIN Code'])}','sections',this.value);" placeholder="e.g. kitchen,bar"></td><td><button class="btn btn-danger btn-sm" onclick="deleteStaff('${escHtml(s['PIN Code'])}')">Revoke Access</button></td></tr>`).join('')}</table></div><div class="row" style="margin-top:20px;padding-top:20px;border-top:1px solid var(--line)"><input class="input-text" id="new-staff-name" placeholder="Staff Name"><input class="input-text" id="new-staff-pin" placeholder="Secure 4-Digit PIN"><button class="btn btn-primary" onclick="addStaff()">Onboard Staff</button></div></div>`; return html;
}
async function updateStaff(o,f,v){const s=DB.staff.find(x=>x['PIN Code']===o);if(!s)return;await api.upsertStaff({pin:f==='pin'?v:s['PIN Code'],name:f==='name'?v:s['Staff Full Name'],allowedSections:(f==='sections'?v:(s['Allowed Sections']||'')).split(',').map(x=>x.trim())},o);DB=await api.getAll();showToast('Saved');}
async function deleteStaff(p){await api.deleteStaff(p);DB=await api.getAll();render();}
async function addStaff(){const n=document.getElementById('new-staff-name').value.trim();const p=document.getElementById('new-staff-pin').value.trim();if(!n||!p)return;await api.upsertStaff({pin:p,name:n,allowedSections:[]});DB=await api.getAll();render();}

/* 4. MONITOR */
function renderMonitor(){
  let html=`<div class="card"><div class="section-title"><h3>Production & Wastage Logs</h3></div><div class="filters"><div class="filter-item"><label>Log Type</label><select class="input-select" onchange="UI.monitorFilters.type=this.value;render();"><option value="production" ${UI.monitorFilters.type==='production'?'selected':''}>🏭 Production Batches</option><option value="wastage" ${UI.monitorFilters.type==='wastage'?'selected':''}>🗑 Wastage / Damages</option></select></div><div class="filter-item"><label>Date From</label><input type="date" class="input-text" value="${UI.monitorFilters.from}" onchange="UI.monitorFilters.from=this.value;render();"></div><div class="filter-item"><label>Date To</label><input type="date" class="input-text" value="${UI.monitorFilters.to}" onchange="UI.monitorFilters.to=this.value;render();"></div></div>`;
  let rows=(UI.monitorFilters.type==='production'?DB.production:DB.wastage).slice().sort((a,b)=>new Date(b['Timestamp'])-new Date(a['Timestamp']));
  if(UI.monitorFilters.from)rows=rows.filter(r=>r['Timestamp'].slice(0,10)>=UI.monitorFilters.from);
  if(UI.monitorFilters.to)rows=rows.filter(r=>r['Timestamp'].slice(0,10)<=UI.monitorFilters.to);
  const selectedTs=Object.keys(UI.monitorSelected).filter(k=>UI.monitorSelected[k]);
  if(selectedTs.length>0){ html+=`<div class="card" style="background:var(--parchment-2);padding:16px;"><div class="row" style="align-items:center"><span style="font-weight:700;">${selectedTs.length} Logs Selected</span><div class="row" style="flex:none"><select class="input-select" id="bulk-log-status" style="width:140px;"><option value="Logged">Logged</option><option value="Reviewed">Reviewed</option><option value="Flagged">Flagged</option></select><button class="btn btn-primary" onclick="bulkLogStatus()">Update Status</button></div></div></div>`; }
  html+=`<div class="table-wrap"><table><tr><th><input type="checkbox" onchange="Object.keys(UI.monitorSelected).forEach(k=>{UI.monitorSelected[k]=this.checked;});render();"></th><th>Timestamp</th><th>Item Details</th><th>Qty Produced/Wasted</th>${UI.monitorFilters.type==='wastage'?'<th>Reason</th>':''}<th>Review Status</th><th>Recorded By</th></tr>${rows.map(r=>`<tr><td><input type="checkbox" ${UI.monitorSelected[r['Timestamp']]?'checked':''} onchange="UI.monitorSelected['${r['Timestamp']}']=this.checked;render();"></td><td style="font-family:monospace;color:var(--ink-soft);font-size:12px;">${fmtDateTime(r['Timestamp'])}</td><td style="font-weight:600;color:var(--espresso)">${escHtml(r['Item Name'])}</td><td><span class="tag">${r['Quantity']} ${escHtml(r['Unit'])}</span></td>${UI.monitorFilters.type==='wastage'?`<td><span class="badge" style="background:#fdecec;color:var(--alert)">${escHtml(r['Reason'])}</span></td>`:''}<td><select class="input-select" onchange="setLogStatus('${r['Timestamp']}',this.value);" style="width:120px;padding:8px;font-size:12px;"><option value="Logged" ${r['Status']==='Logged'?'selected':''}>Logged</option><option value="Reviewed" ${r['Status']==='Reviewed'?'selected':''}>Reviewed</option><option value="Flagged" ${r['Status']==='Flagged'?'selected':''}>Flagged</option></select></td><td>${escHtml(r['Logged By'])}</td></tr>`).join('')}</table></div></div>`; return html;
}
async function setLogStatus(ts,st){const sheet=UI.monitorFilters.type==='production'?'Production':'Wastage';await api.updateLogStatus(sheet,ts,st);DB=await api.getAll();showToast('Status Updated');}
async function bulkLogStatus(){const st=document.getElementById('bulk-log-status').value;const sheet=UI.monitorFilters.type==='production'?'Production':'Wastage';const tsList=Object.keys(UI.monitorSelected).filter(k=>UI.monitorSelected[k]);for(const ts of tsList)await api.updateLogStatus(sheet,ts,st);DB=await api.getAll();UI.monitorSelected={};showToast('Bulk Applied');render();}

/* 5. COUNTS */
function renderCounts(){
  const enabled=DB.settings.InventoryCountEnabled==='true';
  return `<div class="card"><div class="section-title"><h3>Inventory Counts Module</h3><button class="btn ${enabled?'btn-danger':'btn-primary'}" onclick="toggleCount()">${enabled?'Deactivate Counts':'Activate Counts'}</button></div><p style="color:var(--ink-soft);margin-bottom:20px;">Current Status: <strong style="color:var(--espresso)">${enabled?'Active — Staff can log counts.':'Disabled — Module hidden from staff.'}</strong></p><div class="table-wrap"><table><tr><th>Count Month</th><th>Section</th><th>Item Name</th><th>Storage Qty</th><th>Ingredient Qty</th><th>Submitted By</th></tr>${DB.inventoryCounts.map(c=>`<tr><td style="font-family:monospace;font-weight:600">${escHtml(c['Count Date / Month'])}</td><td><span class="tag">${SECTION_LABEL[(c['Section']||'').toLowerCase()]||c['Section']}</span></td><td style="font-weight:600">${escHtml(c['Item Name'])}</td><td>${c['Storage Quantity']}</td><td>${c['Ingredient Quantity']}</td><td>${escHtml(c['Submitted By'])}</td></tr>`).join('')||'<tr><td colspan="6" class="empty-state">No inventory counts submitted yet.</td></tr>'}</table></div></div>`;
}
async function toggleCount(){const en=DB.settings.InventoryCountEnabled==='true';await api.setSetting('InventoryCountEnabled',en?'false':'true');DB=await api.getAll();render();}

/* 6. DATA EXPORT (NEW REQUIREMENT: EXPORT EVERY DATA TO CSV) */
function renderExport(){
  return `<div class="card"><div class="section-title"><h3>Data Export Center</h3></div><p style="color:var(--ink-soft);margin-bottom:24px;">Download raw system data into fully structured CSV files for Excel, Numbers, or any external POS systems.</p><div class="filters" style="background:#fff;border:none;padding:0;gap:24px;"><div class="card" style="margin:0;background:var(--parchment);box-shadow:none;border-color:var(--line)"><h4 style="margin-bottom:12px;font-family:'Fraunces',serif;font-size:18px;">🛒 Orders & Purchases</h4><p style="font-size:13px;color:var(--ink-soft);margin-bottom:16px;">Export all purchase orders logged by staff to suppliers.</p><button class="btn btn-primary" style="width:100%" onclick="exportData('orders')">Download Orders CSV</button></div><div class="card" style="margin:0;background:var(--parchment);box-shadow:none;border-color:var(--line)"><h4 style="margin-bottom:12px;font-family:'Fraunces',serif;font-size:18px;">🏭 Production Logs</h4><p style="font-size:13px;color:var(--ink-soft);margin-bottom:16px;">Export all in-house recipe and batch preparations.</p><button class="btn btn-primary" style="width:100%" onclick="exportData('production')">Download Production CSV</button></div><div class="card" style="margin:0;background:var(--parchment);box-shadow:none;border-color:var(--line)"><h4 style="margin-bottom:12px;font-family:'Fraunces',serif;font-size:18px;">🗑 Wastage Logs</h4><p style="font-size:13px;color:var(--ink-soft);margin-bottom:16px;">Export records of expired, spilled, or damaged items.</p><button class="btn btn-primary" style="width:100%" onclick="exportData('wastage')">Download Wastage CSV</button></div><div class="card" style="margin:0;background:var(--parchment);box-shadow:none;border-color:var(--line)"><h4 style="margin-bottom:12px;font-family:'Fraunces',serif;font-size:18px;">📊 Foodics / POS Count</h4><p style="font-size:13px;color:var(--ink-soft);margin-bottom:16px;">Export inventory counts formatted specifically for Foodics import.</p><button class="btn btn-primary" style="width:100%" onclick="exportData('counts')">Download Foodics CSV</button></div><div class="card" style="margin:0;background:var(--parchment);box-shadow:none;border-color:var(--line)"><h4 style="margin-bottom:12px;font-family:'Fraunces',serif;font-size:18px;">📦 Master Items List</h4><p style="font-size:13px;color:var(--ink-soft);margin-bottom:16px;">Export the complete database of items, SKUs, and units.</p><button class="btn btn-primary" style="width:100%" onclick="exportData('items')">Download Items CSV</button></div><div class="card" style="margin:0;background:var(--parchment);box-shadow:none;border-color:var(--line)"><h4 style="margin-bottom:12px;font-family:'Fraunces',serif;font-size:18px;">👥 Staff Roster</h4><p style="font-size:13px;color:var(--ink-soft);margin-bottom:16px;">Export all staff members and their section permissions.</p><button class="btn btn-primary" style="width:100%" onclick="exportData('staff')">Download Staff CSV</button></div></div></div>`;
}

function exportData(type) {
  const dateStr = todayISO();
  if (type === 'orders') {
    const headers = ['Timestamp', 'Order Date', 'Item Name', 'Quantity', 'Unit', 'Supplier', 'Status', 'Logged By'];
    const rows = DB.orders.map(o => [o['Timestamp'], o['Order Date'], o['Item Name'], o['Quantity'], o['Unit'], o['Supplier'], o['Status'], o['Logged By']]);
    downloadCSV(`Goya_Orders_${dateStr}.csv`, headers, rows);
  } else if (type === 'production') {
    const headers = ['Timestamp', 'Date', 'Item Name', 'Quantity', 'Unit', 'Status', 'Logged By'];
    const rows = DB.production.map(o => [o['Timestamp'], o['Date'], o['Item Name'], o['Quantity'], o['Unit'], o['Status'], o['Logged By']]);
    downloadCSV(`Goya_Production_${dateStr}.csv`, headers, rows);
  } else if (type === 'wastage') {
    const headers = ['Timestamp', 'Date', 'Item Name', 'Quantity', 'Unit', 'Reason', 'Status', 'Logged By'];
    const rows = DB.wastage.map(o => [o['Timestamp'], o['Date'], o['Item Name'], o['Quantity'], o['Unit'], o['Reason'], o['Status'], o['Logged By']]);
    downloadCSV(`Goya_Wastage_${dateStr}.csv`, headers, rows);
  } else if (type === 'counts') {
    const headers = ['Inventory Item Name', 'Inventory Item SKU', 'Storage quantity', 'Ingredients quantity', 'Inventory Count ID'];
    const rows = DB.inventoryCounts.map(o => [o['Item Name'], o['SKU']||'', o['Storage Quantity']||'', o['Ingredient Quantity']||'', '']);
    downloadCSV(`Foodics_Inventory_Import_${dateStr}.csv`, headers, rows);
  } else if (type === 'items') {
    const headers = ['Row ID', 'Name', 'SKU', 'Storage Unit', 'Ingredient Unit', 'Supplier', 'Items Type'];
    const rows = DB.items.map(o => [o['Row ID'], o['Name'], o['SKU'], o['Storage Unit'], o['Ingredient Unit'], o['Supplier'], o['Items Type']]);
    downloadCSV(`Goya_MasterItems_${dateStr}.csv`, headers, rows);
  } else if (type === 'staff') {
    const headers = ['PIN Code', 'Staff Full Name', 'Allowed Sections'];
    const rows = DB.staff.map(o => [o['PIN Code'], o['Staff Full Name'], o['Allowed Sections']]);
    downloadCSV(`Goya_StaffList_${dateStr}.csv`, headers, rows);
  }
}

/* 7. SETTINGS */
function renderSettings(){
  return `<div class="card"><div class="section-title"><h3>Google Sheet Database Connection</h3></div><div class="row" style="align-items:flex-end"><div style="flex:1"><label style="font-size:12px;font-weight:700;color:var(--ink-soft);display:block;margin-bottom:8px;">Apps Script Web App URL</label><input type="text" id="sheet-url" class="input-text" value="${escHtml(SHEET_URL)}"></div><button class="btn btn-primary" onclick="saveSheetUrl()" style="padding:14px 24px;">Link Database</button></div></div><div class="card"><div class="section-title"><h3>System Security</h3></div><div class="row" style="align-items:flex-end;max-width:400px"><div style="flex:1"><label style="font-size:12px;font-weight:700;color:var(--ink-soft);display:block;margin-bottom:8px;">Admin Master PIN</label><input type="text" id="new-master-pin" placeholder="Enter new 4-digit PIN" maxlength="4" class="input-text"></div><button class="btn btn-primary" onclick="changeMasterPin()" style="padding:14px 24px;">Update PIN</button></div></div><div class="card"><div class="section-title"><h3>Notification Settings</h3></div><p style="color:var(--ink-soft);margin-bottom:12px;">All purchase orders submitted by staff will trigger an automatic email to:</p><div style="padding:16px;background:var(--parchment-2);border-radius:8px;font-weight:700;color:var(--espresso);font-size:15px;display:inline-block">${OWNER_EMAIL}</div><p style="color:var(--ink-soft);margin-top:16px;font-size:13px;">This email is hardcoded into the backend script to ensure security and prevent unauthorized routing.</p></div>`;
}
async function changeMasterPin(){const v=document.getElementById('new-master-pin').value.trim();if(v.length!==4||!/^\d{4}$/.test(v)){showToast('Please enter exactly 4 digits');return;} await api.setSetting('MasterPin',v);DB=await api.getAll();showToast('Admin PIN Updated');render();}
async function saveSheetUrl(){const url=document.getElementById('sheet-url').value.trim();await connectSheet(url);showToast(url?'Database Linked Successfully':'Disconnected');setTimeout(()=>location.reload(),600);}

boot();
</script>
