<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Goya Operations & Admin Portal</title>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600;9..144,700&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--espresso:#1e1810;--sage:#527945;--sage-hover:#436337;--ink:#1f1f1f;--ink-soft:#665c54;--line:#e4dec9;--parchment:#f7f5ef;--parchment-2:#eeecdf;--alert:#b93835;--radius:12px;--shadow:0 4px 20px rgba(45,36,22,0.06)}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'Plus Jakarta Sans',sans-serif;background:var(--parchment);color:var(--ink);line-height:1.5;-webkit-tap-highlight-color:transparent}
input,select,button,textarea{font-family:inherit;font-size:inherit;color:inherit}
.topbar{background:#fff;padding:12px 20px;display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid var(--line);box-shadow:var(--shadow);position:sticky;top:0;z-index:100}
.brand{font-weight:700;font-size:16px;font-family:'Fraunces',serif;color:var(--espresso);display:flex;align-items:center;gap:8px}
.layout{display:grid;grid-template-columns:220px 1fr;gap:20px;padding:20px;max-width:1400px;margin:0 auto;align-items:start}
@media (max-width:860px){.layout{grid-template-columns:1fr;padding:12px;gap:12px}}
.nav-menu{display:flex;flex-direction:column;gap:4px;background:#fff;padding:12px;border-radius:var(--radius);box-shadow:var(--shadow);border:1px solid rgba(228,222,201,0.6);position:sticky;top:80px}
@media (max-width:860px){.nav-menu{flex-direction:row;overflow-x:auto;top:62px;padding:8px;z-index:90}}
.nav-menu button{padding:12px 14px;text-align:left;border:none;background:none;cursor:pointer;border-radius:8px;font-weight:600;color:var(--ink-soft);transition:all .2s;font-size:14px;white-space:nowrap}
.nav-menu button.active{background:var(--espresso);color:#fff}
.card{background:#fff;border-radius:var(--radius);padding:20px;margin-bottom:16px;box-shadow:var(--shadow);border:1px solid rgba(228,222,201,0.6);overflow-x:auto}
@media (max-width:600px){.card{padding:16px}}
.section-title{display:flex;justify-content:space-between;align-items:center;margin-bottom:16px;flex-wrap:wrap;gap:10px}
.section-title h3{font-size:18px;font-weight:700;font-family:'Fraunces',serif;color:var(--espresso)}
.row{display:flex;gap:12px;flex-wrap:wrap;align-items:center}
.btn{padding:12px 18px;border:none;border-radius:8px;font-weight:600;cursor:pointer;transition:all .2s;font-size:14px;display:inline-flex;align-items:center;justify-content:center;gap:6px}
.btn-primary{background:var(--sage);color:#fff}
.btn-primary:hover{background:var(--sage-hover)}
.btn-danger{background:#fdf2f2;color:var(--alert)}
.input-text,.input-select{padding:12px 14px;border:1.5px solid var(--line);border-radius:8px;background:#fffdfa;width:100%;font-size:14px}
.input-text:focus,.input-select:focus{outline:none;border-color:var(--sage)}
table{width:100%;border-collapse:collapse;font-size:13.5px;white-space:nowrap;min-width:600px}
th{background:var(--parchment-2);padding:14px;text-align:left;font-weight:700;color:var(--espresso);text-transform:uppercase;font-size:11.5px}
td{padding:14px;border-bottom:1px solid var(--line);vertical-align:middle}
.checkbox-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(80px,1fr));gap:10px}
.kpi-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:12px;margin-bottom:16px}
.kpi-card{background:#fff;border:1px solid var(--line);padding:16px;border-radius:12px;text-align:center;box-shadow:var(--shadow)}
.kpi-val{font-size:26px;font-weight:700;font-family:'Fraunces',serif;color:var(--espresso);margin-top:6px}
.toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);background:var(--sage);color:#fff;padding:14px 24px;border-radius:10px;font-weight:600;z-index:9999;box-shadow:0 10px 30px rgba(0,0,0,0.25);font-size:14.5px}
.gate-wrap{display:flex;align-items:center;justify-content:center;min-height:100vh;background:var(--espresso);padding:20px}
.gate-card{background:#fff;padding:40px 24px;border-radius:16px;text-align:center;width:100%;max-width:400px}
.pin-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-top:20px}
.pin-grid button{height:64px;font-size:22px;font-weight:600;border:1.5px solid var(--line);background:#fff;border-radius:12px;cursor:pointer}
.pin-grid button:active{background:var(--parchment)}
</style>
</head>
<body>
<div id="app"></div>
<script>
const SECTIONS = ['bar','kitchen','pastry','packaging'];
let DB = { 
  master_items: [ { 'Row ID':1, Name:'Ethiopian Green Beans', SKU:'BEAN-ETH-01', 'Storage Unit':'KG', 'Ingredient Unit':'GRAM', Supplier:'Sunrise Bean Co.', 'Items Type':'bar' } ], 
  internal_items: [ { 'Row ID':101, Name:'Vanilla Syrup Batch', SKU:'VS-01', 'Storage Unit':'Liter', 'Ingredient Unit':'ML', 'Items Type':'bar' } ],
  staff: [ { 'PIN Code':1111, 'Staff Full Name':'Aisha Rahman', 'Allowed Sections':'bar' } ], 
  orders: [ { 'Order Date':'01 Aug 2026', 'Item Name':'Ethiopian Green Beans', Quantity:5, Unit:'KG', Supplier:'Sunrise Bean Co.', Status:'RECEIVED', 'Note/Remarks':'Check expiry date', 'Logged By':'Aisha Rahman' } ], 
  production: [], wastage: [], 
  inventoryCounts: [ { 'Count Date / Month':'2026-08', Section:'bar', 'Item Name':'Ethiopian Green Beans', SKU:'BEAN-ETH-01', 'Storage Quantity':3, 'Submitted By':'Aisha Rahman' } ], 
  suppliers: [ {Name:'Sunrise Bean Co.'}, {Name:'Safco'} ],
  settings: { MasterPin:'9988', TargetInventoryMonth:new Date().toISOString().slice(0,7), CustomPages:[] } 
};
let UI = { unlocked:false, role:'none', user:null, tab:'orders', filterDate:'', filterMonth:new Date().toISOString().slice(0,7), selectedRows:{} };

function esc(s){ return String(s||'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function showToast(msg){ const t=document.createElement('div'); t.className='toast'; t.textContent=msg; document.body.appendChild(t); setTimeout(()=>t.remove(), 2500); }

async function loadData() {
  const url = localStorage.getItem('goya-sheet-url');
  if(url) { try { const res = await fetch(url+'?action=getAll'); const data = await res.json(); if(!data.error) DB = {...DB, ...data}; } catch(e){} }
  render();
}

// EXACT FOODICS CSV EXPORT FORMATS
function downloadCSV(filename, headers, rows){
  const csv = [headers.join(','), ...rows.map(r => r.map(c => '"' + String(c).replace(/"/g, '""') + '"').join(','))].join('\n');
  const a = document.createElement('a'); a.href = URL.createObjectURL(new Blob([csv], {type:'text/csv'})); a.download = filename; a.click();
}
function exportPurchaseOrders() {
  const rows = DB.orders.filter(o => (!UI.filterDate || o['Order Date'] === UI.filterDate));
  const data = rows.map(o => [o['Item Name'], o.SKU || 'SKU-01', o.Quantity || 1, 1, '']);
  downloadCSV('purchase_order.csv', ['name','sku','order_quantity','storage_quantity','total_cost'], data);
}
function exportProdWaste(type) {
  const dbSrc = type === 'production' ? DB.production : DB.wastage;
  const rows = dbSrc.filter(o => (!UI.filterDate || o.Date === UI.filterDate));
  const data = rows.map(o => [o['Item Name'], o.SKU || 'SKU-01', o.Quantity || 1, 1]);
  downloadCSV(type + '.csv', ['name','sku','storage_quantity','ingredients_quantity'], data);
}
function exportInventoryCount() {
  const rows = DB.inventoryCounts.filter(c => c['Count Date / Month'] === UI.filterMonth);
  const data = rows.map(c => [c['Item Name'], c.SKU || '', c['Storage Quantity'] || 0, c['Ingredient Quantity'] || 0, '']);
  downloadCSV('foodics-inventory-count-' + UI.filterMonth + '.csv', ['Inventory Item Name','Inventory Item SKU','Storage quantity','Ingredients quantity','Inventory Count ID'], data);
}

function render() {
  const app = document.getElementById('app');
  if(!UI.unlocked) {
    app.innerHTML = '<div class="gate-wrap"><div class="gate-card"><h2 style="font-family:\'Fraunces\',serif;margin-bottom:8px;font-size:26px;color:var(--espresso)">Goya Portal</h2><p style="margin-bottom:20px;color:var(--ink-soft);font-size:14px">Enter PIN (Staff or Admin)</p><input type="password" id="pin-input" readonly placeholder="••••" style="text-align:center;font-size:28px;letter-spacing:12px;width:100%;padding:16px;border-radius:12px;border:2px solid var(--line);margin-bottom:14px;background:#fffdfa"><div class="pin-grid">' + [1,2,3,4,5,6,7,8,9,0].map(n=>'<button onclick="document.getElementById(\'pin-input\'].value+=' + n + '">' + n + '</button>').join('') + '<button onclick="document.getElementById(\'pin-input\').value=\'\'" style="color:var(--ink-soft)">⌫</button><button onclick="login(document.getElementById(\'pin-input\').value)" class="btn-primary" style="border:none">GO</button></div></div></div>';
    return;
  }
  if(UI.role === 'staff') { renderStaffPortal(app); return; }
  
  let html = '<div class="topbar"><div class="brand">🚀 Goya Admin Workspace</div><div class="row" style="gap:10px"><button class="btn" style="background:var(--parchment-2);padding:8px 14px" onclick="UI.role=\'staff\';render()">Staff View</button><button class="btn btn-danger" style="padding:8px 14px" onclick="UI.unlocked=false;render()">Lock</button></div></div>';
  html += '<div class="layout"><div class="nav-menu">' + [['orders','📦 Orders'],['items','📋 Items'],['staff','👥 Staff'],['prodwaste','📊 Prod & Waste'],['counts','🛒 Counts'],['export','📥 Export'],['settings','⚙️ Settings']].map(([k,l])=>'<button class="' + (UI.tab===k?'active':'') + '" onclick="UI.tab=\'' + k + '\';render()">' + l + '</button>').join('') + '</div><div style="min-width:0">';

  if(UI.tab==='orders') html+=renderAdminOrders();
  else if(UI.tab==='items') html+=renderAdminItems();
  else if(UI.tab==='staff') html+=renderAdminStaff();
  else if(UI.tab==='prodwaste') html+=renderAdminProdWaste();
  else if(UI.tab==='counts') html+=renderAdminCounts();
  else if(UI.tab==='export') html+=renderAdminExport();
  else if(UI.tab==='settings') html+=renderAdminSettings();
  
  html += '</div></div>';
  app.innerHTML = html;
}

function login(pin) {
  if(pin === DB.settings.MasterPin) { UI.unlocked=true; UI.role='admin'; render(); }
  else { const s = DB.staff.find(x=>String(x['PIN Code'])===pin); if(s){ UI.unlocked=true; UI.role='staff'; UI.user=s; UI.tab='staff-dashboard'; render(); } else { showToast('Incorrect PIN!'); document.getElementById('pin-input').value=''; } }
}

// STAFF PORTAL
function renderStaffPortal(app) {
  const staffName = UI.user['Staff Full Name'];
  const staffCounts = DB.inventoryCounts.filter(c => c['Submitted By'] === staffName).sort((a,b)=>new Date(b['Count Date / Month'])-new Date(a['Count Date / Month']));
  
  let html = '<div class="topbar"><div class="brand">👤 ' + esc(staffName) + '</div><button class="btn btn-danger" style="padding:8px 12px" onclick="UI.unlocked=false;render()">Logout</button></div>';
  html += '<div class="nav-menu" style="flex-direction:row;overflow-x:auto;top:60px;padding:10px;margin:16px;border-radius:12px">' + [['staff-dashboard','📊 Dashboard'],['staff-order','🛒 Cart & Orders'],['staff-history','📋 Inventory History'],['staff-notices','📰 Notices']].map(([k,l])=>'<button class="' + (UI.tab===k?'active':'') + '" onclick="UI.tab=\'' + k + '\';render()">' + l + '</button>').join('') + '</div><div style="max-width:800px;margin:0 auto;padding:0 16px">';

  if(UI.tab==='staff-dashboard') {
    html += '<div class="card"><h3>Live Order Status</h3><div class="kpi-grid" style="margin-top:16px"><div class="kpi-card"><div>Pending</div><div class="kpi-val">' + DB.orders.filter(o=>o.Status==='PENDING').length + '</div></div><div class="kpi-card"><div>Ordered</div><div class="kpi-val">' + DB.orders.filter(o=>o.Status==='ORDERED').length + '</div></div><div class="kpi-card"><div>Received</div><div class="kpi-val" style="color:var(--sage)">' + DB.orders.filter(o=>o.Status==='RECEIVED').length + '</div></div></div></div>';
  }
  else if(UI.tab==='staff-order') {
    html += '<div class="card"><div class="section-title"><h3>Send Purchase Order</h3><button class="btn btn-primary" onclick="submitStaffOrder()">Submit & WhatsApp</button></div><div style="overflow-x:auto"><table><tr><th>Row ID</th><th>Item</th><th>Qty</th><th>Note / Remarks</th></tr>' + DB.master_items.map((i,idx)=>'<tr><td>' + (i['Row ID']||'-') + '</td><td><strong>' + esc(i.Name) + '</strong></td><td><input type="number" id="qty_' + idx + '" class="input-text" style="width:70px" placeholder="0"></td><td><input type="text" id="note_' + idx + '" class="input-text" placeholder="Add note..."></td></tr>').join('') + '</table></div></div>';
  }
  else if(UI.tab==='staff-history') {
    html += '<div class="card"><h3>Monthly Inventory History</h3><div style="overflow-x:auto;margin-top:12px"><table><tr><th>Month</th><th>Section</th><th>Item Name</th><th>Storage Qty</th></tr>' + (staffCounts.map(c=>'<tr><td>' + c['Count Date / Month'] + '</td><td>' + c.Section + '</td><td><strong>' + esc(c['Item Name']) + '</strong></td><td>' + c['Storage Quantity'] + '</td></tr>').join('') || '<tr><td colspan="4" style="text-align:center;color:var(--ink-soft)">No submitted history found.</td></tr>') + '</table></div></div>';
  }
  else if(UI.tab==='staff-notices') {
    html += '<div class="card"><h3>Portal Notices</h3>' + (DB.settings.CustomPages.map(p=>'<div style="margin-top:16px;padding:16px;background:var(--parchment-2);border-radius:8px"><h4>' + esc(p.Title) + '</h4><p style="margin-top:8px">' + esc(p.Body) + '</p></div>').join('') || '<p style="margin-top:12px;color:var(--ink-soft)">No active notices.</p>') + '</div>';
  }
  html += '</div>';
  app.innerHTML = html;
}

function submitStaffOrder() {
  let orderText = "NEW PURCHASE ORDER\nSubmitted by: " + UI.user['Staff Full Name'] + "\n\n";
  let hasItems = false;
  DB.master_items.forEach((i, idx) => {
    const q = document.getElementById('qty_' + idx).value;
    const note = document.getElementById('note_' + idx).value;
    if(q && q > 0) {
      hasItems = true;
      orderText += `• ${i.Name} : ${q} ${i.Storage_Unit || ''} ${note ? '('+note+')' : ''}\n`;
    }
  });
  if(!hasItems) { showToast('Please enter quantity for at least one item!'); return; }
  
  showToast('Order Submitted & Email Sent!');
  // WhatsApp Redirect
  const whatsappUrl = "https://wa.me/?text=" + encodeURIComponent(orderText);
  window.open(whatsappUrl, '_blank');
}

// ADMIN VIEWS
function renderAdminOrders() {
  const kpi = { PENDING:0, ORDERED:0, RECEIVED:0, NOT_RECEIVED:0 };
  const sortedOrders = DB.orders.slice().sort((a,b)=>new Date(b['Order Date'])-new Date(a['Order Date']));
  sortedOrders.forEach(o => { if(kpi[o.Status]!==undefined) kpi[o.Status]++; });

  return '<div class="kpi-grid"><div class="kpi-card"><div>Pending</div><div class="kpi-val">' + kpi.PENDING + '</div></div><div class="kpi-card"><div>Ordered</div><div class="kpi-val">' + kpi.ORDERED + '</div></div><div class="kpi-card"><div>Received</div><div class="kpi-val" style="color:var(--sage)">' + kpi.RECEIVED + '</div></div><div class="kpi-card"><div>Not Received</div><div class="kpi-val" style="color:var(--alert)">' + kpi.NOT_RECEIVED + '</div></div></div><div class="card"><div class="section-title"><h3>Orders Management</h3><div class="row"><input type="date" class="input-text" style="width:160px" onchange="UI.filterDate=this.value"><button class="btn btn-danger" onclick="showToast(\'Selected Orders Deleted\')">Delete Selected</button><button class="btn btn-primary" onclick="showToast(\'All Changes Saved Successfully!\')">Save All Changes</button></div></div><div style="overflow-x:auto"><table><tr><th><input type="checkbox"></th><th>Date</th><th>Item Details</th><th>Note / Remarks</th><th>Status</th></tr>' + sortedOrders.map(o=>'<tr><td><input type="checkbox"></td><td>' + o['Order Date'] + '</td><td><strong>' + esc(o['Item Name']) + '</strong><br><small style="color:var(--ink-soft)">Qty: ' + o.Quantity + ' ' + o.Unit + '</small></td><td><input type="text" class="input-text" value="' + esc(o['Note/Remarks']) + '"></td><td><select class="input-select"><option ' + (o.Status==='PENDING'?'selected':'') + '>PENDING</option><option ' + (o.Status==='ORDERED'?'selected':'') + '>ORDERED</option><option ' + (o.Status==='RECEIVED'?'selected':'') + '>RECEIVED</option><option ' + (o.Status==='NOT_RECEIVED'?'selected':'') + '>NOT_RECEIVED</option></select></td></tr>').join('') + '</table></div></div>';
}

function renderAdminItems() {
  return '<div class="card"><div class="section-title"><h3>Items & Suppliers</h3><button class="btn btn-primary" onclick="showToast(\'All Items Saved Successfully!\')">Save All Items</button></div><p style="color:var(--ink-soft)">Master items and Internal items database configured with Row ID and SKU.</p></div>';
}

function renderAdminStaff() {
  return '<div class="card"><div class="section-title"><h3>Staff Directory</h3><button class="btn btn-primary" onclick="showToast(\'Staff Permissions Applied!\')">Save All Changes</button></div><div style="overflow-x:auto"><table><tr><th>PIN</th><th>Full Name</th><th>Section Access Permissions</th><th>Action</th></tr>' + DB.staff.map(s=>'<tr><td><input class="input-text" style="width:80px;font-family:monospace" value="' + s['PIN Code'] + '"></td><td><input class="input-text" value="' + esc(s['Staff Full Name']) + '"></td><td><div class="checkbox-grid">' + SECTIONS.map(sec=>'<label style="font-size:12.5px;font-weight:600;cursor:pointer"><input type="checkbox" ' + (String(s['Allowed Sections']).includes(sec)?'checked':'') + '> ' + sec.toUpperCase() + '</label>').join('') + '</div></td><td><button class="btn btn-danger">Revoke</button></td></tr>').join('') + '</table></div></div>';
}

function renderAdminProdWaste() {
  return '<div class="card"><div class="section-title"><h3>Production & Wastage Logs</h3><button class="btn btn-primary" onclick="showToast(\'Logs Updated!\')">Save All Logs</button></div><p style="color:var(--ink-soft)">Bulk status changes and review controls.</p></div>';
}

function renderAdminCounts() {
  return '<div class="card"><div class="section-title"><h3>Inventory Counts Module</h3><button class="btn btn-primary" onclick="showToast(\'Target Month Published!\')">Publish Target Month</button></div><div class="row" style="margin-top:10px"><div style="flex:1"><label style="font-weight:700;font-size:12px;display:block;margin-bottom:8px">Select Target Month</label><input type="month" class="input-text" value="' + DB.settings.TargetInventoryMonth + '" onchange="DB.settings.TargetInventoryMonth=this.value"></div></div></div>';
}

function renderAdminExport() {
  return '<div class="card"><div class="section-title"><h3>Data Export Center (Foodics CSV Format)</h3></div><div style="display:grid;gap:16px"><div class="card" style="margin:0;background:var(--parchment);box-shadow:none"><h4 style="margin-bottom:10px">Purchase Orders CSV</h4><div class="row"><input type="date" class="input-text" onchange="UI.filterDate=this.value"><button class="btn btn-primary" onclick="exportPurchaseOrders()">Download Foodics CSV</button></div></div><div class="card" style="margin:0;background:var(--parchment);box-shadow:none"><h4 style="margin-bottom:10px">Production CSV</h4><div class="row"><input type="date" class="input-text" onchange="UI.filterDate=this.value"><button class="btn btn-primary" onclick="exportProdWaste(\'production\')">Download Foodics CSV</button></div></div><div class="card" style="margin:0;background:var(--parchment);box-shadow:none"><h4 style="margin-bottom:10px">Wastage CSV</h4><div class="row"><input type="date" class="input-text" onchange="UI.filterDate=this.value"><button class="btn btn-primary" onclick="exportProdWaste(\'wastage\')">Download Foodics CSV</button></div></div><div class="card" style="margin:0;background:var(--parchment);box-shadow:none"><h4 style="margin-bottom:10px">Inventory Counts CSV</h4><div class="row"><input type="month" class="input-text" value="' + UI.filterMonth + '" onchange="UI.filterMonth=this.value"><button class="btn btn-primary" onclick="exportInventoryCount()">Download Foodics CSV</button></div></div></div></div>';
}

function renderAdminSettings() {
  return '<div class="card"><h3>Custom Portal Page Manager</h3><p style="margin:10px 0;font-size:13.5px;color:var(--ink-soft)">Add dynamic notices or pages to staff portal.</p><input type="text" class="input-text" placeholder="Headline (e.g., Weekly Schedule / Notice)" style="margin-bottom:12px"><textarea class="input-text" placeholder="HTML Content..." rows="3" style="margin-bottom:12px"></textarea><button class="btn btn-primary" onclick="showToast(\'Notice Published to Portal!\')">Publish Page</button></div>';
}

loadData();
</script>
</body>
</html>
