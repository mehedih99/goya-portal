<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Admin Workspace — Goya</title>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&family=Plus+Jakarta+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{--espresso:#1e1810;--espresso-light:#2d2416;--sage:#527945;--sage-hover:#436337;--ink:#1f1f1f;--ink-soft:#665c54;--line:#e4dec9;--parchment:#f7f5ef;--parchment-2:#eeecdf;--alert:#b93835;--radius:12px;--shadow:0 4px 20px rgba(45,36,22,0.06)}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'Plus Jakarta Sans',sans-serif;background:var(--parchment);color:var(--ink);line-height:1.5;-webkit-tap-highlight-color:transparent}
input,select,button,textarea{font-family:inherit;font-size:inherit;color:inherit}
.topbar{background:#fff;padding:14px 20px;display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid var(--line);box-shadow:var(--shadow);position:sticky;top:0;z-index:100}
.brand{font-weight:700;font-size:16px;font-family:'Fraunces',serif;color:var(--espresso);display:flex;align-items:center;gap:8px}
.admin-layout{display:grid;grid-template-columns:220px 1fr;gap:20px;padding:20px 16px;max-width:1400px;margin:0 auto;align-items:start}
@media (max-width:860px){.admin-layout{grid-template-columns:1fr}}
.admin-nav{display:flex;flex-direction:column;gap:4px;background:#fff;padding:12px;border-radius:var(--radius);box-shadow:var(--shadow);border:1px solid rgba(228,222,201,0.6);position:sticky;top:80px;overflow-x:auto}
.admin-nav button{padding:12px 14px;text-align:left;border:none;background:none;cursor:pointer;border-radius:8px;font-weight:600;color:var(--ink-soft);transition:all .2s;display:flex;align-items:center;gap:10px;font-size:14px;white-space:nowrap}
.admin-nav button.active{background:var(--espresso);color:#fff}
.admin-nav button:hover:not(.active){background:var(--parchment-2);color:var(--espresso)}
.card{background:#fff;border-radius:var(--radius);padding:20px;margin-bottom:16px;box-shadow:var(--shadow);border:1px solid rgba(228,222,201,0.6)}
.section-title{display:flex;justify-content:space-between;align-items:center;margin-bottom:16px;flex-wrap:wrap;gap:10px}
.section-title h3{font-size:18px;font-weight:700;font-family:'Fraunces',serif;color:var(--espresso)}
.row{display:flex;gap:12px;flex-wrap:wrap;align-items:center}
.row>*{min-width:0;flex:1}
.btn{padding:10px 16px;border:none;border-radius:8px;font-weight:600;cursor:pointer;transition:all .2s;font-size:13.5px;display:inline-flex;align-items:center;justify-content:center;gap:6px;}
.btn-primary{background:var(--sage);color:#fff}
.btn-primary:hover{background:var(--sage-hover);transform:translateY(-1px)}
.btn-ghost{background:transparent;border:1.5px solid var(--line);color:var(--ink)}
.btn-ghost:hover{background:var(--parchment)}
.btn-danger{background:#fdf2f2;color:var(--alert)}
.btn-danger:hover{background:#fae1e1}
.btn-sm{padding:6px 12px;font-size:12px}
.input-text,.input-number,.input-select{padding:12px 14px;border:1.5px solid var(--line);border-radius:8px;background:#fffdfa;width:100%;transition:all .2s;font-size:14px}
.input-text:focus,.input-number:focus,.input-select:focus{outline:none;border-color:var(--sage);box-shadow:0 0 0 3px rgba(82,121,69,0.12);background:#fff}
.table-wrap{overflow-x:auto;margin:14px 0;border-radius:8px;border:1px solid var(--line);-webkit-overflow-scrolling:touch}
.table-wrap table{width:100%;border-collapse:collapse;font-size:13px;white-space:nowrap}
.table-wrap th{background:var(--parchment-2);padding:12px 14px;text-align:left;font-weight:700;color:var(--espresso);text-transform:uppercase;font-size:11px;letter-spacing:0.5px;border-bottom:2px solid var(--line)}
.table-wrap td{padding:12px 14px;border-bottom:1px solid var(--line);vertical-align:middle}
.table-wrap tr:hover td{background:#faf8f5}
.table-wrap tr:last-child td{border-bottom:none}
.gate-wrap{display:flex;align-items:center;justify-content:center;min-height:100vh;background:var(--espresso);padding:16px;}
.gate-card{background:#fff;padding:36px 24px;border-radius:16px;box-shadow:0 20px 60px rgba(0,0,0,.25);max-width:420px;width:100%}
.badge{display:inline-block;padding:4px 10px;border-radius:20px;font-size:11px;font-weight:700;text-transform:uppercase;background:var(--parchment-2);color:var(--ink)}
.tag{display:inline-block;padding:6px 10px;border-radius:6px;background:#e5f0e1;color:var(--sage);font-size:11.5px;font-weight:700}
.filters{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:12px;margin-bottom:16px;background:var(--parchment);padding:16px;border-radius:10px;border:1px solid var(--line)}
.filter-item label{display:block;font-size:11px;font-weight:700;color:var(--espresso);margin-bottom:6px;text-transform:uppercase;letter-spacing:0.5px}
.pin-pad{text-align:center}
.pin-grid{display:grid;grid-template-columns:repeat(3,64px);gap:10px;justify-content:center;margin-bottom:16px}
.pin-grid button{width:64px;height:64px;font-size:22px;font-weight:600;border:1.5px solid var(--line);background:#fff;border-radius:12px;cursor:pointer;transition:all 0.1s}
.pin-grid button:active{background:var(--parchment);transform:scale(0.95)}
.overlay{position:fixed;inset:0;background:rgba(30,24,16,0.85);backdrop-filter:blur(4px);display:flex;align-items:center;justify-content:center;z-index:9999;padding:16px}
.modal{background:#fff;padding:28px;border-radius:16px;box-shadow:0 20px 40px rgba(0,0,0,.25);max-width:380px;width:100%}
</style>
</head>
<body>
<div id="app"></div>
<script>
const STATUSES = ['PENDING','ORDERED','RECEIVED','NOT_RECEIVED','REJECTED'];
const STATUS_LABEL = {PENDING:'Pending',ORDERED:'Ordered',RECEIVED:'Received',NOT_RECEIVED:'Not Received',REJECTED:'Rejected'};
const SECTIONS = ['kitchen','pastry','bar','packaging','internal'];
const SECTION_LABEL = {kitchen:'Kitchen',pastry:'Pastry',bar:'Bar',packaging:'Packaging',internal:'Internal'};

let SHEET_URL = '';
let LOCAL_DB = null;

function seedData(){
  return {
    items:[
      {'Row ID':'1','Name':'Ethiopian Green Beans','SKU':'BN-01','Storage Unit':'KG','Ingredient Unit':'GRAM','Supplier':'Sunrise Beans','Items Type':'kitchen'},
      {'Row ID':'2','Name':'Oat Milk','SKU':'MLK-01','Storage Unit':'Liter','Ingredient Unit':'ML','Supplier':'Dairy Fresh','Items Type':'bar'},
      {'Row ID':'3','Name':'Vanilla Syrup Batch','SKU':'VS-01','Storage Unit':'Liter','Ingredient Unit':'ML','Supplier':'','Items Type':'internal'},
    ],
    staff:[
      {'PIN Code':'1111','Staff Full Name':'Aisha Rahman','Allowed Sections':'bar'},
      {'PIN Code':'2222','Staff Full Name':'Rahim Uddin','Allowed Sections':'kitchen,pastry'},
    ],
    orders:[], production:[], wastage:[], inventoryCounts:[], suppliers:[],
    settings:{ MasterPin:'9988', ConnectionPin:'9988', InventoryCountEnabled:'true', OwnerEmail:'mehedi.src@gmail.com' }
  };
}

async function getLocalSetting(key){ try{ return JSON.parse(localStorage.getItem(key)||'null'); }catch(e){ return null; } }
async function setLocalSetting(key, val){ localStorage.setItem(key, JSON.stringify(val)); }

async function initBackend(){
  try {
    SHEET_URL = await getLocalSetting('goya-sheet-url') || '';
  } catch(e) { SHEET_URL = ''; }
}

async function connectSheet(url){
  SHEET_URL = (url||'').trim();
  await setLocalSetting('goya-sheet-url', SHEET_URL);
}

async function sheetPost(action, body){
  if(!SHEET_URL) throw new Error('Sheet not connected');
  const resp = await fetch(SHEET_URL, {method:'POST', body:JSON.stringify({action,...body})});
  return resp.json();
}

const api = {
  async getAll(){
    if(!SHEET_URL) return seedData();
    try{
      const resp = await fetch(SHEET_URL+'?action=getAll');
      const data = await resp.json();
      if(!data || data.error) return seedData();
      return {
        items: data.items || [],
        staff: data.staff || [],
        orders: data.orders || [],
        production: data.production || [],
        wastage: data.wastage || [],
        inventoryCounts: data.inventoryCounts || [],
        suppliers: data.suppliers || [],
        settings: data.settings || { MasterPin:'9988', ConnectionPin:'9988', InventoryCountEnabled:'true', OwnerEmail:'mehedi.src@gmail.com' }
      };
    }catch(e){ return seedData(); }
  },
  async updateOrderStatus(timestamp, status, receivedDate){
    if(SHEET_URL) await sheetPost('updateOrderStatus',{timestamp,status,receivedDate});
    else{ const o=LOCAL_DB.orders.find(x=>x['Timestamp']===timestamp); if(o) o['Status']=status; await saveLocalDB(); }
  },
  async bulkUpdateOrderStatus(timestamps, status){
    if(SHEET_URL) await sheetPost('bulkUpdateOrderStatus',{timestamps,status});
    else{ LOCAL_DB.orders.forEach(o=>{ if(timestamps.includes(o['Timestamp'])) o['Status']=status; }); await saveLocalDB(); }
  },
  async updateLogStatus(sheet, timestamp, status){
    if(SHEET_URL) await sheetPost('updateLogStatus',{sheet,timestamp,status});
    else{ const arr=sheet==='Production'?LOCAL_DB.production:LOCAL_DB.wastage; const r=arr.find(x=>x['Timestamp']===timestamp); if(r) r['Status']=status; await saveLocalDB(); }
  },
  async upsertItem(item){
    if(SHEET_URL) return sheetPost('upsertItem',{item});
    else{ const i=LOCAL_DB.items.find(x=>x['Row ID']===item.rowId); const row={'Row ID':item.rowId||Date.now().toString(),'Name':item.name,'SKU':item.sku||'','Storage Unit':item.storageUnit||'','Ingredient Unit':item.ingredientUnit||'','Supplier':item.supplier||'','Items Type':item.itemsType||'internal'}; if(i) Object.assign(i,row); else LOCAL_DB.items.push(row); await saveLocalDB(); }
  },
  async deleteItem(rowId){
    if(SHEET_URL) await sheetPost('deleteItem',{rowId});
    else{ LOCAL_DB.items=LOCAL_DB.items.filter(x=>x['Row ID']!==rowId); await saveLocalDB(); }
  },
  async upsertStaff(staff, oldPin){
    if(SHEET_URL) return sheetPost('upsertStaff',{staff,oldPin});
    else{ const matchPin=oldPin||staff.pin; const s=LOCAL_DB.staff.find(x=>x['PIN Code']===matchPin); const row={'PIN Code':staff.pin,'Staff Full Name':staff.name,'Allowed Sections':(staff.allowedSections||[]).join(',')}; if(s) Object.assign(s,row); else LOCAL_DB.staff.push(row); await saveLocalDB(); }
  },
  async deleteStaff(pin){
    if(SHEET_URL) await sheetPost('deleteStaff',{pin});
    else{ LOCAL_DB.staff=LOCAL_DB.staff.filter(x=>x['PIN Code']!==pin); await saveLocalDB(); }
  },
  async upsertSupplier(supplier, oldName){
    if(SHEET_URL) await sheetPost('upsertSupplier',{supplier,oldName});
    else{ const matchName=oldName||supplier.name; const s=LOCAL_DB.suppliers.find(x=>x['Name']===matchName); const row={'Name':supplier.name,'Phone':supplier.phone||'','Group Link':supplier.groupLink||''}; if(s) Object.assign(s,row); else LOCAL_DB.suppliers.push(row); await saveLocalDB(); }
  },
  async deleteSupplier(name){
    if(SHEET_URL) await sheetPost('deleteSupplier',{name});
    else{ LOCAL_DB.suppliers=LOCAL_DB.suppliers.filter(x=>x['Name']!==name); await saveLocalDB(); }
  },
  async setSetting(key, value){
    if(SHEET_URL) return sheetPost('setSetting',{key,value});
    else{ LOCAL_DB.settings[key]=value; await saveLocalDB(); }
  }
};

async function saveLocalDB(){ if(LOCAL_DB) localStorage.setItem('goya-local-db', JSON.stringify(LOCAL_DB)); }
async function loadLocalDB(){ try{ LOCAL_DB = JSON.parse(localStorage.getItem('goya-local-db')); if(!LOCAL_DB) LOCAL_DB = seedData(); }catch(e){ LOCAL_DB = seedData(); } }

function escHtml(s){ return String(s||'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function fmtDate(iso){ return iso? iso.slice(0,10) : ''; }
function fmtDateTime(iso){ return iso? iso.slice(0,16).replace('T',' ') : ''; }
function todayISO(){ return new Date().toISOString().slice(0,10); }
function currentMonthISO(){ return new Date().toISOString().slice(0,7); }

function showToast(msg){
  const t = document.createElement('div');
  t.style.cssText = 'position:fixed;bottom:24px;left:50%;transform:translateX(-50%);background:var(--espresso);color:#fff;padding:12px 20px;border-radius:10px;font-size:13.5px;font-weight:500;z-index:9999;box-shadow:0 10px 30px rgba(0,0,0,0.2)';
  t.textContent = msg; document.body.appendChild(t); setTimeout(()=>t.remove(), 2500);
}

function openPinPad(title, onSubmit){
  const holder = document.createElement('div'); holder.className='overlay'; let input = '';
  const pad = '<div class="pin-pad"><h3 style="margin-bottom:16px;font-family:\'Fraunces\',serif;font-size:20px;color:var(--espresso);">' + escHtml(title) + '</h3><input type="password" id="pin-input" placeholder="••••" readonly style="text-align:center;font-size:24px;letter-spacing:10px;width:140px;height:54px;border:2px solid var(--line);border-radius:10px;margin:0 auto 20px;display:block;background:#fffdfa;color:var(--espresso)"><div class="pin-grid">' + [1,2,3,4,5,6,7,8,9,0].map(n=>'<button onclick="insertPin(' + n + ')">' + n + '</button>').join('') + '<button onclick="deletePin()" style="grid-column:2;background:var(--parchment-2);color:var(--ink-soft)">⌫</button></div><div class="row" style="margin-top:16px;"><button class="btn btn-primary" style="width:100%;padding:12px;" onclick="submitPin()">Confirm</button></div></div>';
  holder.innerHTML = '<div class="modal">' + pad + '</div>'; document.body.appendChild(holder);
  window.pinInput = () => document.getElementById('pin-input');
  window.insertPin = (n) => { if(input.length<4){input+=n; window.pinInput().value='•'.repeat(input.length);} };
  window.deletePin = () => { input = input.slice(0,-1); window.pinInput().value='•'.repeat(input.length); };
  window.submitPin = async () => { if(await onSubmit(input)){ holder.remove(); } else { showToast('Incorrect PIN'); input=''; window.pinInput().value=''; } };
}

function downloadCSV(filename, headers, rows){
  const csvRows = [headers.map(h => '"' + String(h).replace(/"/g, '""') + '"').join(',')];
  rows.forEach(r => {
    const rowStr = r.map(cell => '"' + String(cell).replace(/"/g, '""') + '"').join(',');
    csvRows.push(rowStr);
  });
  const blob = new Blob([csvRows.join('\n')], { type: 'text/csv;charset=utf-8;' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = filename; a.click();
  URL.revokeObjectURL(url);
}

let DB={items:[],staff:[],orders:[],production:[],wastage:[],inventoryCounts:[],suppliers:[],settings:{}};
let UI={
  loaded:false, unlocked:false, tab:'orders',
  orderFilters:{search:'',status:'',supplier:'',from:'',to:''}, orderSelected:{},
  monitorFilters:{type:'production',from:'',to:''}, monitorSelected:{},
  countFilters:{month:currentMonthISO()}
};

async function boot(){
  try {
    await loadLocalDB();
    await initBackend();
    DB = await api.getAll();
    if(!DB || typeof DB !== 'object') DB = seedData();
  } catch(e) {
    DB = seedData();
  }
  UI.loaded = true;
  render();
}

function render(){
  const app = document.getElementById('app');
  if(!app) return;
  try {
    if(!UI.loaded){
      app.innerHTML = '<div class="gate-wrap"><div class="gate-card"><h2 style="text-align:center;font-family:\'Fraunces\',serif;font-size:26px;color:var(--espresso)">Admin Panel</h2><p style="text-align:center;color:var(--ink-soft);margin-top:8px;">Loading securely...</p></div></div>';
      return;
    }
    if(!UI.unlocked){
      app.innerHTML = '<div class="gate-wrap"><div class="gate-card"><h2 style="text-align:center;font-family:\'Fraunces\',serif;font-size:24px;color:var(--espresso);margin-bottom:6px;">Admin Access</h2><p style="color:var(--ink-soft);font-size:13.5px;margin-bottom:20px;">Enter Master PIN to continue.</p><button class="btn btn-primary" style="width:100%;padding:12px;" onclick="openPinPad(\'Master PIN\', async(e)=>{if(e===(DB.settings?.MasterPin||\'9988\')){UI.unlocked=true;render();return true;}return false;})">Unlock Panel</button></div></div>';
      return;
    }
    let html = '<div class="topbar"><div class="brand">🚀 Goya Admin Workspace</div><button class="btn btn-ghost btn-sm" onclick="UI.unlocked=false;render();">Lock Session</button></div>';
    html += '<div class="admin-layout"><div class="admin-nav">' + [['orders','📦 Orders'],['items','📋 Items & Suppliers'],['staff','👥 Staff'],['monitor','📊 Prod & Waste'],['counts','🛒 Inventory Counts'],['export','📥 Data Export'],['settings','⚙️ Settings']].map(([k,l])=>'<button class="' + (UI.tab===k?'active':'') + '" onclick="UI.tab=\'' + k + '\';render();">' + l + '</button>').join('') + '</div><div>';
    
    if(UI.tab==='orders') html+=renderOrders();
    else if(UI.tab==='items') html+=renderItems();
    else if(UI.tab==='staff') html+=renderStaff();
    else if(UI.tab==='monitor') html+=renderMonitor();
    else if(UI.tab==='counts') html+=renderCounts();
    else if(UI.tab==='export') html+=renderExport();
    else html+=renderSettings();

    html += '</div></div>';
    app.innerHTML = html;
  } catch(err) {
    app.innerHTML = '<div class="gate-wrap"><div class="gate-card"><h3 style="color:var(--alert);margin-bottom:10px;">Rendering Error</h3><p style="font-size:13px;color:var(--ink-soft);">' + escHtml(err.message) + '</p><button class="btn btn-primary" style="margin-top:16px;width:100%" onclick="localStorage.clear();location.reload();">Reset & Reload</button></div></div>';
  }
}

/* 1. ORDERS */
function renderOrders(){
  const orders = DB.orders || [];
  let html = '<div class="card"><div class="section-title"><h3>Orders Management</h3><div class="row" style="flex:none;gap:8px;"><button class="btn btn-primary btn-sm" onclick="exportOrdersCSV()">📥 Download CSV</button><span class="badge">' + orders.length + ' Records</span></div></div><div class="filters"><div class="filter-item"><label>Search Item</label><input type="text" class="input-text" value="' + escHtml(UI.orderFilters.search) + '" oninput="UI.orderFilters.search=this.value;render();"></div><div class="filter-item"><label>Status</label><select class="input-select" onchange="UI.orderFilters.status=this.value;render();"><option value="">All Statuses</option>' + STATUSES.map(s=>'<option value="' + s + '" ' + (UI.orderFilters.status===s?'selected':'') + '>' + STATUS_LABEL[s] + '</option>').join('') + '</select></div><div class="filter-item"><label>Supplier</label><select class="input-select" onchange="UI.orderFilters.supplier=this.value;render();"><option value="">All Suppliers</option>' + [...new Set(orders.map(o=>o['Supplier']))].filter(Boolean).map(s=>'<option value="' + escHtml(s) + '" ' + (UI.orderFilters.supplier===s?'selected':'') + '>' + escHtml(s) + '</option>').join('') + '</select></div><div class="filter-item"><label>From</label><input type="date" class="input-text" value="' + UI.orderFilters.from + '" onchange="UI.orderFilters.from=this.value;render();"></div><div class="filter-item"><label>To</label><input type="date" class="input-text" value="' + UI.orderFilters.to + '" onchange="UI.orderFilters.to=this.value;render();"></div></div>';
  let rows = orders.slice().sort((a,b)=>new Date(b['Timestamp']||0)-new Date(a['Timestamp']||0));
  if(UI.orderFilters.search) rows = rows.filter(o=>(o['Item Name']||'').toLowerCase().includes(UI.orderFilters.search.toLowerCase()));
  if(UI.orderFilters.status) rows = rows.filter(o=>o['Status']===UI.orderFilters.status);
  if(UI.orderFilters.supplier) rows = rows.filter(o=>o['Supplier']===UI.orderFilters.supplier);
  if(UI.orderFilters.from) rows = rows.filter(o=>(o['Timestamp']||'').slice(0,10)>=UI.orderFilters.from);
  if(UI.orderFilters.to) rows = rows.filter(o=>(o['Timestamp']||'').slice(0,10)<=UI.orderFilters.to);
  const selectedTs = Object.keys(UI.orderSelected).filter(k=>UI.orderSelected[k]);
  const allSelected = rows.length > 0 && rows.every(o => UI.orderSelected[o['Timestamp']]);
  
  if(selectedTs.length>0){
    html += '<div class="card" style="background:var(--parchment-2);padding:14px;"><div class="row" style="align-items:center"><span style="font-weight:700;font-size:13.5px;">' + selectedTs.length + ' Selected</span><div class="row" style="flex:none"><select class="input-select" id="bulk-status" style="width:140px;padding:8px;"><option value="PENDING">Pending</option><option value="ORDERED">Ordered</option><option value="RECEIVED">Received</option></select><button class="btn btn-primary btn-sm" onclick="bulkStatus()">Apply Status</button></div></div></div>';
  }
  html += '<div class="table-wrap"><table><tr><th><input type="checkbox" ' + (allSelected?'checked':'') + ' onchange="toggleSelectAll(this.checked)" style="width:16px;height:16px;cursor:pointer"></th><th>Date</th><th>Item Details</th><th>Qty</th><th>Supplier</th><th>Status</th><th>Logged By</th></tr>' + rows.map(o=>'<tr><td><input type="checkbox" ' + (UI.orderSelected[o['Timestamp']]?'checked':'') + ' onchange="UI.orderSelected[\'' + escHtml(o['Timestamp']) + '\']=this.checked;render();" style="width:16px;height:16px;cursor:pointer"></td><td style="font-family:\'IBM Plex Mono\',monospace;font-size:11.5px;color:var(--ink-soft)">' + fmtDateTime(o['Timestamp']) + '</td><td><div style="font-weight:600;color:var(--espresso)">' + escHtml(o['Item Name']) + '</div></td><td><span class="tag">' + o['Quantity'] + ' ' + escHtml(o['Unit']) + '</span></td><td>' + escHtml(o['Supplier']) + '</td><td><div class="row" style="gap:6px;"><select class="input-select" id="status-' + escHtml(o['Timestamp']) + '" style="width:110px;font-size:12px;padding:6px;"><option value="PENDING" ' + (o['Status']==='PENDING'?'selected':'') + '>Pending</option><option value="ORDERED" ' + (o['Status']==='ORDERED'?'selected':'') + '>Ordered</option><option value="RECEIVED" ' + (o['Status']==='RECEIVED'?'selected':'') + '>Received</option></select><button class="btn btn-primary btn-sm" onclick="saveSingleStatus(\'' + escHtml(o['Timestamp']) + '\')">Save</button></div></td><td>' + escHtml(o['Logged By']) + '</td></tr>').join('') + '</table></div></div>'; 
  return html;
}

function toggleSelectAll(checked){
  let rows = (DB.orders||[]).slice();
  rows.forEach(o => { if(o['Timestamp']) UI.orderSelected[o['Timestamp']] = checked; });
  render();
}

async function saveSingleStatus(ts){
  const sel = document.getElementById('status-' + ts);
  if(!sel) return;
  const st = sel.value;
  await api.updateOrderStatus(ts, st, st==='RECEIVED'?todayISO():'');
  DB = await api.getAll();
  showToast('Status Updated Successfully');
  render();
}

async function bulkStatus(){
  const st = document.getElementById('bulk-status').value;

ow" style="margin-top:16px;padding-top:16px;border-top:1px solid var(--line);align-items:flex-start"><input class="input-text" id="new-item-name" placeholder="Item Name"><input class="input-text" id="new-item-sku" placeholder="SKU"><div style="display:flex;flex-direction:column;gap:10px;flex:1"><input class="input-text" id="new-item-storage" placeholder="Storage Unit"><input class="input-text" id="new-item-ingredient" placeholder="Ingredient Unit"></div><div style="display:flex;flex-direction:column;gap:10px;flex:1"><select class="input-select" id="new-item-supplier"><option value="">— Internal Batch —</option>' + suppliers.map(s=>'<option value="' + escHtml(s['Name']) + '">' + escHtml(s['Name']) + '</option>').join('') + '</select><select class="input-select" id="new-item-type"><option value="kitchen">Kitchen</option><option value="pastry">Pastry</option><option value="bar">Bar</option><option value="packaging">Packaging</option><option value="internal" selected>Internal</option></select></div><button class="btn btn-primary" style="align-self:stretch" onclick="addItem()">Add Item</button></div></div>';

async function saveSupplier(oldName){
  const name = document.getElementById('sup-name-' + oldName).value.trim();
  const phone = document.getElementById('sup-phone-' + oldName).value.trim();
  if(!name) return;
  await api.upsertSupplier({name, phone, groupLink:''}, oldName);
  DB = await api.getAll(); showToast('Supplier Saved'); render();
}

async function deleteSupplier(n){
  await api.deleteSupplier(n);
  DB = await api.getAll(); render();
}

async function addSupplier(){
  const n = document.getElementById('new-sup-name').value.trim();
  if(!n) return;
  await api.upsertSupplier({name:n, phone:document.getElementById('new-sup-phone').value.trim(), groupLink:''});
  DB = await api.getAll(); render();
}

async function saveItem(rowId){
  const name = document.getElementById('item-name-' + rowId).value.trim();
  const sku = document.getElementById('item-sku-' + rowId).value.trim();
  const storageUnit = document.getElementById('item-storage-' + rowId).value.trim();
  const ingredientUnit = document.getElementById('item-ingredient-' + rowId).value.trim();
  const supplier = document.getElementById('item-sup-' + rowId).value;
  const itemsType = document.getElementById('item-type-' + rowId).value;
  if(!name) return;
  await api.upsertItem({rowId, name, sku, storageUnit, ingredientUnit, supplier, itemsType});
  DB = await api.getAll(); showToast('Item Saved Successfully'); render();
}

async function deleteItem(rowId){
  await api.deleteItem(rowId);
  DB = await api.getAll(); render();
}

async function addItem(){
  const name = document.getElementById('new-item-name').value.trim();

    rowId: Date.now().toString(), name,

/* 4. MONITOR (PROD & WASTE) */
function renderMonitor(){
  let html = '<div class="card"><div class="section-title"><h3>Production & Wastage Logs</h3><div class="row" style="flex:none;gap:8px;"><button class="btn btn-primary btn-sm" onclick="exportMonitorCSV()">📥 Download CSV</button></div></div><div class="filters"><div class="filter-item"><label>Log Type</label><select class="input-select" onchange="UI.monitorFilters.type=this.value;render();"><option value="production" ' + (UI.monitorFilters.type==='production'?'selected':'') + '>🏭 Production Batches</option><option value="wastage" ' + (UI.monitorFilters.type==='wastage'?'selected':'') + '>🗑 Wastage / Damages</option></select></div><div class="filter-item"><label>From</label><input type="date" class="input-text" value="' + UI.monitorFilters.from + '" onchange="UI.monitorFilters.from=this.value;render();"></div><div class="filter-item"><label>To</label><input type="date" class="input-text" value="' + UI.monitorFilters.to + '" onchange="UI.monitorFilters.to=this.value;render();"></div></div>';
  let rows = ((UI.monitorFilters.type==='production'?DB.production:DB.wastage)||[]).slice().sort((a,b)=>new Date(b['Timestamp']||0)-new Date(a['Timestamp']||0));
  if(UI.monitorFilters.from) rows = rows.filter(r=>(r['Timestamp']||'').slice(0,10)>=UI.monitorFilters.from);
  if(UI.monitorFilters.to) rows = rows.filter(r=>(r['Timestamp']||'').slice(0,10)<=UI.monitorFilters.to);
  const selectedTs = Object.keys(UI.monitorSelected).filter(k=>UI.monitorSelected[k]);
  
  if(selectedTs.length>0){ 
    html += '<div class="card" style="background:var(--parchment-2);padding:14px;"><div class="row" style="align-items:center"><span style="font-weight:700;font-size:13.5px;">' + selectedTs.length + ' Selected</span><div class="row" style="flex:none"><select class="input-select" id="bulk-log-status" style="width:130px;padding:8px;"><option value="Logged">Logged</option><option value="Reviewed">Reviewed</option><option value="Flagged">Flagged</option></select><button class="btn btn-primary btn-sm" onclick="bulkLogStatus()">Update Status</button></div></div></div>';

  return html;
}

async function saveSingleLogStatus(ts){
  const sel = document.getElementById('log-status-' + ts);
  if(!sel) return;
  const st = sel.value;
  const sheet = UI.monitorFilters.type === 'production' ? 'Production' : 'Wastage';
  await api.updateLogStatus(sheet, ts, st);
  DB = await api.getAll();
  showToast('Status Updated');
  render();
}

async function bulkLogStatus(){
  const st = document.getElementById('bulk-log-status').value;
  const sheet = UI.monitorFilters.type === 'production' ? 'Production' : 'Wastage';
  const tsList = Object.keys(UI.monitorSelected).filter(k=>UI.monitorSelected[k]);
  for(const ts of tsList) await api.updateLogStatus(sheet, ts, st);
  DB = await api.getAll();
  UI.monitorSelected = {};
  showToast('Bulk Applied');
  render();
}

function exportMonitorCSV(){
  const isProd = UI.monitorFilters.type === 'production';
  let rows = isProd ? (DB.production || []) : (DB.wastage || []);
  if(UI.monitorFilters.from) rows = rows.filter(o=>(o['Timestamp']||'').slice(0,10)>=UI.monitorFilters.from);
  if(UI.monitorFilters.to) rows = rows.filter(o=>(o['Timestamp']||'').slice(0,10)<=UI.monitorFilters.to);
  const headers = isProd ? ['Timestamp', 'Date', 'Item Name', 'Quantity', 'Unit', 'Logged By', 'Status'] : ['Timestamp', 'Date', 'Item Name', 'Quantity', 'Unit', 'Reason', 'Logged By', 'Status'];
  const data = rows.map(o => isProd ? [o['Timestamp'], o['Date'], o['Item Name'], o['Quantity'], o['Unit'], o['Logged By'], o['Status']] : [o['Timestamp'], o['Date'], o['Item Name'], o['Quantity'], o['Unit'], o['Reason'], o['Logged By'], o['Status']]);
  downloadCSV('Goya_' + (isProd?'Production':'Wastage') + '_' + todayISO() + '.csv', headers, data);
}

function exportData(type) {
  const dateStr = todayISO();
  if (type === 'orders') {
    downloadCSV('Goya_Orders_' + dateStr + '.csv', ['Timestamp', 'Order Date', 'Item Name', 'Quantity', 'Unit', 'Supplier', 'Status', 'Logged By'], (DB.orders||[]).map(o => [o['Timestamp'], o['Order Date'], o['Item Name'], o['Quantity'], o['Unit'], o['Supplier'], o['Status'], o['Logged By']]));
  } else if (type === 'production') {
    downloadCSV('Goya_Production_' + dateStr + '.csv', ['Timestamp', 'Date', 'Item Name', 'Quantity', 'Unit', 'Logged By', 'Status'], (DB.production||[]).map(o => [o['Timestamp'], o['Date'], o['Item Name'], o['Quantity'], o['Unit'], o['Logged By'], o['Status']]));
  } else if (type === 'wastage') {
    downloadCSV('Goya_Wastage_' + dateStr + '.csv', ['Timestamp', 'Date', 'Item Name', 'Quantity', 'Unit', 'Reason', 'Logged By', 'Status'], (DB.wastage||[]).map(o => [o['Timestamp'], o['Date'], o['Item Name'], o['Quantity'], o['Unit'], o['Reason'], o['Logged By'], o['Status']]));
  } else if (type === 'items') {
    downloadCSV('Goya_MasterItems_' + dateStr + '.csv', ['Row ID', 'Name', 'SKU', 'Storage Unit', 'Ingredient Unit', 'Supplier', 'Items Type'], (DB.items||[]).map(o => [o['Row ID'], o['Name'], o['SKU'], o['Storage Unit'], o['Ingredient Unit'], o['Supplier'], o['Items Type']]));
  } else if (type === 'staff') {
    downloadCSV('Goya_StaffList_' + dateStr + '.csv', ['PIN Code', 'Staff Full Name', 'Allowed Sections'], (DB.staff||[]).map(o => [o['PIN Code'], o['Staff Full Name'], o['Allowed Sections']]));
  }
}
