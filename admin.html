<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Admin Workspace — Goya</title>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&family=Plus+Jakarta+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{--espresso:#1e1810;--espresso-light:#2d2416;--sage:#527945;--sage-hover:#436337;--ink:#1f1f1f;--ink-soft:#665c54;--line:#e4dec9;--parchment:#f7f5ef;--parchment-2:#eeecdf;--alert:#b93835;--radius:12px;--shadow:0 4px 20px rgba(45,36,22,0.06)}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'Plus Jakarta Sans',sans-serif;background:var(--parchment);color:var(--ink);line-height:1.5;-webkit-tap-highlight-color:transparent}
input,select,button,textarea{font-family:inherit;font-size:inherit;color:inherit}
.topbar{background:#fff;padding:14px 20px;display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid var(--line);box-shadow:var(--shadow);position:sticky;top:0;z-index:100}
.brand{font-weight:700;font-size:16px;font-family:'Fraunces',serif;color:var(--espresso);display:flex;align-items:center;gap:10px}
.brand-logo{width:32px;height:32px;border-radius:50%;object-fit:cover;border:1px solid var(--line)}
.admin-layout{display:grid;grid-template-columns:220px 1fr;gap:20px;padding:20px 16px;max-width:1400px;margin:0 auto;align-items:start}
@media (max-width:860px){.admin-layout{grid-template-columns:1fr}}
.admin-nav{display:flex;flex-direction:column;gap:4px;background:#fff;padding:12px;border-radius:var(--radius);box-shadow:var(--shadow);border:1px solid rgba(228,222,201,0.6);position:sticky;top:80px;overflow-x:auto}
.admin-nav button{padding:12px 14px;text-align:left;border:none;background:none;cursor:pointer;border-radius:8px;font-weight:600;color:var(--ink-soft);transition:all .2s;display:flex;align-items:center;gap:10px;font-size:14px;white-space:nowrap}
.admin-nav button.active{background:var(--espresso);color:#fff}
.admin-nav button:hover:not(.active){background:var(--parchment-2);color:var(--espresso)}
.card{background:#fff;border-radius:var(--radius);padding:20px;margin-bottom:16px;box-shadow:var(--shadow);border:1px solid rgba(228,222,201,0.6)}
.section-title{display:flex;justify-content:space-between;align-items:center;margin-bottom:16px;flex-wrap:wrap;gap:10px}
.section-title h3{font-size:18px;font-weight:700;font-family:'Fraunces',serif;color:var(--espresso)}
.row{display:flex;gap:12px;flex-wrap:wrap;align-items:center}
.row>*{min-width:0;flex:1}
.btn{padding:10px 16px;border:none;border-radius:8px;font-weight:600;cursor:pointer;transition:all .2s;font-size:13.5px;display:inline-flex;align-items:center;justify-content:center;gap:6px;}
.btn-primary{background:var(--sage);color:#fff}
.btn-primary:hover{background:var(--sage-hover);transform:translateY(-1px)}
.btn-ghost{background:transparent;border:1.5px solid var(--line);color:var(--ink)}
.btn-ghost:hover{background:var(--parchment)}
.btn-danger{background:#fdf2f2;color:var(--alert)}
.btn-danger:hover{background:#fae1e1}
.btn-sm{padding:6px 12px;font-size:12px}
.input-text,.input-number,.input-select{padding:12px 14px;border:1.5px solid var(--line);border-radius:8px;background:#fffdfa;width:100%;transition:all .2s;font-size:14px}
.input-text:focus,.input-number:focus,.input-select:focus{outline:none;border-color:var(--sage);box-shadow:0 0 0 3px rgba(82,121,69,0.12);background:#fff}
.table-wrap{overflow-x:auto;margin:14px 0;border-radius:8px;border:1px solid var(--line);-webkit-overflow-scrolling:touch}
.table-wrap table{width:100%;border-collapse:collapse;font-size:13px;white-space:nowrap}
.table-wrap th{background:var(--parchment-2);padding:12px 14px;text-align:left;font-weight:700;color:var(--espresso);text-transform:uppercase;font-size:11px;letter-spacing:0.5px;border-bottom:2px solid var(--line)}
.table-wrap td{padding:12px 14px;border-bottom:1px solid var(--line);vertical-align:middle}
.table-wrap tr:hover td{background:#faf8f5}
.table-wrap tr:last-child td{border-bottom:none}
.gate-wrap{display:flex;align-items:center;justify-content:center;min-height:100vh;background:var(--espresso);padding:16px;}
.gate-card{background:#fff;padding:36px 24px;border-radius:16px;box-shadow:0 20px 60px rgba(0,0,0,.25);max-width:420px;width:100%}
.badge{display:inline-block;padding:4px 10px;border-radius:20px;font-size:11px;font-weight:700;text-transform:uppercase;background:var(--parchment-2);color:var(--ink)}
.tag{display:inline-block;padding:6px 10px;border-radius:6px;background:#e5f0e1;color:var(--sage);font-size:11.5px;font-weight:700}
.filters{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:12px;margin-bottom:16px;background:var(--parchment);padding:16px;border-radius:10px;border:1px solid var(--line)}
.filter-item label{display:block;font-size:11px;font-weight:700;color:var(--espresso);margin-bottom:6px;text-transform:uppercase;letter-spacing:0.5px}
.kpi-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:12px;margin-bottom:16px}
.kpi-card{background:var(--parchment);padding:14px;border-radius:10px;border:1px solid var(--line);text-align:center}
.kpi-card h4{font-size:11px;text-transform:uppercase;color:var(--ink-soft);margin-bottom:4px}
.kpi-card .val{font-size:20px;font-weight:700;font-family:'Fraunces',serif;color:var(--espresso)}
.pin-pad{text-align:center}
.pin-grid{display:grid;grid-template-columns:repeat(3,64px);gap:10px;justify-content:center;margin-bottom:16px}
.pin-grid button{width:64px;height:64px;font-size:22px;font-weight:600;border:1.5px solid var(--line);background:#fff;border-radius:12px;cursor:pointer;transition:all 0.1s}
.pin-grid button:active{background:var(--parchment);transform:scale(0.95)}
.overlay{position:fixed;inset:0;background:rgba(30,24,16,0.85);backdrop-filter:blur(4px);display:flex;align-items:center;justify-content:center;z-index:9999;padding:16px}
.modal{background:#fff;padding:28px;border-radius:16px;box-shadow:0 20px 40px rgba(0,0,0,.25);max-width:380px;width:100%}
</style>
</head>
<body>
<div id="app"></div>
<script>
const STATUSES = ['PENDING','ORDERED','RECEIVED','NOT_RECEIVED','REJECTED'];
const STATUS_LABEL = {PENDING:'Pending',ORDERED:'Ordered',RECEIVED:'Received',NOT_RECEIVED:'Not Received',REJECTED:'Rejected'};
const SECTIONS = ['bar','kitchen','packaging','pastry'];
const SECTION_LABEL = {bar:'Bar',kitchen:'Kitchen',packaging:'Packaging',pastry:'Pastry'};

let SHEET_URL = '';
let LOCAL_DB = null;

function seedData(){
  return {
    items:[
      {'Row ID':'1','Name':'Ethiopian Green Beans','SKU':'SK-101','Storage Unit':'KG','Ingredient Unit':'GRAM','Supplier':'Sunrise Bean Co.','Items Type':'bar'},
      {'Row ID':'2','Name':'Vanilla','SKU':'Sk-102','Storage Unit':'KG','Ingredient Unit':'GRAM','Supplier':'','Items Type':'pastry'}
    ],
    internalItems:[
      {'Row ID':'101','Name':'Esprosso Frost Batch','SKU':'Sk-202','Storage Unit':'BATCH','Ingredient Unit':'GRAM','Items Type':'BAR'}
    ],
    staff:[
      {'PIN Code':'1111','Staff Full Name':'MEHEDI','Allowed Sections':'bar'},
      {'PIN Code':'3333','Staff Full Name':'Rashed','Allowed Sections':'bar'}
    ],
    orders:[
      {'Row ID':'1','Timestamp':'10:00:00','Order Date':'2026-08-01','Item Name':'Ethiopian Green Beans','Quantity':'1','Unit':'KG','Supplier':'Sunrise Bean Co.','Note/Remarks':'Check expiry date','Status':'RECEIVED','Logged By':'Aisha Rahman'}
    ], 
    production:[
      {'Timestamp':'2026-08-01T09:20:00.000Z','Date':'2026-08-01','Item Name':'House Cold Brew Batch','Quantity':'10','Unit':'L','Logged By':'SAFI','Status':'DONE'}
    ], 
    wastage:[
      {'Timestamp':'','Date':'2026-08-01','Item Name':'Full Cream Milk','Quantity':'1','Unit':'L','Reason':'Expired','Logged By':'Karim Hossain','Status':'Logged'}
    ], 
    inventoryCounts:[
      {'Count Date / Month':'2026-08','Section':'bar','Item Name':'Ethiopian Green Beans','SKU':'SK-101','Storage Quantity':'3.0','Ingredient Quantity':'','Submitted By':'Aisha Rahman'}
    ], 
    suppliers:[
      {'Name':'Sunrise Bean Co.','Phone':'Optional','Group Link':'optional','Remarks':'last order cutoff time 07pm'},
      {'Name':'Safco','Phone':'','Group Link':'','Remarks':'last order cutoff time 07pm'}
    ], 
    settings:{ MasterPin:'9988', ConnectionPin:'9988', InventoryCountEnabled:'true', OwnerEmail:'mehedi.src@gmail.com', TargetCountMonth: currentMonthISO(), CustomPages:[] }
  };
}

async function getLocalSetting(key){ try{ return JSON.parse(localStorage.getItem(key)||'null'); }catch(e){ return null; } }
async function setLocalSetting(key, val){ localStorage.setItem(key, JSON.stringify(val)); }

async function initBackend(){
  try { SHEET_URL = await getLocalSetting('goya-sheet-url') || ''; } catch(e) { SHEET_URL = ''; }
}

async function connectSheet(url){
  SHEET_URL = (url||'').trim();
  await setLocalSetting('goya-sheet-url', SHEET_URL);
}

async function sheetPost(action, body){
  if(!SHEET_URL) throw new Error('Sheet not connected');
  const resp = await fetch(SHEET_URL, {method:'POST', body:JSON.stringify({action,...body})});
  return resp.json();
}

const api = {
  async getAll(){
    if(!SHEET_URL) return seedData();
    try{
      const resp = await fetch(SHEET_URL+'?action=getAll');
      const data = await resp.json();
      if(!data || data.error) return seedData();
      return {
        items: data.items || [],
        internalItems: data.internalItems || [],
        staff: data.staff || [],
        orders: data.orders || [],
        production: data.production || [],
        wastage: data.wastage || [],
        inventoryCounts: data.inventoryCounts || [],
        suppliers: data.suppliers || [],
        settings: data.settings || { MasterPin:'9988', ConnectionPin:'9988', InventoryCountEnabled:'true', OwnerEmail:'mehedi.src@gmail.com', TargetCountMonth: currentMonthISO(), CustomPages:[] }
      };
    }catch(e){ return seedData(); }
  },
  async saveAllOrders(orders){
    if(SHEET_URL) await sheetPost('saveAllOrders',{orders});
    else { LOCAL_DB.orders = orders; await saveLocalDB(); }
  },
  async saveAllItems(items){
    if(SHEET_URL) await sheetPost('saveAllItems',{items});
    else { LOCAL_DB.items = items; await saveLocalDB(); }
  },
  async saveAllInternalItems(internalItems){
    if(SHEET_URL) await sheetPost('saveAllInternalItems',{internalItems});
    else { LOCAL_DB.internalItems = internalItems; await saveLocalDB(); }
  },
  async saveAllSuppliers(suppliers){
    if(SHEET_URL) await sheetPost('saveAllSuppliers',{suppliers});
    else { LOCAL_DB.suppliers = suppliers; await saveLocalDB(); }
  },
  async saveAllStaff(staff){
    if(SHEET_URL) await sheetPost('saveAllStaff',{staff});
    else { LOCAL_DB.staff = staff; await saveLocalDB(); }
  },
  async saveAllProduction(production){
    if(SHEET_URL) await sheetPost('saveAllProduction',{production});
    else { LOCAL_DB.production = production; await saveLocalDB(); }
  },
  async saveAllWastage(wastage){
    if(SHEET_URL) await sheetPost('saveAllWastage',{wastage});
    else { LOCAL_DB.wastage = wastage; await saveLocalDB(); }
  },
  async setSetting(key, value){
    if(SHEET_URL) await sheetPost('setSetting',{key,value});
    else { LOCAL_DB.settings[key]=value; await saveLocalDB(); }
  }
};

async function saveLocalDB(){ if(LOCAL_DB) localStorage.setItem('goya-local-db', JSON.stringify(LOCAL_DB)); }
async function loadLocalDB(){ try{ LOCAL_DB = JSON.parse(localStorage.getItem('goya-local-db')); if(!LOCAL_DB) LOCAL_DB = seedData(); }catch(e){ LOCAL_DB = seedData(); } }

function escHtml(s){ return String(s||'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function fmtDateTime(iso){ return iso? iso.slice(0,16).replace('T',' ') : ''; }
function todayISO(){ return new Date().toISOString().slice(0,10); }
function currentMonthISO(){ return new Date().toISOString().slice(0,7); }

function showToast(msg){
  const t = document.createElement('div');
  t.style.cssText = 'position:fixed;bottom:24px;left:50%;transform:translateX(-50%);background:var(--espresso);color:#fff;padding:12px 20px;border-radius:10px;font-size:13.5px;font-weight:500;z-index:9999;box-shadow:0 10px 30px rgba(0,0,0,0.2)';
  t.textContent = msg; document.body.appendChild(t); setTimeout(()=>t.remove(), 2500);
}

function openPinPad(title, onSubmit){
  const holder = document.createElement('div'); holder.className='overlay'; let input = '';
  const pad = '<div class="pin-pad"><h3 style="margin-bottom:16px;font-family:\'Fraunces\',serif;font-size:20px;color:var(--espresso);">' + escHtml(title) + '</h3><input type="password" id="pin-input" placeholder="••••" readonly style="text-align:center;font-size:24px;letter-spacing:10px;width:140px;height:54px;border:2px solid var(--line);border-radius:10px;margin:0 auto 20px;display:block;background:#fffdfa;color:var(--espresso)"><div class="pin-grid">' + [1,2,3,4,5,6,7,8,9,0].map(n=>'<button onclick="insertPin(' + n + ')">' + n + '</button>').join('') + '<button onclick="deletePin()" style="grid-column:2;background:var(--parchment-2);color:var(--ink-soft)">⌫</button></div><div class="row" style="margin-top:16px;"><button class="btn btn-primary" style="width:100%;padding:12px;" onclick="submitPin()">Confirm</button></div></div>';
  holder.innerHTML = '<div class="modal">' + pad + '</div>'; document.body.appendChild(holder);
  window.pinInput = () => document.getElementById('pin-input');
  window.insertPin = (n) => { if(input.length<4){input+=n; window.pinInput().value='•'.repeat(input.length);} };
  window.deletePin = () => { input = input.slice(0,-1); window.pinInput().value='•'.repeat(input.length); };
  window.submitPin = async () => { if(await onSubmit(input)){ holder.remove(); } else { showToast('Incorrect PIN'); input=''; window.pinInput().value=''; } };
}

function downloadCSV(filename, headers, rows){
  const csvRows = [headers.map(h => '"' + String(h).replace(/"/g, '""') + '"').join(',')];
  rows.forEach(r => {
    const rowStr = r.map(cell => '"' + String(cell).replace(/"/g, '""') + '"').join(',');
    csvRows.push(rowStr);
  });
  const blob = new Blob([csvRows.join('\n')], { type: 'text/csv;charset=utf-8;' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = filename; a.click();
  URL.revokeObjectURL(url);
}

let DB={items:[],internalItems:[],staff:[],orders:[],production:[],wastage:[],inventoryCounts:[],suppliers:[],settings:{}};
let UI={
  loaded:false, unlocked:false, tab:'orders',
  orderFilters:{search:'',status:'',supplier:'',month:currentMonthISO(),from:'',to:''}, orderSelected:{},
  monitorFilters:{type:'production',month:currentMonthISO(),from:'',to:''}, monitorSelected:{},
  countFilters:{month:currentMonthISO()}
};

async function boot(){
  try {
    await loadLocalDB();
    await initBackend();
    DB = await api.getAll();
    if(!DB || typeof DB !== 'object') DB = seedData();
  } catch(e) {
    DB = seedData();
  }
  UI.loaded = true;
  render();
}

function render(){
  const app = document.getElementById('app');
  if(!app) return;
  try {
    if(!UI.loaded){
      app.innerHTML = '<div class="gate-wrap"><div class="gate-card"><h2 style="text-align:center;font-family:\'Fraunces\',serif;font-size:26px;color:var(--espresso)">Admin Panel</h2><p style="text-align:center;color:var(--ink-soft);margin-top:8px;">Loading securely...</p></div></div>';
      return;
    }
    if(!UI.unlocked){
      app.innerHTML = '<div class="gate-wrap"><div class="gate-card"><div style="text-align:center;margin-bottom:16px;"><img src="goya logo.jpeg" alt="Goya Logo" style="width:64px;height:64px;border-radius:50%;object-fit:cover;border:2px solid var(--line);box-shadow:var(--shadow)"></div><h2 style="text-align:center;font-family:\'Fraunces\',serif;font-size:24px;color:var(--espresso);margin-bottom:6px;">Admin Access</h2><p style="color:var(--ink-soft);font-size:13.5px;margin-bottom:20px;text-align:center;">Enter Master PIN to continue.</p><button class="btn btn-primary" style="width:100%;padding:12px;" onclick="openPinPad(\'Master PIN\', async(e)=>{if(e===(DB.settings?.MasterPin||\'9988\')){UI.unlocked=true;render();return true;}return false;})">Unlock Panel</button></div></div>';
      return;
    }
    let html = '<div class="topbar"><div class="brand"><img src="goya logo.jpeg" alt="Logo" class="brand-logo"> Goya Admin Workspace</div><button class="btn btn-ghost btn-sm" onclick="UI.unlocked=false;render();">Lock Session</button></div>';
    html += '<div class="admin-layout"><div class="admin-nav">' + [
      ['orders','📦 Orders'],
      ['items','📋 Items & Suppliers'],
      ['internal','📁 Internal Items'],
      ['staff','👥 Staff'],
      ['monitor','📊 Prod & Waste'],
      ['counts','🛒 Inventory Counts'],
      ['export','📥 Data Export'],
      ['settings','⚙️ Settings']
    ].map(([k,l])=>'<button class="' + (UI.tab===k?'active':'') + '" onclick="UI.tab=\'' + k + '\';render();">' + l + '</button>').join('') + '</div><div>';
    
    if(UI.tab==='orders') html+=renderOrders();
    else if(UI.tab==='items') html+=renderItems();
    else if(UI.tab==='internal') html+=renderInternalItems();
    else if(UI.tab==='staff') html+=renderStaff();
    else if(UI.tab==='monitor') html+=renderMonitor();
    else if(UI.tab==='counts') html+=renderCounts();
    else if(UI.tab==='export') html+=renderExport();
    else html+=renderSettings();

    html += '</div></div>';
    app.innerHTML = html;
  } catch(err) {
    app.innerHTML = '<div class="gate-wrap"><div class="gate-card"><h3 style="color:var(--alert);margin-bottom:10px;">Rendering Error</h3><p style="font-size:13px;color:var(--ink-soft);">' + escHtml(err.message) + '</p><button class="btn btn-primary" style="margin-top:16px;width:100%" onclick="localStorage.clear();location.reload();">Reset & Reload</button></div></div>';
  }
}

/* 1. ORDERS */
function renderOrders(){
  const orders = DB.orders || [];
  
  // KPI counts
  let totalPending = orders.filter(o=>o['Status']==='PENDING').length;
  let totalOrdered = orders.filter(o=>o['Status']==='ORDERED').length;
  let totalReceived = orders.filter(o=>o['Status']==='RECEIVED').length;
  let totalNotReceived = orders.filter(o=>o['Status']==='NOT_RECEIVED').length;

  let html = '<div class="card"><div class="section-title"><h3>Orders Management</h3><div class="row" style="flex:none;gap:8px;"><button class="btn btn-primary btn-sm" onclick="exportOrdersCSV()">📥 Download Selected CSV</button><button class="btn btn-danger btn-sm" onclick="deleteSelectedOrders()">🗑 Delete Selected</button><span class="badge">' + orders.length + ' Records</span></div></div>';
  
  // KPI Cards
  html += '<div class="kpi-grid"><div class="kpi-card"><h4>Pending</h4><div class="val" style="color:#b93835">' + totalPending + '</div></div><div class="kpi-card"><h4>Ordered</h4><div class="val" style="color:#d97706">' + totalOrdered + '</div></div><div class="kpi-card"><h4>Received</h4><div class="val" style="color:var(--sage)">' + totalReceived + '</div></div><div class="kpi-card"><h4>Not Received</h4><div class="val" style="color:#6b7280">' + totalNotReceived + '</div></div></div>';

  html += '<div class="filters"><div class="filter-item"><label>Search Item</label><input type="text" id="ord-search" class="input-text" value="' + escHtml(UI.orderFilters.search) + '" oninput="UI.orderFilters.search=this.value"></div><div class="filter-item"><label>Status</label><select id="ord-status" class="input-select" onchange="UI.orderFilters.status=this.value"><option value="">All Statuses</option>' + STATUSES.map(s=>'<option value="' + s + '" ' + (UI.orderFilters.status===s?'selected':'') + '>' + STATUS_LABEL[s] + '</option>').join('') + '</select></div><div class="filter-item"><label>Supplier</label><select id="ord-sup" class="input-select" onchange="UI.orderFilters.supplier=this.value"><option value="">All Suppliers</option>' + [...new Set(orders.map(o=>o['Supplier']))].filter(Boolean).map(s=>'<option value="' + escHtml(s) + '" ' + (UI.orderFilters.supplier===s?'selected':'') + '>' + escHtml(s) + '</option>').join('') + '</select></div><div class="filter-item"><label>Month Filter</label><input type="month" id="ord-month" class="input-text" value="' + UI.orderFilters.month + '" onchange="UI.orderFilters.month=this.value;render();"></div><div class="filter-item"><label>From</label><input type="date" id="ord-from" class="input-text" value="' + UI.orderFilters.from + '" onchange="UI.orderFilters.from=this.value"></div><div class="filter-item"><label>To</label><input type="date" id="ord-to" class="input-text" value="' + UI.orderFilters.to + '" onchange="UI.orderFilters.to=this.value"></div></div>';
  
  let rows = orders.slice().sort((a,b)=>new Date(b['Timestamp']||0)-new Date(a['Timestamp']||0));
  if(UI.orderFilters.month) rows = rows.filter(o=>(o['Order Date']||o['Timestamp']||'').slice(0,7)===UI.orderFilters.month);
  if(UI.orderFilters.search) rows = rows.filter(o=>(o['Item Name']||'').toLowerCase().includes(UI.orderFilters.search.toLowerCase()));
  if(UI.orderFilters.status) rows = rows.filter(o=>o['Status']===UI.orderFilters.status);
  if(UI.orderFilters.supplier) rows = rows.filter(o=>o['Supplier']===UI.orderFilters.supplier);
  if(UI.orderFilters.from) rows = rows.filter(o=>(o['Order Date']||o['Timestamp']||'').slice(0,10)>=UI.orderFilters.from);
  if(UI.orderFilters.to) rows = rows.filter(o=>(o['Order Date']||o['Timestamp']||'').slice(0,10)<=UI.orderFilters.to);
  
  const selectedTs = Object.keys(UI.orderSelected).filter(k=>UI.orderSelected[k]);
  const allSelected = rows.length > 0 && rows.every(o => UI.orderSelected[o['Timestamp']]);
  
  html += '<div class="row" style="margin-bottom:12px;background:var(--parchment-2);padding:10px;border-radius:8px;"><div class="row" style="flex:none"><select class="input-select" id="bulk-status" style="width:160px;"><option value="PENDING">Pending</option><option value="ORDERED">Ordered</option><option value="RECEIVED">Received</option><option value="NOT_RECEIVED">Not Received</option></select><button class="btn btn-primary btn-sm" onclick="bulkStatus()">Apply Status to Selected</button></div><span style="font-weight:600;font-size:13px;margin-left:auto">' + selectedTs.length + ' Selected</span></div>';

async function saveAllOrdersTable(){

async function bulkStatus(){
  const st = document.getElementById('bulk-status').value;
  const tsList = Object.keys(UI.orderSelected).filter(k=>UI.orderSelected[k]);

async function deleteSelectedOrders(){
  const tsList = Object.keys(UI.orderSelected).filter(k=>UI.orderSelected[k]);
  if(tsList.length === 0){ showToast('No orders selected'); return; }
  if(!confirm('Are you sure you want to delete selected orders?')) return;
  DB.orders = (DB.orders || []).filter(o => !tsList.includes(o['Timestamp']));
  await api.saveAllOrders(DB.orders);
  UI.orderSelected = {};
  showToast('Selected Orders Deleted');
  render();

function exportOrdersCSV(){
  let rows = DB.orders || [];
  const selectedTs = Object.keys(UI.orderSelected).filter(k=>UI.orderSelected[k]);
  if(selectedTs.length > 0){
    rows = rows.filter(o => selectedTs.includes(o['Timestamp']));
  } else {
    if(UI.orderFilters.month) rows = rows.filter(o=>(o['Order Date']||o['Timestamp']||'').slice(0,7)===UI.orderFilters.month);
    if(UI.orderFilters.from) rows = rows.filter(o=>(o['Order Date']||o['Timestamp']||'').slice(0,10)>=UI.orderFilters.from);
    if(UI.orderFilters.to) rows = rows.filter(o=>(o['Order Date']||o['Timestamp']||'').slice(0,10)<=UI.orderFilters.to);
  }
  const headers = ['Timestamp', 'Order Date', 'Item Name', 'Quantity', 'Unit', 'Supplier', 'Note/Remarks', 'Status', 'Logged By'];
  const data = rows.map(o => [o['Timestamp'], o['Order Date'], o['Item Name'], o['Quantity'], o['Unit'], o['Supplier'], o['Note/Remarks']||'', o['Status'], o['Logged By']]);
  downloadCSV('Goya_Orders_' + todayISO() + '.csv', headers, data);
}

function toggleMonitorSelectAll(checked){
  let rows = ((UI.monitorFilters.type==='production'?DB.production:DB.wastage)||[]).slice();
  rows.forEach(r => { const k = r['Timestamp'] || (r['Date'] + r['Item Name']); UI.monitorSelected[k] = checked; });
  render();
}

async function saveAllMonitorTable(){
  const isProd = UI.monitorFilters.type === 'production';
  let rows = isProd ? DB.production : DB.wastage;
  rows.forEach(r => {
    const k = r['Timestamp'] || (r['Date'] + r['Item Name']);
    const sel = document.getElementById('log-status-' + k);
    if(sel) r['Status'] = sel.value;
  });
  if(isProd) await api.saveAllProduction(DB.production);
  else await api.saveAllWastage(DB.wastage);
  DB = await api.getAll();
  showToast('Log Statuses Saved Successfully');
  render();
}

async function bulkLogStatus(){
  const st = document.getElementById('bulk-log-status').value;
  const isProd = UI.monitorFilters.type === 'production';
  let rows = isProd ? DB.production : DB.wastage;
  const tsList = Object.keys(UI.monitorSelected).filter(k=>UI.monitorSelected[k]);
  rows.forEach(r => {
    const k = r['Timestamp'] || (r['Date'] + r['Item Name']);
    if(tsList.includes(k)) r['Status'] = st;
  });
  if(isProd) await api.saveAllProduction(DB.production);
  else await api.saveAllWastage(DB.wastage);
  DB = await api.getAll();
  UI.monitorSelected = {};
  showToast('Bulk Status Applied');
  render();
}

function exportMonitorCSV(){
  const isProd = UI.monitorFilters.type === 'production';
  let rows = isProd ? (DB.production || []) : (DB.wastage || []);
  const tsList = Object.keys(UI.monitorSelected).filter(k=>UI.monitorSelected[k]);
  if(tsList.length > 0){
    rows = rows.filter(r => tsList.includes(r['Timestamp'] || (r['Date'] + r['Item Name'])));
  } else {
    if(UI.monitorFilters.month) rows = rows.filter(r=>(r['Date']||r['Timestamp']||'').slice(0,7)===UI.monitorFilters.month);
    if(UI.monitorFilters.from) rows = rows.filter(r=>(r['Date']||r['Timestamp']||'').slice(0,10)>=UI.monitorFilters.from);
    if(UI.monitorFilters.to) rows = rows.filter(r=>(r['Date']||r['Timestamp']||'').slice(0,10)<=UI.monitorFilters.to);
  }
  const headers = isProd ? ['Timestamp', 'Date', 'Item Name', 'Quantity', 'Unit', 'Logged By', 'Status'] : ['Timestamp', 'Date', 'Item Name', 'Quantity', 'Unit', 'Reason', 'Logged By', 'Status'];
  const data = rows.map(o => isProd ? [o['Timestamp'], o['Date'], o['Item Name'], o['Quantity'], o['Unit'], o['Logged By'], o['Status']] : [o['Timestamp'], o['Date'], o['Item Name'], o['Quantity'], o['Unit'], o['Reason'], o['Logged By'], o['Status']]);
  downloadCSV('Goya_' + (isProd?'Production':'Wastage') + '_' + todayISO() + '.csv', headers, data);
}

/* 5. COUNTS */
function renderCounts(){
  const enabled = DB.settings?.InventoryCountEnabled === 'true';
  const targetMonth = DB.settings?.TargetCountMonth || currentMonthISO();
  let counts = DB.inventoryCounts || [];
  if(UI.countFilters.month) counts = counts.filter(c=>c['Count Date / Month']===UI.countFilters.month);
  
  let html = '<div class="card"><div class="section-title"><h3>Inventory Counts Module</h3><div class="row" style="flex:none;gap:8px;"><button class="btn btn-primary btn-sm" onclick="exportCountsCSV()">📥 Download Foodics CSV</button><button class="btn ' + (enabled?'btn-danger':'btn-primary') + ' btn-sm" onclick="toggleCount()">' + (enabled?'Deactivate Counts':'Activate Counts') + '</button></div></div><p style="color:var(--ink-soft);margin-bottom:14px;font-size:13.5px;">Status: <strong style="color:var(--espresso)">' + (enabled?'Active':'Disabled') + '</strong></p><div class="filters"><div class="filter-item"><label>Publish Target Month for Staff Portal</label><div class="row"><input type="month" id="target-count-month" class="input-text" value="' + targetMonth + '"><button class="btn btn-primary btn-sm" onclick="saveTargetMonth()">Set Month</button></div></div><div class="filter-item"><label>Filter View Month</label><input type="month" class="input-text" value="' + UI.countFilters.month + '" onchange="UI.countFilters.month=this.value;render();"></div></div><div class="table-wrap"><table><tr><th>Count Month</th><th>Section</th><th>Item Name</th><th>Storage Qty</th><th>Ingredient Qty</th><th>Submitted By</th></tr>' + counts.map(c=>'<tr><td style="font-family:monospace;font-weight:600">' + escHtml(c['Count Date / Month']) + '</td><td><span class="tag">' + (SECTION_LABEL[(c['Section']||'').toLowerCase()]||c['Section']) + '</span></td><td style="font-weight:600">' + escHtml(c['Item Name']) + '</td><td>' + c['Storage Quantity'] + '</td><td>' + (c['Ingredient Quantity']||'') + '</td><td>' + escHtml(c['Submitted By']) + '</td></tr>').join('') + '</table></div></div>';
  return html;
}

async function toggleCount(){
  const en = DB.settings?.InventoryCountEnabled === 'true';
  await api.setSetting('InventoryCountEnabled', en?'false':'true');
  DB = await api.getAll();
  showToast('Inventory Count Status Updated');
  render();
}

async function saveTargetMonth(){
  const m = document.getElementById('target-count-month').value;
  if(!m) return;
  await api.setSetting('TargetCountMonth', m);
  DB = await api.getAll();
  showToast('Target Count Month Updated Successfully');
  render();
}

function exportCountsCSV(){
  let rows = DB.inventoryCounts || [];
  if(UI.countFilters.month) rows = rows.filter(c=>c['Count Date / Month']===UI.countFilters.month);
  const headers = ['Inventory Item Name', 'Inventory Item SKU', 'Storage quantity', 'Ingredients quantity', 'Inventory Count ID'];
  const data = rows.map(o => [o['Item Name'], o['SKU']||'', o['Storage Quantity']||'', o['Ingredient Quantity']||'', '']);
  downloadCSV('Foodics_Inventory_Import_' + todayISO() + '.csv', headers, data);
}

/* 6. DATA EXPORT */
function renderExport(){
  const m = currentMonthISO();
  return '<div class="card"><div class="section-title"><h3>Data Export Center</h3></div><p style="color:var(--ink-soft);margin-bottom:20px;font-size:13.5px;">Download complete or month-filtered system database records.</p><div class="filters" style="background:#fff;border:none;padding:0;gap:16px;"><div class="card" style="margin:0;background:var(--parchment);box-shadow:none;"><h4 style="margin-bottom:8px;font-family:\'Fraunces\',serif;font-size:16px;">Orders</h4><label style="font-size:11px;font-weight:700;display:block;margin-bottom:4px;">Select Month</label><input type="month" id="exp-month-orders" class="input-text" value="' + m + '" style="margin-bottom:8px;"><button class="btn btn-primary btn-sm" style="width:100%" onclick="exportData(\'orders\')">Download Orders CSV</button></div><div class="card" style="margin:0;background:var(--parchment);box-shadow:none;"><h4 style="margin-bottom:8px;font-family:\'Fraunces\',serif;font-size:16px;">Production</h4><label style="font-size:11px;font-weight:700;display:block;margin-bottom:4px;">Select Month</label><input type="month" id="exp-month-prod" class="input-text" value="' + m + '" style="margin-bottom:8px;"><button class="btn btn-primary btn-sm" style="width:100%" onclick="exportData(\'production\')">Download Production CSV</button></div><div class="card" style="margin:0;background:var(--parchment);box-shadow:none;"><h4 style="margin-bottom:8px;font-family:\'Fraunces\',serif;font-size:16px;">Wastage</h4><label style="font-size:11px;font-weight:700;display:block;margin-bottom:4px;">Select Month</label><input type="month" id="exp-month-waste" class="input-text" value="' + m + '" style="margin-bottom:8px;"><button class="btn btn-primary btn-sm" style="width:100%" onclick="exportData(\'wastage\')">Download Wastage CSV</button></div><div class="card" style="margin:0;background:var(--parchment);box-shadow:none;"><h4 style="margin-bottom:8px;font-family:\'Fraunces\',serif;font-size:16px;">Master Items</h4><button class="btn btn-primary btn-sm" style="width:100%;margin-top:24px;" onclick="exportData(\'items\')">Download Items CSV</button></div><div class="card" style="margin:0;background:var(--parchment);box-shadow:none;"><h4 style="margin-bottom:8px;font-family:\'Fraunces\',serif;font-size:16px;">Staff</h4><button class="btn btn-primary btn-sm" style="width:100%;margin-top:24px;" onclick="exportData(\'staff\')">Download Staff CSV</button></div></div></div>';
}

function exportData(type) {
  const dateStr = todayISO();
  if (type === 'orders') {
    const m = document.getElementById('exp-month-orders').value;
    let rows = DB.orders || [];
    if(m) rows = rows.filter(o=>(o['Order Date']||o['Timestamp']||'').slice(0,7)===m);
    downloadCSV('Goya_Orders_' + (m||dateStr) + '.csv', ['Timestamp', 'Order Date', 'Item Name', 'Quantity', 'Unit', 'Supplier', 'Note/Remarks', 'Status', 'Logged By'], rows.map(o => [o['Timestamp'], o['Order Date'], o['Item Name'], o['Quantity'], o['Unit'], o['Supplier'], o['Note/Remarks']||'', o['Status'], o['Logged By']]));
  } else if (type === 'production') {
    const m = document.getElementById('exp-month-prod').value;
    let rows = DB.production || [];
    if(m) rows = rows.filter(o=>(o['Date']||o['Timestamp']||'').slice(0,7)===m);
    downloadCSV('Goya_Production_' + (m||dateStr) + '.csv', ['Timestamp', 'Date', 'Item Name', 'Quantity', 'Unit', 'Logged By', 'Status'], rows.map(o => [o['Timestamp'], o['Date'], o['Item Name'], o['Quantity'], o['Unit'], o['Logged By'], o['Status']]));
  } else if (type === 'wastage') {
    const m = document.getElementById('exp-month-waste').value;
    let rows = DB.wastage || [];
    if(m) rows = rows.filter(o=>(o['Date']||o['Timestamp']||'').slice(0,7)===m);
    downloadCSV('Goya_Wastage_' + (m||dateStr) + '.csv', ['Timestamp', 'Date', 'Item Name', 'Quantity', 'Unit', 'Reason', 'Logged By', 'Status'], rows.map(o => [o['Timestamp'], o['Date'], o['Item Name'], o['Quantity'], o['Unit'], o['Reason'], o['Logged By'], o['Status']]));
  } else if (type === 'items') {
    downloadCSV('Goya_MasterItems_' + dateStr + '.csv', ['Row ID', 'Name', 'SKU', 'Storage Unit', 'Ingredient Unit', 'Supplier', 'Items Type'], (DB.items||[]).map(o => [o['Row ID'], o['Name'], o['SKU'], o['Storage Unit'], o['Ingredient Unit'], o['Supplier'], o['Items Type']]));
  } else if (type === 'staff') {
    downloadCSV('Goya_StaffList_' + dateStr + '.csv', ['PIN Code', 'Staff Full Name', 'Allowed Sections'], (DB.staff||[]).map(o => [o['PIN Code'], o['Staff Full Name'], o['Allowed Sections']]));
  }
}

/* 7. SETTINGS & CUSTOM PAGES */
function renderSettings(){
  const ownerEmail = DB.settings?.OwnerEmail || 'mehedi.src@gmail.com';
  const customPages = DB.settings?.CustomPages || [];
  return '<div class="card"><div class="section-title"><h3>Google Sheet Database Connection</h3></div><div class="row" style="align-items:flex-end"><div style="flex:1"><label style="font-size:11px;font-weight:700;color:var(--ink-soft);display:block;margin-bottom:6px;">Apps Script Web App URL</label><input type="text" id="sheet-url" class="input-text" value="' + escHtml(SHEET_URL) + '"></div><button class="btn btn-primary" onclick="saveSheetUrl()">Link Database</button></div></div>' +
  '<div class="card"><div class="section-title"><h3>System Security</h3></div><div class="row" style="align-items:flex-end;max-width:380px"><div style="flex:1"><label style="font-size:11px;font-weight:700;color:var(--ink-soft);display:block;margin-bottom:6px;">Admin Master PIN</label><input type="text" id="new-master-pin" placeholder="4-digit PIN" maxlength="4" class="input-text"></div><button class="btn btn-primary" onclick="changeMasterPin()">Update PIN</button></div></div>' +
  '<div class="card"><div class="section-title"><h3>Notification Settings</h3></div><div class="row" style="align-items:flex-end;max-width:440px"><div style="flex:1"><label style="font-size:11px;font-weight:700;color:var(--ink-soft);display:block;margin-bottom:6px;">Owner Email for Purchase Orders</label><input type="email" id="owner-email" class="input-text" value="' + escHtml(ownerEmail) + '"></div><button class="btn btn-primary" onclick="saveOwnerEmail()">Save Email</button></div></div>' +
  '<div class="card"><div class="section-title"><h3>Dynamic Additional Pages & Notices</h3><span class="badge">' + customPages.length + ' Custom Pages</span></div><p style="color:var(--ink-soft);font-size:13px;margin-bottom:14px;">Add custom HTML/content pages (Notice, Schedule, etc.) for staff portal with role permissions.</p>' +
  '<div class="table-wrap"><table><tr><th>Headline / Title</th><th>Page URL / Content Source</th><th>Target Role Access</th><th>Actions</th></tr>' + customPages.map((p, idx)=>'<tr><td><input class="input-text" id="cp-title-' + idx + '" value="' + escHtml(p.title) + '"></td><td><input class="input-text" id="cp-url-' + idx + '" value="' + escHtml(p.url) + '" placeholder="e.g. notice.html"></td><td><select class="input-select" id="cp-role-' + idx + '"><option value="all" ' + (p.role==='all'?'selected':'') + '>All Staff</option><option value="bar" ' + (p.role==='bar'?'selected':'') + '>Bar Staff</option><option value="kitchen" ' + (p.role==='kitchen'?'selected':'') + '>Kitchen Staff</option><option value="pastry" ' + (p.role==='pastry'?'selected':'') + '>Pastry Staff</option><option value="packaging" ' + (p.role==='packaging'?'selected':'') + '>Packaging Staff</option></select></td><td><button class="btn btn-danger btn-sm" onclick="deleteCustomPage(' + idx + ')">Delete</button></td></tr>').join('') + '</table></div>' +
  '<div class="row" style="margin-top:16px;padding-top:16px;border-top:1px solid var(--line);align-items:flex-start"><input class="input-text" id="new-cp-title" placeholder="Headline (e.g. Notice Board)"><input class="input-text" id="new-cp-url" placeholder="Page URL / HTML Link"><select class="input-select" id="new-cp-role" style="flex:1"><option value="all">All Staff</option><option value="bar">Bar Staff</option><option value="kitchen">Kitchen Staff</option><option value="pastry">Pastry Staff</option><option value="packaging">Packaging Staff</option></select><button class="btn btn-primary" onclick="addCustomPage()">Add Page</button></div>' +
  '<div class="row" style="margin-top:16px;justify-content:flex-end"><button class="btn btn-primary" onclick="saveAllCustomPages()">💾 Save All Custom Pages</button></div></div>';
}

async function changeMasterPin(){
  const v = document.getElementById('new-master-pin').value.trim();
  if(v.length!==4||!/^\d{4}$/.test(v)){ showToast('Please enter exactly 4 digits'); return; }
  await api.setSetting('MasterPin',v);
  DB = await api.getAll();
  showToast('Admin PIN Updated');
  render();
}

async function saveOwnerEmail(){
  const em = document.getElementById('owner-email').value.trim();
  if(!em) return;
  await api.setSetting('OwnerEmail',em);
  DB = await api.getAll();
  showToast('Owner Email Saved Successfully');
  render();
}

async function addCustomPage(){
  const title = document.getElementById('new-cp-title').value.trim();
  const url = document.getElementById('new-cp-url').value.trim();
  const role = document.getElementById('new-cp-role').value;
  if(!title || !url){ showToast('Enter title and URL'); return; }
  let pages = DB.settings?.CustomPages || [];
  pages.push({title, url, role});
  await api.setSetting('CustomPages', pages);
  DB = await api.getAll();
  showToast('Custom Page Added Successfully');
  render();
}

async function saveAllCustomPages(){
  let pages = [];
  let cpList = DB.settings?.CustomPages || [];
  cpList.forEach((p, idx) => {
    const tEl = document.getElementById('cp-title-' + idx);
    const uEl = document.getElementById('cp-url-' + idx);
    const rEl = document.getElementById('cp-role-' + idx);
    if(tEl && tEl.value.trim()){
      pages.push({title: tEl.value.trim(), url: uEl ? uEl.value.trim() : '', role: rEl ? rEl.value : 'all'});
    }
  });
  await api.setSetting('CustomPages', pages);
  DB = await api.getAll();
  showToast('Custom Pages Saved Successfully');
  render();
}

async function deleteCustomPage(idx){
  let pages = DB.settings?.CustomPages || [];
  pages.splice(idx, 1);
  await api.setSetting('CustomPages', pages);
  DB = await api.getAll();
  render();
}

async function saveSheetUrl(){
  const url = document.getElementById('sheet-url').value.trim();
  await connectSheet(url);
  showToast(url?'Database Linked Successfully':'Disconnected');
  setTimeout(()=>location.reload(),600);
}

// Initial boot
boot();
</script>
