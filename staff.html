const OWNER_EMAIL = 'mehedi.src@gmail.com';
const WASTE_REASONS = ['Expired','Spillage','Damaged','Over-prepared','Staff Mistake'];
const STATUSES = ['PENDING','ORDERED','RECEIVED','NOT_RECEIVED','REJECTED'];
const STATUS_LABEL = {PENDING:'Pending',ORDERED:'Ordered',RECEIVED:'Received',NOT_RECEIVED:'Not Received',REJECTED:'Rejected'};
const SECTIONS = ['kitchen','pastry','bar','packaging'];
const SECTION_LABEL = {kitchen:'Kitchen',pastry:'Pastry',bar:'Bar',packaging:'Packaging'};

let SHEET_URL = '';
let LOCAL_DB = null;

async function initBackend(){
  SHEET_URL = await getLocalSetting('goya-sheet-url');
}

async function connectSheet(url){
  if(url){
    await setLocalSetting('goya-sheet-url', url);
    SHEET_URL = url;
  } else {
    await setLocalSetting('goya-sheet-url', '');
    SHEET_URL = '';
  }
}

async function disconnectSheet(){
  await setLocalSetting('goya-sheet-url', '');
  SHEET_URL = '';
}

function isSheetConnected(){ return SHEET_URL && SHEET_URL.trim().length > 0; }

async function getLocalSetting(key){ try{ return JSON.parse(localStorage.getItem(key)||'null'); }catch(e){ return null; } }
async function setLocalSetting(key, val){ localStorage.setItem(key, JSON.stringify(val)); }

async function sheetPost(action, body){
  if(!SHEET_URL) throw new Error('Sheet not connected');
  const resp = await fetch(SHEET_URL, {method:'POST', body:JSON.stringify({action,...body})});
  if(!resp.ok) throw new Error('Sheet API failed: '+resp.status);
  return resp.json();
}

const api = {
  async getAll(){
    if(!SHEET_URL) return seedData();
    try{
      const resp = await fetch(SHEET_URL+'?action=getAll');
      if(!resp.ok) throw new Error(resp.status);
      return resp.json();
    }catch(e){ return seedData(); }
  },
  async addOrders(rows){
    if(SHEET_URL) await sheetPost('addOrders',{rows});
    else{ LOCAL_DB.orders.unshift(...rows.slice().reverse()); await saveLocalDB(); }
    try{ await sendOrderEmail(rows); }catch(e){ console.warn('Email failed:', e); }
  },
  async updateOrderStatus(timestamp, status, receivedDate){
    if(SHEET_URL) await sheetPost('updateOrderStatus',{timestamp,status,receivedDate});
    else{ const o=LOCAL_DB.orders.find(x=>x['Timestamp']===timestamp); if(o){ o['Status']=status; o['Received Date']=receivedDate; } await saveLocalDB(); }
  },
  async bulkUpdateOrderStatus(timestamps, status){
    if(SHEET_URL) await sheetPost('bulkUpdateOrderStatus',{timestamps,status});
    else{ LOCAL_DB.orders.forEach(o=>{ if(timestamps.includes(o['Timestamp'])) o['Status']=status; }); await saveLocalDB(); }
  },
  async addProduction(rows){
    if(SHEET_URL) return sheetPost('addProduction',{rows});
    else{ LOCAL_DB.production.unshift(...rows.slice().reverse()); await saveLocalDB(); }
  },
  async addWastage(rows){
    if(SHEET_URL) return sheetPost('addWastage',{rows});
    else{ LOCAL_DB.wastage.unshift(...rows.slice().reverse()); await saveLocalDB(); }
  },
  async updateLogStatus(sheet, timestamp, status){
    if(SHEET_URL) await sheetPost('updateLogStatus',{sheet,timestamp,status});
    else{
      const arr = sheet==='Production' ? LOCAL_DB.production : LOCAL_DB.wastage;
      const row = arr.find(x=>x['Timestamp']===timestamp);
      if(row) row['Status']=status;
      await saveLocalDB();
    }
  },
  async upsertItem(item){
    if(SHEET_URL) return sheetPost('upsertItem',{item});
    else{
      const i = LOCAL_DB.items.find(x=>x['Row ID']===item.rowId);
      const row = {'Row ID':item.rowId,'Name':item.name,'SKU':item.sku||'','Storage Unit':item.storageUnit||'','Ingredient Unit':item.ingredientUnit||'','Supplier':item.supplier||'','Items Type':item.itemsType||'kitchen'};
      if(i) Object.assign(i,row); else LOCAL_DB.items.push(row);
      await saveLocalDB();
    }
  },
  async deleteItem(rowId){
    if(SHEET_URL) await sheetPost('deleteItem',{rowId});
    else{ LOCAL_DB.items = LOCAL_DB.items.filter(x=>x['Row ID']!==rowId); await saveLocalDB(); }
  },
  async upsertStaff(staff, oldPin){
    if(SHEET_URL) return sheetPost('upsertStaff',{staff,oldPin});
    else{
      const matchPin = oldPin || staff.pin;
      const s = LOCAL_DB.staff.find(x=>x['PIN Code']===matchPin);
      const row = {'PIN Code':staff.pin,'Staff Full Name':staff.name,'Allowed Sections':(staff.allowedSections||[]).join(',')};
      if(s) Object.assign(s,row); else LOCAL_DB.staff.push(row);
      await saveLocalDB();
    }
  },
  async deleteStaff(pin){
    if(SHEET_URL) await sheetPost('deleteStaff',{pin});
    else{ LOCAL_DB.staff = LOCAL_DB.staff.filter(x=>x['PIN Code']!==pin); await saveLocalDB(); }
  },
  async upsertSupplier(supplier, oldName){
    if(SHEET_URL) return sheetPost('upsertSupplier',{supplier,oldName});
    else{
      const matchName = oldName || supplier.name;
      const s = LOCAL_DB.suppliers.find(s=>s['Name']===matchName);
      const row = {'Name':supplier.name,'Phone':supplier.phone||'','Group Link':supplier.groupLink||''};
      if(s) Object.assign(s,row); else LOCAL_DB.suppliers.push(row);
      await saveLocalDB();
    }
  },
  async deleteSupplier(name){
    if(SHEET_URL) await sheetPost('deleteSupplier',{name});
    else{ LOCAL_DB.suppliers = LOCAL_DB.suppliers.filter(s=>s['Name']!==name); await saveLocalDB(); }
  },
  async addInventoryCounts(rows){
    if(SHEET_URL) return sheetPost('addInventoryCounts',{rows});
    else{ LOCAL_DB.inventoryCounts.unshift(...rows.slice().reverse()); await saveLocalDB(); }
  },
  async saveDraft(pin, month, section, data){
    if(SHEET_URL) return sheetPost('saveDraft',{draft:{pin,month,section,data}});
    else{
      const d = LOCAL_DB.inventoryDrafts.find(x=>x['PIN Code']===pin && x['Month']===month && x['Section']===section);
      const row = {'PIN Code':pin,'Month':month,'Section':section,'Data':JSON.stringify(data||{}),'Updated At':new Date().toISOString()};
      if(d) Object.assign(d,row); else LOCAL_DB.inventoryDrafts.push(row);
      await saveLocalDB();
    }
  },
  async deleteDraft(pin, month, section){
    if(SHEET_URL) await sheetPost('deleteDraft',{pin,month,section});
    else{ LOCAL_DB.inventoryDrafts = LOCAL_DB.inventoryDrafts.filter(x=>!(x['PIN Code']===pin && x['Month']===month && x['Section']===section)); await saveLocalDB(); }
  },
  async setSetting(key, value){
    if(SHEET_URL) return sheetPost('setSetting',{key,value});
    else{ LOCAL_DB.settings[key]=value; await saveLocalDB(); }
  }
};

async function saveLocalDB(){
  if(LOCAL_DB) localStorage.setItem('goya-local-db', JSON.stringify(LOCAL_DB));
}

async function loadLocalDB(){
  try{
    LOCAL_DB = JSON.parse(localStorage.getItem('goya-local-db')||'null');
    if(!LOCAL_DB) LOCAL_DB = seedData();
  }catch(e){ LOCAL_DB = seedData(); }
}

async function sendOrderEmail(rows){
  if(!rows || rows.length===0) return;
  const staffName = rows[0]['Logged By'] || 'Unknown';
  const bySupplier = {};
  rows.forEach(r=>{
    const sup = r['Supplier'] || 'Unspecified';
    (bySupplier[sup] = bySupplier[sup] || []).push(r);
  });
  let body = `NEW PURCHASE ORDER\n\n`;
  Object.keys(bySupplier).forEach(sup=>{
    body += `${sup}\n`;
    bySupplier[sup].forEach(r=>{ body += `• ${r['Item Name']} — ${r['Quantity']} ${r['Unit']}${r['Note/Remarks']?` (${r['Note/Remarks']})`:''}\n`; });
    body += `\n`;
  });
  body += `Submitted by: ${staffName}\n${fmtDateTime(new Date().toISOString())}`;
  const subject = `New Purchase Order by ${staffName}`;
  const mailtoLink = `mailto:${OWNER_EMAIL}?subject=${encodeURIComponent(subject)}&body=${encodeURIComponent(body)}`;
  try{
    if(isSheetConnected()){
      await fetch(SHEET_URL, {method:'POST', body:JSON.stringify({action:'sendEmail',to:OWNER_EMAIL,subject,body})});
    }
  }catch(e){ console.warn('Auto-email failed, user can click mailto:', e); }
}

function waLink(phone, text){
  const encoded = encodeURIComponent(text);
  if(phone && phone.trim()) return `https://wa.me/${phone.replace(/[^0-9]/g,'')}?text=${encoded}`;
  return `https://api.whatsapp.com/send?text=${encoded}`;
}

function buildPurchaseOrderMessage(bySupplier, staffName){
  let msg = `*NEW PURCHASE ORDER*\n\n`;
  Object.keys(bySupplier).forEach(sup=>{
    msg += `*${sup}*\n`;
    bySupplier[sup].forEach(it=>{ msg += `• ${it.name} — ${it.qty} ${it.unit}${it.note? ' ('+it.note+')':''}\n`; });
    msg += `\n`;
  });
  msg += `Submitted by: ${staffName}\n${fmtDateTime(new Date().toISOString())}`;
  return msg;
}

async function copyToClipboard(text){
  try{ await navigator.clipboard.writeText(text); return true; }catch(e){ return false; }
}

function escHtml(s){ return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#x27;'); }
function fmtDate(iso){ return iso? iso.slice(0,10) : ''; }
function fmtDateTime(iso){ return iso? iso.slice(0,16).replace('T',' ') : ''; }
function todayISO(){ return new Date().toISOString().slice(0,10); }
function monthLabel(){ return new Date().toISOString().slice(0,7); }
function inCurrentMonth(ts){ return (ts||'').slice(0,7) === monthLabel(); }
function parseSections(str){ return (str||'').split(',').map(s=>s.trim()).filter(Boolean); }

function showToast(msg){
  const t = document.createElement('div');
  t.style.cssText = 'position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:#222;color:#fff;padding:12px 20px;border-radius:6px;font-size:14px;z-index:9999;animation:slideUp .3s ease';
  t.textContent = msg;
  document.body.appendChild(t);
  setTimeout(()=>t.remove(), 3000);
}

function openPinPad(title, onSubmit){
  const holder = document.createElement('div');
  holder.className='overlay';
  holder.id='pin-keypad';
  let input = '';
  const pad = `<div class="pin-pad">
    <h3 style="text-align:center;margin-bottom:16px;">${escHtml(title)}</h3>
    <input type="password" id="pin-input" placeholder="••••" style="text-align:center;font-size:20px;letter-spacing:8px;width:140px;height:50px;border:2px solid var(--line);border-radius:8px;margin:0 auto 20px;display:block;">
    <div class="pin-grid">${[1,2,3,4,5,6,7,8,9,0].map(n=>`<button onclick="insertPin(${n})">${n}</button>`).join('')}
    <button onclick="deletePin()" style="grid-column:2;background:#e8d4c4;">⌫</button></div>
    <div class="row" style="margin-top:16px;gap:8px;">
      <button class="btn btn-ghost" onclick="closePinPad()">Cancel</button>
      <button class="btn btn-primary" onclick="submitPin()">OK</button>
    </div>
  </div>`;
  holder.innerHTML = `<div class="modal">${pad}</div>`;
  document.body.appendChild(holder);
  window.pinInput = () => document.getElementById('pin-input');
  window.insertPin = (n) => { input+= n; window.pinInput().value = '•'.repeat(input.length); };
  window.deletePin = () => { input = input.slice(0,-1); window.pinInput().value = '•'.repeat(input.length); };
  window.closePinPad = () => holder.remove();
  window.submitPin = async () => {
    if(await onSubmit(input)){
      holder.remove();
      showToast('Unlocked');
    } else {
      showToast('Wrong PIN');
      input = '';
      window.pinInput().value = '';
    }
  };
}

/* ============================================================
   STAFF PORTAL LOGIC
   ============================================================ */
let DB={items:[],staff:[],orders:[],production:[],wastage:[],inventoryCounts:[],inventoryDrafts:[],suppliers:[],settings:{}};
let UI={loaded:false,currentPin:null,tab:'order',orderCart:[],productionCart:[],wastageCart:[],orderFilters:{search:'',supplier:'',status:'',from:'',to:'',page:1},historyTab:'orders',countMonth:monthLabel(),countSection:null,countValues:{}};

async function boot(){
  await loadLocalDB(); 
  await initBackend();
  DB=await api.getAll();
  const p=await getLocalSetting('goya-staff-pin');
  if(p&&DB.staff.some(s=>s['PIN Code']===p))UI.currentPin=p;
  UI.loaded=true;
  render();
}

function currentStaff(){return DB.staff.find(s=>s['PIN Code']===UI.currentPin);}
function staffDisplayName(){const s=currentStaff();return s?s['Staff Full Name']:'—';}
function allowedSections(){const s=currentStaff();return s?parseSections(s['Allowed Sections']):[];}
function orderableItems(){return DB.items.filter(it=>(it['Supplier']||'').trim()!=='');}
function internalItems(){return DB.items.filter(it=>(it['Supplier']||'').trim()==='');}

function render(){
  const app=document.getElementById('app');
  if(!UI.loaded){app.innerHTML=`<div class="gate-wrap"><div class="gate-card"><h2 style="text-align:center;margin-bottom:20px;">Goya Portal</h2><p style="text-align:center;color:var(--ink-soft);margin-bottom:20px;">Loading...</p></div></div>`;return;}
  if(!UI.currentPin){renderLogin();return;}
  let html=`<div class="topbar"><div class="brand">👤 ${escHtml(staffDisplayName())}</div><div><button class="btn btn-ghost btn-sm" onclick="logout()">Switch</button></div></div>`;
  html+=`<div class="tabs">${[['order','📤 Send Order'],['production','🏭 Production'],['wastage','🗑 Wastage'],['history','📋 History']].map(([k,l])=>`<button class="tab-btn ${UI.tab===k?'active':''}" onclick="UI.tab='${k}';render();">${l}</button>`).join('')}</div>`;
  if(DB.settings.InventoryCountEnabled==='true'&&allowedSections().length>0)html+=`<div class="tabs"><button class="tab-btn ${UI.tab==='count'?'active':''}" onclick="UI.tab='count';render();">📊 Inventory</button></div>`;
  html+=`<div class="main">`;
  if(UI.tab==='order')html+=renderOrder();
  else if(UI.tab==='production')html+=renderProduction();
  else if(UI.tab==='wastage')html+=renderWastage();
  else if(UI.tab==='count')html+=renderCount();
  else html+=renderHistory();
  html+=`</div>`;
  app.innerHTML=html;
}

function renderLogin(){
  document.getElementById('app').innerHTML=`<div class="gate-wrap"><div class="gate-card"><h2 style="text-align:center;margin-bottom:20px;">Goya Portal</h2><p style="color:var(--ink-soft);text-align:center;margin-bottom:20px;">Who's working today?</p><div class="staff-pick">${DB.staff.map(s=>`<button class="btn btn-primary" onclick="loginAs('${s['PIN Code']}')">👤 ${escHtml(s['Staff Full Name'])}</button>`).join('')}</div></div></div>`;

function loginAs(pin){
  const s=DB.staff.find(x=>x['PIN Code']===pin);
  openPinPad(`PIN for ${s['Staff Full Name']}`,async(entered)=>{
    if(entered===pin){
      UI.currentPin=pin;
      await setLocalSetting('goya-staff-pin',pin);
      showToast('Welcome!');
      render();
      return true;
    }
    return false;
  });
}

function logout(){UI.currentPin=null;setLocalSetting('goya-staff-pin','');render();}

function renderOrder(){
  let html=`<div class="row"><div style="flex:1;min-width:300px;"><div class="card"><h3 style="margin-bottom:12px;">Find items</h3><input type="text" placeholder="Search..." class="input-text" oninput="UI.orderFilters.search=this.value;render();" value="${escHtml(UI.orderFilters.search)}"><div class="item-list" style="margin-top:12px;">`;
  const items=orderableItems().filter(it=>!UI.orderFilters.search||it['Name'].toLowerCase().includes(UI.orderFilters.search.toLowerCase())||it['Supplier'].toLowerCase().includes(UI.orderFilters.search.toLowerCase()));
  items.forEach(it=>{
    html+=`<div class="item-row"><div><div class="item-name">${escHtml(it['Name'])}</div><div class="item-meta">${escHtml(it['Supplier'])}</div></div><button class="btn btn-primary btn-sm" onclick="addToCart('${it['Row ID']}')">Add</button></div>`;
  });
  html+=`</div></div></div><div style="flex:1;min-width:280px;"><div class="card"><h3 style="margin-bottom:12px;">Cart (${UI.orderCart.length})</h3>`;
  if(UI.orderCart.length===0)html+=`<p style="color:var(--ink-soft);">Empty</p>`;
  else{
    html+=UI.orderCart.map((c,i)=>`<div class="cart-item"><div><div class="item-name">${escHtml(c.name)}</div><div class="item-meta">${escHtml(c.supplier)}</div></div><div><input type="number" step="0.1" value="${c.qty}" onchange="UI.orderCart[${i}].qty=parseFloat(this.value)||1;" class="input-number" style="width:80px;"></div><button class="btn btn-danger btn-sm" onclick="UI.orderCart.splice(${i},1);render();">✕</button></div>`).join('');
    html+=`<button class="btn btn-primary" style="width:100%;margin-top:12px;" onclick="submitOrder()">Submit (${UI.orderCart.length})</button>`;
  }
  html+=`</div></div></div>`;
  return html;

function addToCart(rowId){
  const it=DB.items.find(x=>x['Row ID']===rowId);
  if(!it)return;
  const u=it['Storage Unit']||it['Ingredient Unit']||'unit';
  UI.orderCart.push({name:it['Name'],supplier:it['Supplier'],qty:1,unit:u});
  render();
}

async function submitOrder(){
  if(UI.orderCart.length===0){showToast('Empty cart');return;}
  const rows=UI.orderCart.map((c,i)=>({'Timestamp':new Date(Date.now()+i).toISOString(),'Order Date':todayISO(),'Item Name':c.name,'Quantity':c.qty,'Unit':c.unit,'Supplier':c.supplier,'Status':'PENDING','Note/Remarks':'','Received Date':'','Logged By':staffDisplayName()}));
  await api.addOrders(rows);
  DB=await api.getAll();
  UI.orderCart=[];
  render();
  showSuccessPopup('Order submitted!',`${rows.length} item${rows.length===1?'':'s'} sent to owner`);
}

function renderCount(){
  if(DB.settings.InventoryCountEnabled!=='true')return`<div class="card"><div class="empty-state"><h3>Inventory count is OFF</h3></div></div>`;
  const allowed=allowedSections();
  if(!allowed.length)return`<div class="card"><div class="empty-state"><h3>No section access</h3></div></div>`;
  if(!UI.countSection||!allowed.includes(UI.countSection))UI.countSection=allowed[0];
  const items=DB.items.filter(it=>(it['Items Type']||'').toLowerCase()===UI.countSection);
  return`<div class="card"><div class="section-title"><h3>Month: ${UI.countMonth} | Section: ${SECTION_LABEL[UI.countSection]||UI.countSection}</h3><div class="row"><select onchange="UI.countSection=this.value;render();" class="input-select">${allowed.map(s=>`<option value="${s}" ${UI.countSection===s?'selected':''}>${SECTION_LABEL[s]}</option>`).join('')}</select></div></div><div class="table-wrap"><table><tr style="background:var(--parchment);"><th>Item</th><th>Storage</th><th>Ingredient</th></tr>${items.map(it=>{const v=UI.countValues[it['Row ID']]||{};return`<tr><td>${escHtml(it['Name'])}</td><td><input type="number" step="0.1" value="${v.storage!=null?v.storage:''}" onchange="UI.countValues['${it['Row ID']}']=UI.countValues['${it['Row ID']}']||{};UI.countValues['${it['Row ID']}'].storage=parseFloat(this.value);" class="input-number" style="width:100px;"></td><td><input type="number" step="0.1" value="${v.ingredient!=null?v.ingredient:''}" onchange="UI.countValues['${it['Row ID']}']=UI.countValues['${it['Row ID']}']||{};UI.countValues['${it['Row ID']}'].ingredient=parseFloat(this.value);" class="input-number" style="width:100px;"></td></tr>`;}).join('')}</table></div><div class="row" style="margin-top:16px;"><button class="btn btn-primary" onclick="submitCount()">Submit Count</button></div></div>`;
}

async function submitCount(){
  const items=DB.items.filter(it=>(it['Items Type']||'').toLowerCase()===UI.countSection);
  const rows=[];
  items.forEach(it=>{
    const v=UI.countValues[it['Row ID']];
    if(v&&(v.storage!=null||v.ingredient!=null))rows.push({'Count Date / Month':UI.countMonth,'Section':UI.countSection,'Item Name':it['Name'],'SKU':it['SKU']||'','Storage Quantity':v.storage!=null?v.storage:'','Ingredient Quantity':v.ingredient!=null?v.ingredient:'','Submitted By':staffDisplayName()});
  });
  if(rows.length===0){showToast('Enter at least one');return;}
  await api.addInventoryCounts(rows);
  DB=await api.getAll();
  UI.countValues={};
  render();
  showSuccessPopup('Count submitted!',`${rows.length} items for ${SECTION_LABEL[UI.countSection]}`);
}

function renderHistory(){
  let html=`<div class="card"><div class="section-title"><h3>History</h3><div class="row"><button class="btn ${UI.historyTab==='orders'?'btn-primary':'btn-ghost'} btn-sm" onclick="UI.historyTab='orders';UI.orderFilters.page=1;render();">Orders</button><button class="btn ${UI.historyTab==='prod'?'btn-primary':'btn-ghost'} btn-sm" onclick="UI.historyTab='prod';render();">Production</button><button class="btn ${UI.historyTab==='waste'?'btn-primary':'btn-ghost'} btn-sm" onclick="UI.historyTab='waste';render();">Wastage</button></div></div>`;
  if(UI.historyTab==='orders'){
    const f=UI.orderFilters;
    let rows=DB.orders.slice().sort((a,b)=>new Date(b['Timestamp'])-new Date(a['Timestamp']));
    if(f.search)rows=rows.filter(o=>o['Item Name'].toLowerCase().includes(f.search.toLowerCase()));
    if(f.supplier)rows=rows.filter(o=>o['Supplier']===f.supplier);
    if(f.status)rows=rows.filter(o=>o['Status']===f.status);
    if(f.from)rows=rows.filter(o=>o['Timestamp'].slice(0,10)>=f.from);
    if(f.to)rows=rows.filter(o=>o['Timestamp'].slice(0,10)<=f.to);
    const perPage=30,totalPages=Math.max(1,Math.ceil(rows.length/perPage)),page=Math.min(UI.orderFilters.page,totalPages),pageRows=rows.slice((page-1)*perPage,page*perPage);
    html+=`<div class="row" style="margin-bottom:12px;"><input type="text" placeholder="Search..." class="input-text" value="${escHtml(f.search)}" oninput="UI.orderFilters.search=this.value;UI.orderFilters.page=1;render();"><input type="date" class="input-text" value="${f.from}" onchange="UI.orderFilters.from=this.value;UI.orderFilters.page=1;render();"><input type="date" class="input-text" value="${f.to}" onchange="UI.orderFilters.to=this.value;UI.orderFilters.page=1;render();"></div><div class="table-wrap"><table><tr style="background:var(--parchment);"><th>Date</th><th>Item</th><th>Qty</th><th>Supplier</th><th>Status</th><th>By</th></tr>${pageRows.map(o=>`<tr><td class="mono" style="font-size:12px;">${fmtDateTime(o['Timestamp'])}</td><td>${escHtml(o['Item Name'])}</td><td>${o['Quantity']} ${escHtml(o['Unit'])}</td><td>${escHtml(o['Supplier'])}</td><td><span class="badge">${STATUS_LABEL[o['Status']]||o['Status']}</span></td><td>${escHtml(o['Logged By'])}</td></tr>`).join('')}</table></div>${totalPages>1?`<div class="pagination">${Array.from({length:totalPages},(_,i)=>i+1).map(p=>`<button class="${p===page?'active':''}" onclick="UI.orderFilters.page=${p};render();">${p}</button>`).join('')}</div>`:''}`;
  } else if(UI.historyTab==='prod'){
    let rows=DB.production.filter(r=>inCurrentMonth(r['Timestamp'])).sort((a,b)=>new Date(b['Timestamp'])-new Date(a['Timestamp']));
    html+=`<div class="table-wrap"><table><tr style="background:var(--parchment);"><th>Date</th><th>Item</th><th>Qty</th><th>By</th></tr>${rows.map(r=>`<tr><td class="mono" style="font-size:12px;">${fmtDateTime(r['Timestamp'])}</td><td>${escHtml(r['Item Name'])}</td><td>${r['Quantity']} ${escHtml(r['Unit'])}</td><td>${escHtml(r['Logged By'])}</td></tr>`).join('')}</table></div>`;
  } else {
    let rows=DB.wastage.filter(r=>inCurrentMonth(r['Timestamp'])).sort((a,b)=>new Date(b['Timestamp'])-new Date(a['Timestamp']));
    html+=`<div class="table-wrap"><table><tr style="background:var(--parchment);"><th>Date</th><th>Item</th><th>Qty</th><th>Reason</th><th>By</th></tr>${rows.map(r=>`<tr><td class="mono" style="font-size:12px;">${fmtDateTime(r['Timestamp'])}</td><td>${escHtml(r['Item Name'])}</td><td>${r['Quantity']} ${escHtml(r['Unit'])}</td><td><span class="tag">${escHtml(r['Reason'])}</span></td><td>${escHtml(r['Logged By'])}</td></tr>`).join('')}</table></div>`;
  } 
  html+=`</div>`;return html;
}

function showSuccessPopup(title,subtitle){
  const h=document.createElement('div');
  h.innerHTML=`<div class="success-popup"><div class="success-check">✓</div><h3>${escHtml(title)}</h3><p style="color:var(--ink-soft);margin-top:8px;">${escHtml(subtitle)}</p><button class="btn btn-primary" style="width:100%;margin-top:16px;" onclick="this.parentElement.parentElement.remove();">OK</button></div>`;
  document.body.appendChild(h);
  setTimeout(()=>{const e=h.querySelector('.success-popup');if(e)h.remove();},2500);
}

boot();
</script>
