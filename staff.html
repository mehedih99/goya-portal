<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Goya Staff Portal</title>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600;9..144,700&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--espresso:#1e1810;--sage:#527945;--sage-hover:#436337;--ink:#1f1f1f;--ink-soft:#665c54;--line:#e4dec9;--parchment:#f7f5ef;--parchment-2:#eeecdf;--alert:#b93835;--radius:12px;--shadow:0 4px 20px rgba(45,36,22,0.06)}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'Plus Jakarta Sans',sans-serif;background:var(--parchment);color:var(--ink);line-height:1.5;-webkit-tap-highlight-color:transparent}
input,select,button,textarea{font-family:inherit;font-size:inherit;color:inherit}
.topbar{background:#fff;padding:14px 20px;display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid var(--line);box-shadow:var(--shadow);position:sticky;top:0;z-index:100}
.brand{font-weight:700;font-size:16px;font-family:'Fraunces',serif;color:var(--espresso);display:flex;align-items:center;gap:8px}
.container{max-width:800px;margin:0 auto;padding:16px}
.card{background:#fff;border-radius:var(--radius);padding:20px;margin-bottom:16px;box-shadow:var(--shadow);border:1px solid rgba(228,222,201,0.6);overflow-x:auto}
@media (max-width:600px){.card{padding:16px}}
.section-title{display:flex;justify-content:space-between;align-items:center;margin-bottom:16px;flex-wrap:wrap;gap:10px}
.section-title h3{font-size:18px;font-weight:700;font-family:'Fraunces',serif;color:var(--espresso)}
.row{display:flex;gap:12px;flex-wrap:wrap;align-items:center}
.btn{padding:12px 18px;border:none;border-radius:8px;font-weight:600;cursor:pointer;transition:all .2s;font-size:14px;display:inline-flex;align-items:center;justify-content:center;gap:6px}
.btn-primary{background:var(--sage);color:#fff;width:100%}
.btn-primary:hover{background:var(--sage-hover)}
.btn-danger{background:#fdf2f2;color:var(--alert);padding:8px 12px;font-size:13px}
.input-text,.input-select{padding:12px 14px;border:1.5px solid var(--line);border-radius:8px;background:#fffdfa;width:100%;font-size:14px}
.input-text:focus,.input-select:focus{outline:none;border-color:var(--sage)}
table{width:100%;border-collapse:collapse;font-size:13.5px;white-space:nowrap;min-width:500px}
th{background:var(--parchment-2);padding:12px;text-align:left;font-weight:700;color:var(--espresso);text-transform:uppercase;font-size:11px}
td{padding:12px;border-bottom:1px solid var(--line);vertical-align:middle}
.kpi-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-bottom:16px}
.kpi-card{background:#fff;border:1px solid var(--line);padding:14px;border-radius:12px;text-align:center;box-shadow:var(--shadow)}
.kpi-val{font-size:24px;font-weight:700;font-family:'Fraunces',serif;color:var(--espresso);margin-top:4px}
.toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);background:var(--sage);color:#fff;padding:14px 24px;border-radius:10px;font-weight:600;z-index:9999;box-shadow:0 10px 30px rgba(0,0,0,0.25);font-size:14px}
.gate-wrap{display:flex;align-items:center;justify-content:center;min-height:100vh;background:var(--espresso);padding:20px}
.gate-card{background:#fff;padding:40px 24px;border-radius:16px;text-align:center;width:100%;max-width:380px}
.pin-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-top:20px}
.pin-grid button{height:64px;font-size:22px;font-weight:600;border:1.5px solid var(--line);background:#fff;border-radius:12px;cursor:pointer}
.pin-grid button:active{background:var(--parchment)}
.nav-tabs{display:flex;gap:6px;background:#fff;padding:10px;border-radius:12px;box-shadow:var(--shadow);margin-bottom:16px;overflow-x:auto}
.nav-tabs button{padding:10px 14px;border:none;background:none;cursor:pointer;border-radius:8px;font-weight:600;color:var(--ink-soft);font-size:13.5px;white-space:nowrap}
.nav-tabs button.active{background:var(--espresso);color:#fff}
</style>
</head>
<body>
<div id="app"></div>
<script>
let DB = {
  master_items: [ { 'Row ID':1, Name:'Ethiopian Green Beans', SKU:'BEAN-ETH-01', 'Storage Unit':'KG', 'Ingredient Unit':'GRAM', Supplier:'Sunrise Bean Co.', 'Items Type':'bar' } ],
  staff: [ { 'PIN Code':1111, 'Staff Full Name':'Aisha Rahman', 'Allowed Sections':'bar' } ],
  orders: [ { 'Order Date':'01 Aug 2026', 'Item Name':'Ethiopian Green Beans', Quantity:5, Unit:'KG', Status:'PENDING', 'Note/Remarks':'Check expiry', 'Logged By':'Aisha Rahman' } ],
  inventoryCounts: [ { 'Count Date / Month':'2026-08', Section:'bar', 'Item Name':'Ethiopian Green Beans', SKU:'BEAN-ETH-01', 'Storage Quantity':3, 'Submitted By':'Aisha Rahman' } ],
  settings: { TargetInventoryMonth:'2026-08', CustomPages:[] }
};
let UI = { unlocked:false, user:null, tab:'dashboard' };

function esc(s){ return String(s||'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function showToast(msg){ const t=document.createElement('div'); t.className='toast'; t.textContent=msg; document.body.appendChild(t); setTimeout(()=>t.remove(), 2500); }

async function loadData() {
  const url = localStorage.getItem('goya-sheet-url');
  if(url) { try { const res = await fetch(url+'?action=getAll'); const data = await res.json(); if(!data.error) DB = {...DB, ...data}; } catch(e){} }
  render();
}

function render() {
  const app = document.getElementById('app');
  if(!UI.unlocked) {
    app.innerHTML = '<div class="gate-wrap"><div class="gate-card"><h2 style="font-family:\'Fraunces\',serif;margin-bottom:8px;font-size:24px;color:var(--espresso)">Staff Portal</h2><p style="margin-bottom:20px;color:var(--ink-soft);font-size:13.5px">Enter your 4-Digit Staff PIN</p><input type="password" id="pin-input" readonly placeholder="••••" style="text-align:center;font-size:28px;letter-spacing:12px;width:100%;padding:14px;border-radius:12px;border:2px solid var(--line);margin-bottom:14px;background:#fffdfa"><div class="pin-grid">' + [1,2,3,4,5,6,7,8,9,0].map(n=>'<button onclick="document.getElementById(\'pin-input\'].value+=' + n + '">' + n + '</button>').join('') + '<button onclick="document.getElementById(\'pin-input\').value=\'\'" style="color:var(--ink-soft)">⌫</button><button onclick="login(document.getElementById(\'pin-input\').value)" class="btn-primary" style="border:none;height:64px;font-size:18px">GO</button></div></div></div>';
    return;
  }

  const staffName = UI.user['Staff Full Name'];
  const staffCounts = DB.inventoryCounts.filter(c => c['Submitted By'] === staffName).sort((a,b)=>new Date(b['Count Date / Month'])-new Date(a['Count Date / Month']));

  let html = '<div class="topbar"><div class="brand">👤 ' + esc(staffName) + '</div><button class="btn btn-danger" onclick="UI.unlocked=false;render()">Logout</button></div>';
  html += '<div class="container"><div class="nav-tabs">' + [['dashboard','📊 Dashboard'],['order','🛒 Send Order'],['history','📋 Inventory History'],['notices','📰 Notices']].map(([k,l])=>'<button class="' + (UI.tab===k?'active':'') + '" onclick="UI.tab=\'' + k + '\';render()">' + l + '</button>').join('') + '</div>';

  if(UI.tab==='dashboard') {
    html += '<div class="card"><h3>Live Order History & Status</h3><div class="kpi-grid" style="margin-top:14px"><div class="kpi-card"><div>Pending</div><div class="kpi-val">' + DB.orders.filter(o=>o.Status==='PENDING').length + '</div></div><div class="kpi-card"><div>Ordered</div><div class="kpi-val">' + DB.orders.filter(o=>o.Status==='ORDERED').length + '</div></div><div class="kpi-card"><div>Received</div><div class="kpi-val" style="color:var(--sage)">' + DB.orders.filter(o=>o.Status==='RECEIVED').length + '</div></div></div></div>';
  }
  else if(UI.tab==='order') {
    html += '<div class="card"><div class="section-title"><h3>Purchase Order Cart</h3><span style="font-size:12px;color:var(--ink-soft)">Target Month: <strong>' + DB.settings.TargetInventoryMonth + '</strong></span></div><div style="overflow-x:auto"><table><tr><th>Item Name</th><th>Qty</th><th>Note / Remarks</th></tr>' + DB.master_items.map((i,idx)=>'<tr><td><strong>' + esc(i.Name) + '</strong><br><small style="color:var(--ink-soft)">SKU: ' + i.SKU + '</small></td><td><input type="number" id="qty_' + idx + '" class="input-text" style="width:75px" placeholder="0"></td><td><input type="text" id="note_' + idx + '" class="input-text" placeholder="Add note..."></td></tr>').join('') + '</table></div><button class="btn btn-primary" style="margin-top:16px" onclick="submitStaffOrder()">Submit & WhatsApp</button></div>';
  }
  else if(UI.tab==='history') {
    html += '<div class="card"><h3>My Monthly Inventory History</h3><div style="overflow-x:auto;margin-top:12px"><table><tr><th>Month</th><th>Section</th><th>Item Name</th><th>Storage Qty</th></tr>' + (staffCounts.map(c=>'<tr><td>' + c['Count Date / Month'] + '</td><td>' + c.Section + '</td><td><strong>' + esc(c['Item Name']) + '</strong></td><td>' + c['Storage Quantity'] + '</td></tr>').join('') || '<tr><td colspan="4" style="text-align:center;color:var(--ink-soft)">No inventory history found for your account.</td></tr>') + '</table></div></div>';
  }
  else if(UI.tab==='notices') {
    html += '<div class="card"><h3>Portal Notices & Schedules</h3>' + (DB.settings.CustomPages.map(p=>'<div style="margin-top:14px;padding:14px;background:var(--parchment-2);border-radius:8px"><h4>' + esc(p.Title) + '</h4><p style="margin-top:6px;font-size:13.5px">' + esc(p.Body) + '</p></div>').join('') || '<p style="margin-top:12px;color:var(--ink-soft)">No active notices.</p>') + '</div>';
  }

  html += '</div>';
  app.innerHTML = html;
}

function submitStaffOrder() {
  let orderText = "NEW PURCHASE ORDER\nSubmitted by: " + UI.user['Staff Full Name'] + "\n\n";
  let hasItems = false;
  DB.master_items.forEach((i, idx) => {
    const q = document.getElementById('qty_' + idx).value;
    const note = document.getElementById('note_' + idx).value;
    if(q && q > 0) {
      hasItems = true;
      orderText += `• ${i.Name} : ${q} ${i.Storage_Unit || ''} ${note ? '('+note+')' : ''}\n`;
    }
  });
  if(!hasItems) { showToast('Please enter quantity for at least one item!'); return; }
  
  showToast('Order Submitted & Email Sent!');
  const whatsappUrl = "https://wa.me/?text=" + encodeURIComponent(orderText);
  window.open(whatsappUrl, '_blank');
}

function login(pin) {
  const found = DB.staff.find(x => String(x['PIN Code']) === String(pin));
  if(found) {
    UI.unlocked = true;
    UI.user = found;
    UI.tab = 'dashboard';
    render();
  } else {
    showToast('Incorrect Staff PIN!');
    document.getElementById('pin-input').value = '';
  }
}

loadData();
</script>
</body>
</html>
