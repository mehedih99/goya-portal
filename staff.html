<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Goya Portal — Staff</title><link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,600;9..144,700&family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet"><style>*{margin:0;padding:0;box-sizing:border-box}:root{--espresso:#2d2416;--sage:#6b8e5f;--ink:#1a1a1a;--ink-soft:#666;--line:#e5ddd0;--parchment:#f5f1e8;--parchment-2:#ede9df;--alert:#d9534f}body{font-family:Inter,-apple-system,sans-serif;background:#faf8f5;color:var(--ink);line-height:1.5}input,select,button,textarea{font-family:inherit;font-size:inherit;color:inherit}.topbar{background:#fff;padding:12px 18px;display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid var(--line);box-shadow:0 1px 3px rgba(0,0,0,.08);position:sticky;top:0;z-index:100}.brand{display:flex;align-items:center;gap:10px;font-weight:600;color:var(--espresso)}.brand img{height:28px}.tabs{display:flex;gap:4px;background:#fff;padding:0 16px;border-bottom:1px solid var(--line);flex-wrap:wrap}.tab-btn{padding:12px 16px;background:none;border:none;cursor:pointer;font-weight:500;color:var(--ink-soft);border-bottom:3px solid transparent;transition:all .2s}.tab-btn.active{color:var(--espresso);border-color:var(--sage)}.main{padding:20px;max-width:1200px;margin:0 auto}.card{background:#fff;border-radius:10px;padding:20px;margin-bottom:16px;box-shadow:0 1px 3px rgba(0,0,0,.06)}.section-title{display:flex;justify-content:space-between;align-items:center;margin-bottom:16px}.section-title h3{font-size:18px;font-weight:600}.row{display:flex;gap:12px;flex-wrap:wrap;align-items:center}.row>*{min-width:0;flex:1}.btn{padding:10px 16px;border:none;border-radius:6px;font-weight:600;cursor:pointer;transition:all .2s;font-size:14px}.btn-primary{background:var(--sage);color:#fff}.btn-primary:hover{background:#5a7a50}.btn-ghost{background:transparent;border:1.5px solid var(--line);color:var(--ink)}.btn-ghost:hover{background:var(--parchment)}.btn-danger{background:var(--alert);color:#fff}.btn-danger:hover{background:#c94444}.btn-sm{padding:8px 12px;font-size:13px}.input-text,.input-number,.input-select{padding:10px 12px;border:1.5px solid var(--line);border-radius:6px;background:#fff;width:100%}.input-text:focus,.input-number:focus,.input-select:focus{outline:none;border-color:var(--sage);box-shadow:0 0 0 3px rgba(107,142,95,.1)}.item-list{max-height:600px;overflow-y:auto}.item-row{display:flex;justify-content:space-between;align-items:center;padding:12px;background:var(--parchment);border-radius:6px;margin-bottom:8px}.item-name{font-weight:600;color:var(--espresso)}.item-meta{font-size:12px;color:var(--ink-soft);margin-top:2px}.cart-item{background:var(--parchment-2);padding:12px;border-radius:6px;margin-bottom:10px;display:grid;grid-template-columns:1fr auto auto;gap:8px;align-items:start}.success-popup{position:fixed;top:50%;left:50%;transform:translate(-50%,-50%);background:#fff;padding:32px;border-radius:12px;box-shadow:0 10px 40px rgba(0,0,0,.2);text-align:center;z-index:9999;max-width:420px;width:90%}.success-check{width:56px;height:56px;border-radius:50%;background:#e3ecdd;color:var(--sage);display:flex;align-items:center;justify-content:center;font-size:28px;margin:0 auto 12px}.table-wrap{overflow-x:auto}.table-wrap table{width:100%;border-collapse:collapse;font-size:13px}.table-wrap th{background:var(--parchment);padding:10px 8px;text-align:left;font-weight:600;color:var(--espresso)}.table-wrap td{padding:10px 8px;border-bottom:1px solid var(--line)}.table-wrap tr:hover{background:var(--parchment)}.gate-wrap{display:flex;align-items:center;justify-content:center;min-height:100vh;background:#f5f1e8}.gate-card{background:#fff;padding:40px;border-radius:12px;box-shadow:0 10px 40px rgba(0,0,0,.1);max-width:420px;width:90%}.staff-pick{display:grid;grid-template-columns:1fr;gap:12px;margin:20px 0}.staff-pick button{padding:14px;text-align:center;border-radius:8px;font-weight:600}.empty-state{text-align:center;padding:40px 20px;color:var(--ink-soft)}.empty-state h3{font-size:16px;margin-bottom:8px}.badge{display:inline-block;padding:4px 10px;border-radius:4px;font-size:12px;font-weight:600;background:var(--parchment);color:var(--ink)}.tag{display:inline-block;padding:6px 12px;border-radius:6px;background:#e3ecdd;color:var(--sage);font-size:12px;font-weight:600}.pagination{display:flex;gap:6px;justify-content:center;margin-top:16px;flex-wrap:wrap}.pagination button{padding:6px 12px;border-radius:6px;border:1.5px solid var(--line);background:#fff;font-size:13px;font-weight:600;cursor:pointer}.pagination button.active{background:var(--espresso);color:#fff;border-color:var(--espresso)}.pagination button:disabled{opacity:.4;cursor:not-allowed}@media (max-width:640px){.main{padding:12px}.card{padding:14px}.row{flex-direction:column}.section-title{flex-direction:column;align-items:flex-start}.item-list{max-height:400px}.cart-item{grid-template-columns:1fr}.btn{width:100%;margin-bottom:8px}.table-wrap{font-size:12px}.table-wrap th,.table-wrap td{padding:6px 4px}}</style></head><body><div id="app"></div><script src="goya-common.js"></script><script>
let DB={items:[],staff:[],orders:[],production:[],wastage:[],inventoryCounts:[],inventoryDrafts:[],suppliers:[],settings:{}};
let UI={loaded:false,currentPin:null,tab:'order',orderCart:[],productionCart:[],wastageCart:[],orderFilters:{search:'',supplier:'',status:'',from:'',to:'',page:1},historyTab:'orders',countMonth:monthLabel(),countSection:null,countValues:{}};

async function boot(){await initBackend();DB=await api.getAll();const p=await getLocalSetting('goya-staff-pin');if(p&&DB.staff.some(s=>s['PIN Code']===p))UI.currentPin=p;UI.loaded=true;render();}

function currentStaff(){return DB.staff.find(s=>s['PIN Code']===UI.currentPin);}
function staffDisplayName(){const s=currentStaff();return s?s['Staff Full Name']:'—';}
function allowedSections(){const s=currentStaff();return s?parseSections(s['Allowed Sections']):[];}
function orderableItems(){return DB.items.filter(it=>(it['Supplier']||'').trim()!=='');}
function internalItems(){return DB.items.filter(it=>(it['Supplier']||'').trim()==='');}

function render(){const app=document.getElementById('app');if(!UI.loaded){app.innerHTML=`<div class="gate-wrap"><div class="gate-card"><h2 style="text-align:center;margin-bottom:20px;">Goya Portal</h2><p style="text-align:center;color:var(--ink-soft);margin-bottom:20px;">Loading...</p></div></div>`;return;}
if(!UI.currentPin){renderLogin();return;}
let html=`<div class="topbar"><div class="brand">👤 ${escHtml(staffDisplayName())}</div><div><button class="btn btn-ghost btn-sm" onclick="logout()">Switch</button></div></div>`;html+=`<div class="tabs">${[['order','📤 Send Order'],['production','🏭 Production'],['wastage','🗑 Wastage'],['history','📋 History']].map(([k,l])=>`<button class="tab-btn ${UI.tab===k?'active':''}" onclick="UI.tab='${k}';render();">${l}</button>`).join('')}</div>`;if(DB.settings.InventoryCountEnabled==='true'&&allowedSections().length>0)html+=`<div class="tabs"><button class="tab-btn ${UI.tab==='count'?'active':''}" onclick="UI.tab='count';render();">📊 Inventory</button></div>`;html+=`<div class="main">`;if(UI.tab==='order')html+=renderOrder();else if(UI.tab==='production')html+=renderProduction();else if(UI.tab==='wastage')html+=renderWastage();else if(UI.tab==='count')html+=renderCount();else html+=renderHistory();html+=`</div>`;app.innerHTML=html;}

function renderLogin(){document.getElementById('app').innerHTML=`<div class="gate-wrap"><div class="gate-card"><h2 style="text-align:center;margin-bottom:20px;">Goya Portal</h2><p style="color:var(--ink-soft);text-align:center;margin-bottom:20px;">Who's working today?</p><div class="staff-pick">${DB.staff.map(s=>`<button class="btn btn-primary" onclick="loginAs('${s['PIN Code']}')">👤 ${escHtml(s['Staff Full Name'])}</button>`).join('')}</div></div></div>`;}

function loginAs(pin){const s=DB.staff.find(x=>x['PIN Code']===pin);openPinPad(`PIN for ${s['Staff Full Name']}`,async(entered)=>{if(entered===pin){UI.currentPin=pin;await setLocalSetting('goya-staff-pin',pin);showToast('Welcome!');render();return true;}return false;});}

function logout(){UI.currentPin=null;setLocalSetting('goya-staff-pin','');render();}

function renderOrder(){let html=`<div class="row"><div style="flex:1;min-width:300px;"><div class="card"><h3 style="margin-bottom:12px;">Find items</h3><input type="text" placeholder="Search..." class="input-text" oninput="UI.orderFilters.search=this.value;render();" value="${escHtml(UI.orderFilters.search)}"><div class="item-list" style="margin-top:12px;">`;const items=orderableItems().filter(it=>!UI.orderFilters.search||it['Name'].toLowerCase().includes(UI.orderFilters.search.toLowerCase())||it['Supplier'].toLowerCase().includes(UI.orderFilters.search.toLowerCase()));items.forEach(it=>{html+=`<div class="item-row"><div><div class="item-name">${escHtml(it['Name'])}</div><div class="item-meta">${escHtml(it['Supplier'])}</div></div><button class="btn btn-primary btn-sm" onclick="addToCart('${it['Row ID']}')">Add</button></div>`;});html+=`</div></div></div><div style="flex:1;min-width:280px;"><div class="card"><h3 style="margin-bottom:12px;">Cart (${UI.orderCart.length})</h3>`;if(UI.orderCart.length===0)html+=`<p style="color:var(--ink-soft);">Empty</p>`;else{html+=UI.orderCart.map((c,i)=>`<div class="cart-item"><div><div class="item-name">${escHtml(c.name)}</div><div class="item-meta">${escHtml(c.supplier)}</div></div><div><input type="number" step="0.1" value="${c.qty}" onchange="UI.orderCart[${i}].qty=parseFloat(this.value)||1;" class="input-number" style="width:80px;"></div><button class="btn btn-danger btn-sm" onclick="UI.orderCart.splice(${i},1);render();">✕</button></div>`).join('');html+=`<button class="btn btn-primary" style="width:100%;margin-top:12px;" onclick="submitOrder()">Submit (${UI.orderCart.length})</button>`;}</div></div></div>`;return html;}

function addToCart(rowId){const it=DB.items.find(x=>x['Row ID']===rowId);if(!it)return;const u=it['Storage Unit']||it['Ingredient Unit']||'unit';UI.orderCart.push({name:it['Name'],supplier:it['Supplier'],qty:1,unit:u});render();}

async function submitOrder(){if(UI.orderCart.length===0){showToast('Empty cart');return;}
const rows=UI.orderCart.map((c,i)=>({'Timestamp':new Date(Date.now()+i).toISOString(),'Order Date':todayISO(),'Item Name':c.name,'Quantity':c.qty,'Unit':c.unit,'Supplier':c.supplier,'Status':'PENDING','Note/Remarks':'','Received Date':'','Logged By':staffDisplayName()}));
await api.addOrders(rows);DB=await api.getAll();UI.orderCart=[];render();showSuccessPopup('Order submitted!',`${rows.length} item${rows.length===1?'':'s'} sent to owner`);}

function renderProduction(){let html=`<div class="row"><div style="flex:1;min-width:300px;"><div class="card"><h3 style="margin-bottom:12px;">Select item</h3><div class="item-list">`;internalItems().forEach(it=>{html+=`<div class="item-row"><div><div class="item-name">${escHtml(it['Name'])}</div></div><button class="btn btn-primary btn-sm" onclick="addToProdCart('${it['Row ID']}')">Add</button></div>`;});html+=`</div></div></div><div style="flex:1;min-width:280px;"><div class="card"><h3 style="margin-bottom:12px;">Cart</h3>`;if(UI.productionCart.length===0)html+=`<p style="color:var(--ink-soft);">Empty</p>`;else{html+=UI.productionCart.map((c,i)=>`<div class="cart-item"><div><div class="item-name">${escHtml(c.name)}</div></div><div><input type="number" step="0.1" value="${c.qty}" onchange="UI.productionCart[${i}].qty=parseFloat(this.value)||1;" class="input-number" style="width:80px;"></div><select onchange="UI.productionCart[${i}].unit=this.value;" class="input-select" style="width:100px;"><option>${c.unit}</option></select><button class="btn btn-danger btn-sm" onclick="UI.productionCart.splice(${i},1);render();">✕</button></div>`).join('');html+=`<button class="btn btn-primary" style="width:100%;margin-top:12px;" onclick="submitProduction()">Submit</button>`;}</div></div></div>`;return html;}

function addToProdCart(rowId){const it=DB.items.find(x=>x['Row ID']===rowId);if(!it)return;const u=it['Storage Unit']||it['Ingredient Unit']||'unit';UI.productionCart.push({name:it['Name'],qty:1,unit:u});render();}

async function submitProduction(){if(UI.productionCart.length===0){showToast('Empty cart');return;}
const rows=UI.productionCart.map((c,i)=>({'Timestamp':new Date(Date.now()+i).toISOString(),'Date':todayISO(),'Item Name':c.name,'Quantity':c.qty,'Unit':c.unit,'Logged By':staffDisplayName(),'Status':'Logged'}));
await api.addProduction(rows);DB=await api.getAll();UI.productionCart=[];render();showSuccessPopup('Production logged!',`${rows.length} item${rows.length===1?'':'s'} recorded`);}

function renderWastage(){let html=`<div class="row"><div style="flex:1;min-width:300px;"><div class="card"><h3 style="margin-bottom:12px;">Select item</h3><div class="item-list">`;internalItems().forEach(it=>{html+=`<div class="item-row"><div><div class="item-name">${escHtml(it['Name'])}</div></div><button class="btn btn-primary btn-sm" onclick="addToWasteCart('${it['Row ID']}')">Add</button></div>`;});html+=`</div></div></div><div style="flex:1;min-width:280px;"><div class="card"><h3 style="margin-bottom:12px;">Cart</h3>`;if(UI.wastageCart.length===0)html+=`<p style="color:var(--ink-soft);">Empty</p>`;else{html+=UI.wastageCart.map((c,i)=>`<div class="cart-item"><div><div class="item-name">${escHtml(c.name)}</div></div><div><input type="number" step="0.1" value="${c.qty}" onchange="UI.wastageCart[${i}].qty=parseFloat(this.value)||1;" class="input-number" style="width:80px;"></div><select onchange="UI.wastageCart[${i}].unit=this.value;" class="input-select" style="width:100px;"><option>${c.unit}</option></select><select onchange="UI.wastageCart[${i}].reason=this.value;" class="input-select" style="width:110px;"><option value="Expired">Expired</option><option value="Spillage">Spillage</option><option value="Damaged">Damaged</option><option value="Over-prepared">Over-prepared</option><option value="Staff Mistake">Staff Mistake</option></select><button class="btn btn-danger btn-sm" onclick="UI.wastageCart.splice(${i},1);render();">✕</button></div>`).join('');html+=`<button class="btn btn-danger" style="width:100%;margin-top:12px;" onclick="submitWastage()">Submit</button>`;}</div></div></div>`;return html;}

function addToWasteCart(rowId){const it=DB.items.find(x=>x['Row ID']===rowId);if(!it)return;const u=it['Storage Unit']||it['Ingredient Unit']||'unit';UI.wastageCart.push({name:it['Name'],qty:1,unit:u,reason:'Expired'});render();}

async function submitWastage(){if(UI.wastageCart.length===0){showToast('Empty cart');return;}
const rows=UI.wastageCart.map((c,i)=>({'Timestamp':new Date(Date.now()+i).toISOString(),'Date':todayISO(),'Item Name':c.name,'Quantity':c.qty,'Unit':c.unit,'Reason':c.reason,'Logged By':staffDisplayName(),'Status':'Logged'}));
await api.addWastage(rows);DB=await api.getAll();UI.wastageCart=[];render();showSuccessPopup('Wastage logged!',`${rows.length} item${rows.length===1?'':'s'} recorded`);}

function renderCount(){if(DB.settings.InventoryCountEnabled!=='true')return`<div class="card"><div class="empty-state"><h3>Inventory count is OFF</h3></div></div>`;const allowed=allowedSections();if(!allowed.length)return`<div class="card"><div class="empty-state"><h3>No section access</h3></div></div>`;if(!UI.countSection||!allowed.includes(UI.countSection))UI.countSection=allowed[0];const items=DB.items.filter(it=>(it['Items Type']||'').toLowerCase()===UI.countSection);return`<div class="card"><div class="section-title"><h3>Month: ${UI.countMonth} | Section: ${SECTION_LABEL[UI.countSection]||UI.countSection}</h3><div class="row"><select onchange="UI.countSection=this.value;render();" class="input-select">${allowed.map(s=>`<option value="${s}" ${UI.countSection===s?'selected':''}>${SECTION_LABEL[s]}</option>`).join('')}</select></div></div><div class="table-wrap"><table><tr style="background:var(--parchment);"><th>Item</th><th>Storage</th><th>Ingredient</th></tr>${items.map(it=>{const v=UI.countValues[it['Row ID']]||{};return`<tr><td>${escHtml(it['Name'])}</td><td><input type="number" step="0.1" value="${v.storage!=null?v.storage:''}" onchange="UI.countValues['${it['Row ID']}']=UI.countValues['${it['Row ID']}'||{};UI.countValues['${it['Row ID']}'].storage=parseFloat(this.value);" class="input-number" style="width:100px;"></td><td><input type="number" step="0.1" value="${v.ingredient!=null?v.ingredient:''}" onchange="UI.countValues['${it['Row ID']}']=UI.countValues['${it['Row ID']}'||{};UI.countValues['${it['Row ID']}'].ingredient=parseFloat(this.value);" class="input-number" style="width:100px;"></td></tr>`;}).join('')}</table></div><div class="row" style="margin-top:16px;"><button class="btn btn-primary" onclick="submitCount()">Submit Count</button></div></div>`;}

async function submitCount(){const items=DB.items.filter(it=>(it['Items Type']||'').toLowerCase()===UI.countSection);const rows=[];items.forEach(it=>{const v=UI.countValues[it['Row ID']];if(v&&(v.storage!=null||v.ingredient!=null))rows.push({'Count Date / Month':UI.countMonth,'Section':UI.countSection,'Item Name':it['Name'],'SKU':it['SKU']||'','Storage Quantity':v.storage!=null?v.storage:'','Ingredient Quantity':v.ingredient!=null?v.ingredient:'','Submitted By':staffDisplayName()});});if(rows.length===0){showToast('Enter at least one');return;}
await api.addInventoryCounts(rows);DB=await api.getAll();UI.countValues={};render();showSuccessPopup('Count submitted!',`${rows.length} items for ${SECTION_LABEL[UI.countSection]}`);}

function renderHistory(){let html=`<div class="card"><div class="section-title"><h3>History</h3><div class="row"><button class="btn ${UI.historyTab==='orders'?'btn-primary':'btn-ghost'} btn-sm" onclick="UI.historyTab='orders';UI.orderFilters.page=1;render();">Orders</button><button class="btn ${UI.historyTab==='prod'?'btn-primary':'btn-ghost'} btn-sm" onclick="UI.historyTab='prod';render();">Production</button><button class="btn ${UI.historyTab==='waste'?'btn-primary':'btn-ghost'} btn-sm" onclick="UI.historyTab='waste';render();">Wastage</button></div></div>`;if(UI.historyTab==='orders'){const f=UI.orderFilters;let rows=DB.orders.slice().sort((a,b)=>new Date(b['Timestamp'])-new Date(a['Timestamp']));if(f.search)rows=rows.filter(o=>o['Item Name'].toLowerCase().includes(f.search.toLowerCase()));if(f.supplier)rows=rows.filter(o=>o['Supplier']===f.supplier);if(f.status)rows=rows.filter(o=>o['Status']===f.status);if(f.from)rows=rows.filter(o=>o['Timestamp'].slice(0,10)>=f.from);if(f.to)rows=rows.filter(o=>o['Timestamp'].slice(0,10)<=f.to);const perPage=30,totalPages=Math.max(1,Math.ceil(rows.length/perPage)),page=Math.min(UI.orderFilters.page,totalPages),pageRows=rows.slice((page-1)*perPage,page*perPage);html+=`<div class="row" style="margin-bottom:12px;"><input type="text" placeholder="Search..." class="input-text" value="${escHtml(f.search)}" oninput="UI.orderFilters.search=this.value;UI.orderFilters.page=1;render();"><input type="date" class="input-text" value="${f.from}" onchange="UI.orderFilters.from=this.value;UI.orderFilters.page=1;render();"><input type="date" class="input-text" value="${f.to}" onchange="UI.orderFilters.to=this.value;UI.orderFilters.page=1;render();"></div><div class="table-wrap"><table><tr style="background:var(--parchment);"><th>Date</th><th>Item</th><th>Qty</th><th>Supplier</th><th>Status</th><th>By</th></tr>${pageRows.map(o=>`<tr><td class="mono" style="font-size:12px;">${fmtDateTime(o['Timestamp'])}</td><td>${escHtml(o['Item Name'])}</td><td>${o['Quantity']} ${escHtml(o['Unit'])}</td><td>${escHtml(o['Supplier'])}</td><td><span class="badge">${STATUS_LABEL[o['Status']]||o['Status']}</span></td><td>${escHtml(o['Logged By'])}</td></tr>`).join('')}</table></div>${totalPages>1?`<div class="pagination">${Array.from({length:totalPages},(_,i)=>i+1).map(p=>`<button class="${p===page?'active':''}" onclick="UI.orderFilters.page=${p};render();">${p}</button>`).join('')}</div>`:''}`;} else if(UI.historyTab==='prod'){let rows=DB.production.filter(r=>inCurrentMonth(r['Timestamp'])).sort((a,b)=>new Date(b['Timestamp'])-new Date(a['Timestamp']));html+=`<div class="table-wrap"><table><tr style="background:var(--parchment);"><th>Date</th><th>Item</th><th>Qty</th><th>By</th></tr>${rows.map(r=>`<tr><td class="mono" style="font-size:12px;">${fmtDateTime(r['Timestamp'])}</td><td>${escHtml(r['Item Name'])}</td><td>${r['Quantity']} ${escHtml(r['Unit'])}</td><td>${escHtml(r['Logged By'])}</td></tr>`).join('')}</table></div>`;} else {let rows=DB.wastage.filter(r=>inCurrentMonth(r['Timestamp'])).sort((a,b)=>new Date(b['Timestamp'])-new Date(a['Timestamp']));html+=`<div class="table-wrap"><table><tr style="background:var(--parchment);"><th>Date</th><th>Item</th><th>Qty</th><th>Reason</th><th>By</th></tr>${rows.map(r=>`<tr><td class="mono" style="font-size:12px;">${fmtDateTime(r['Timestamp'])}</td><td>${escHtml(r['Item Name'])}</td><td>${r['Quantity']} ${escHtml(r['Unit'])}</td><td><span class="tag">${escHtml(r['Reason'])}</span></td><td>${escHtml(r['Logged By'])}</td></tr>`).join('')}</table></div>`;} html+=`</div>`;return html;}

function showSuccessPopup(title,subtitle){const h=document.createElement('div');h.innerHTML=`<div class="success-popup"><div class="success-check">✓</div><h3>${escHtml(title)}</h3><p style="color:var(--ink-soft);margin-top:8px;">${escHtml(subtitle)}</p><button class="btn btn-primary" style="width:100%;margin-top:16px;" onclick="this.parentElement.parentElement.remove();">OK</button></div>`;document.body.appendChild(h);setTimeout(()=>{const e=h.querySelector('.success-popup');if(e)h.remove();},2500);}

boot();
</script></body></html>
