<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Staff Portal — Goya</title>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600;9..144,700&family=Plus+Jakarta+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{--espresso:#1e1810;--sage:#527945;--sage-hover:#436337;--ink:#1f1f1f;--ink-soft:#665c54;--line:#e4dec9;--parchment:#f7f5ef;--parchment-2:#eeecdf;--alert:#b93835;--radius:12px;--shadow:0 4px 20px rgba(45,36,22,0.06)}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'Plus Jakarta Sans',sans-serif;background:var(--parchment);color:var(--ink);line-height:1.5;-webkit-tap-highlight-color:transparent}
.topbar{background:#fff;padding:14px 20px;display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid var(--line);box-shadow:var(--shadow)}
.brand{font-weight:700;font-size:16px;font-family:'Fraunces',serif;color:var(--espresso);display:flex;align-items:center;gap:10px}
.brand-logo{width:32px;height:32px;border-radius:50%;object-fit:cover;border:1px solid var(--line)}
.layout{max-width:900px;margin:20px auto;padding:0 16px}
.card{background:#fff;border-radius:var(--radius);padding:20px;margin-bottom:16px;box-shadow:var(--shadow);border:1px solid rgba(228,222,201,0.6)}
.btn{padding:10px 16px;border:none;border-radius:8px;font-weight:600;cursor:pointer;transition:all .2s;font-size:13.5px;display:inline-flex;align-items:center;justify-content:center;gap:6px;}
.btn-primary{background:var(--sage);color:#fff}
.btn-primary:hover{background:var(--sage-hover)}
.btn-danger{background:#fdf2f2;color:var(--alert)}
.input-text,.input-select{padding:12px 14px;border:1.5px solid var(--line);border-radius:8px;background:#fffdfa;width:100%;font-size:14px}
.input-text:focus,.input-select:focus{outline:none;border-color:var(--sage);box-shadow:0 0 0 3px rgba(82,121,69,0.12);background:#fff}
.table-wrap{overflow-x:auto;margin:14px 0;border-radius:8px;border:1px solid var(--line)}
.table-wrap table{width:100%;border-collapse:collapse;font-size:13px;white-space:nowrap}
.table-wrap th{background:var(--parchment-2);padding:10px 12px;text-align:left;font-weight:700;color:var(--espresso);font-size:11px;text-transform:uppercase}
.table-wrap td{padding:10px 12px;border-bottom:1px solid var(--line)}
.gate{display:flex;align-items:center;justify-content:center;min-height:100vh;background:var(--espresso);padding:20px}
.gate-box{background:#fff;padding:36px;border-radius:16px;max-width:380px;width:100%;text-align:center}
.tabs{display:flex;gap:8px;margin-bottom:16px;flex-wrap:wrap}
.tabs button{padding:10px 14px;border:1.5px solid var(--line);background:#fff;border-radius:8px;font-weight:600;cursor:pointer;font-size:13px}
.tabs button.active{background:var(--espresso);color:#fff;border-color:var(--espresso)}
</style>
</head>
<body>
<div id="app"></div>
<script>
let SHEET_URL = localStorage.getItem('goya-sheet-url') || '';
let currentStaff = JSON.parse(localStorage.getItem('goya-current-staff') || 'null');
let DB = { items:[], internalItems:[], staff:[], orders:[], production:[], wastage:[], inventoryCounts:[], suppliers:[], settings:{} };
let staffTab = 'order';
let cart = [];

async function loadDB(){
  if(!SHEET_URL) return;
  try{
    const resp = await fetch(SHEET_URL + '?action=getAll');
    const data = await resp.json();
    if(data && !data.error) DB = data;
  }catch(e){console.error(e);}
}

async function boot(){
  await loadDB();
  render();
}

function render(){
  const app = document.getElementById('app');
  if(!currentStaff){
    app.innerHTML = '<div class="gate"><div class="gate-box">' +
      '<div style="margin-bottom:16px;"><img src="goya logo.jpeg" alt="Logo" style="width:64px;height:64px;border-radius:50%;object-fit:cover;border:2px solid var(--line)"></div>' +
      '<h2 style="font-family:Fraunces,serif;color:var(--espresso);margin-bottom:6px;">Staff Portal</h2>' +
      '<p style="color:var(--ink-soft);font-size:13.5px;margin-bottom:20px;">Enter your 4-Digit Staff PIN</p>' +
      '<input type="password" id="staff-pin" placeholder="••••" maxlength="4" style="text-align:center;font-size:24px;letter-spacing:8px;margin-bottom:16px;" class="input-text">' +
      '<button class="btn btn-primary" style="width:100%;padding:12px;" onclick="loginStaff()">Access Portal</button>' +
    '</div></div>';
    return;
  }

  let html = '<div class="topbar"><div class="brand"><img src="goya logo.jpeg" alt="Logo" class="brand-logo"> ' + escHtml(currentStaff['Staff Full Name']) + '</div><button class="btn btn-danger btn-sm" onclick="logoutStaff()">Switch User</button></div>';
  html += '<div class="layout"><div class="tabs">' +
    '<button class="' + (staffTab==='order'?'active':'') + '" onclick="staffTab=\'order\';render();">📦 Send Order</button>' +
    '<button class="' + (staffTab==='production'?'active':'') + '" onclick="staffTab=\'production\';render();">🏭 Production</button>' +
    '<button class="' + (staffTab==='wastage'?'active':'') + '" onclick="staffTab=\'wastage\';render();">🗑 Wastage</button>' +
    '<button class="' + (staffTab==='counts'?'active':'') + '" onclick="staffTab=\'counts\';render();">🛒 Inventory Count</button>' +
    '<button class="' + (staffTab==='history'?'active':'') + '" onclick="staffTab=\'history\';render();">📊 Inventory History</button>' +
  '</div>';

  if(staffTab==='order') html += renderOrderTab();
  else if(staffTab==='production') html += renderProdTab();
  else if(staffTab==='wastage') html += renderWasteTab();
  else if(staffTab==='counts') html += renderCountsTab();
  else if(staffTab==='history') html += renderHistoryTab();

  html += '</div>';
  app.innerHTML = html;
}

function loginStaff(){
  const pin = document.getElementById('staff-pin').value.trim();
  const staffList = DB.staff || [];
  const found = staffList.find(s => String(s['PIN Code']) === pin);
  if(found){
    currentStaff = found;
    localStorage.setItem('goya-current-staff', JSON.stringify(found));
    render();
  } else {
    alert('Incorrect PIN');
  }
}

function logoutStaff(){
  currentStaff = null;
  localStorage.removeItem('goya-current-staff');
  render();
}

function escHtml(s){ return String(s||'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }

function renderOrderTab(){
  const items = DB.items || [];
  return '<div class="card"><h3>Send Purchase Order</h3><div class="table-wrap"><table><tr><th>Item</th><th>Supplier</th><th>Action</th></tr>' + items.map(it=>'<tr><td><strong>' + escHtml(it['Name']) + '</strong></td><td>' + escHtml(it['Supplier']) + '</td><td><button class="btn btn-primary btn-sm" onclick="addToCart(\'' + escHtml(it['Name']) + '\',\'' + escHtml(it['Supplier']) + '\',\'' + escHtml(it['Storage Unit']) + '\')">Add to Cart</button></td></tr>').join('') + '</table></div></div>' +
  '<div class="card"><h3>Cart (' + cart.length + ')</h3>' + (cart.length===0?'<p style="color:var(--ink-soft);font-size:13px;">Cart is empty.</p>':
    cart.map((c, idx)=>'<div style="background:var(--parchment);padding:10px;border-radius:8px;margin-bottom:8px;display:flex;gap:10px;align-items:center"><div style="flex:1"><strong>' + escHtml(c.name) + '</strong><br><small>' + escHtml(c.supplier) + '</small></div><input type="number" class="input-text" style="width:80px;" value="' + c.qty + '" onchange="updateCartQty(' + idx + ',this.value)"><input type="text" class="input-text" style="flex:1;" placeholder="Note / Remarks" value="' + escHtml(c.note||'') + '" onchange="updateCartNote(' + idx + ',this.value)"><button class="btn btn-danger btn-sm" onclick="removeFromCart(' + idx + ')">✕</button></div>').join('') +
    '<button class="btn btn-primary" style="width:100%;margin-top:12px;" onclick="submitOrder()">Submit Purchase Order</button>'
  ) + '</div>';
}

function addToCart(name, supplier, unit){
  cart.push({name, supplier, unit, qty:1, note:''});
  render();
}
function updateCartQty(idx, val){ cart[idx].qty = val; }
function updateCartNote(idx, val){ cart[idx].note = val; }
function removeFromCart(idx){ cart.splice(idx,1); render(); }

async function submitOrder(){
  if(cart.length===0) return;
  const newOrders = cart.map(c => ({
    'Timestamp': new Date().toISOString(),
    'Order Date': new Date().toISOString().slice(0,10),
    'Item Name': c.name,
    'Quantity': c.qty,
    'Unit': c.unit,
    'Supplier': c.supplier,
    'Note/Remarks': c.note || '',
    'Status': 'PENDING',
    'Logged By': currentStaff['Staff Full Name']
  }));
  DB.orders = (DB.orders || []).concat(newOrders);
  if(SHEET_URL){
    await fetch(SHEET_URL, {method:'POST', body:JSON.stringify({action:'saveAllOrders', orders:DB.orders})});
  }
  cart = [];
  alert('Order Submitted Successfully!');
  render();
}

function renderProdTab(){
  const internal = DB.internalItems || [];
  return '<div class="card"><h3>Log Production Batch</h3><div class="row" style="margin-bottom:12px;"><select class="input-select" id="prod-item">' + internal.map(it=>'<option value="' + escHtml(it['Name']) + '">' + escHtml(it['Name']) + ' (' + escHtml(it['Storage Unit']) + ')</option>').join('') + '</select><input type="number" class="input-text" id="prod-qty" placeholder="Quantity"></div><button class="btn btn-primary" onclick="submitProduction()">Submit Production</button></div>';
}

async function submitProduction(){
  const itemName = document.getElementById('prod-item').value;
  const qty = document.getElementById('prod-qty').value;
  if(!qty){ alert('Enter quantity'); return; }
  const entry = {
    'Timestamp': new Date().toISOString(),
    'Date': new Date().toISOString().slice(0,10),
    'Item Name': itemName,
    'Quantity': qty,
    'Unit': 'Batch',
    'Logged By': currentStaff['Staff Full Name'],
    'Status': 'Logged'
  };
  DB.production = (DB.production || []).concat([entry]);
  if(SHEET_URL){
    await fetch(SHEET_URL, {method:'POST', body:JSON.stringify({action:'saveAllProduction', production:DB.production})});
  }
  alert('Production Logged!');
  render();
}

function renderWasteTab(){
  const internal = DB.internalItems || [];
  return '<div class="card"><h3>Log Wastage / Damage</h3><div class="row" style="margin-bottom:12px;"><select class="input-select" id="waste-item">' + internal.map(it=>'<option value="' + escHtml(it['Name']) + '">' + escHtml(it['Name']) + '</option>').join('') + '</select><input type="number" class="input-text" id="waste-qty" placeholder="Quantity"><input type="text" class="input-text" id="waste-reason" placeholder="Reason (e.g. Expired)"></div><button class="btn btn-primary" onclick="submitWastage()">Submit Wastage</button></div>';
}

async function submitWastage(){
  const itemName = document.getElementById('waste-item').value;
  const qty = document.getElementById('waste-qty').value;
  const reason = document.getElementById('waste-reason').value;
  if(!qty){ alert('Enter quantity'); return; }
  const entry = {
    'Timestamp': new Date().toISOString(),
    'Date': new Date().toISOString().slice(0,10),
    'Item Name': itemName,
    'Quantity': qty,
    'Unit': 'Pcs',
    'Reason': reason || 'Damaged',
    'Logged By': currentStaff['Staff Full Name'],
    'Status': 'Logged'
  };
  DB.wastage = (DB.wastage || []).concat([entry]);
  if(SHEET_URL){
    await fetch(SHEET_URL, {method:'POST', body:JSON.stringify({action:'saveAllWastage', wastage:DB.wastage})});
  }
  alert('Wastage Logged!');
  render();
}

function renderCountsTab(){
  const enabled = DB.settings?.InventoryCountEnabled === 'true';
  const targetMonth = DB.settings?.TargetCountMonth || new Date().toISOString().slice(0,7);
  if(!enabled) return '<div class="card"><h3>Inventory Counts</h3><p style="color:var(--alert)">Inventory Count is currently disabled by Admin.</p></div>';

  const items = DB.items || [];
  return '<div class="card"><h3>Inventory Count Submission (' + targetMonth + ')</h3><p style="color:var(--ink-soft);font-size:13px;margin-bottom:14px;">Enter storage quantities for active items.</p>' +
    '<div class="table-wrap"><table><tr><th>Item Name</th><th>Storage Qty</th></tr>' + items.map((it, idx)=>'<tr><td><strong>' + escHtml(it['Name']) + '</strong></td><td><input type="number" class="input-text" id="cnt-qty-' + idx + '" placeholder="0" style="width:120px;padding:6px"></td></tr>').join('') + '</table></div>' +
    '<button class="btn btn-primary" style="width:100%;margin-top:12px;" onclick="submitCounts(\'' + targetMonth + '\')">Submit Monthly Count</button></div>';
}

async function submitCounts(month){
  const items = DB.items || [];
  let newCounts = [];
  items.forEach((it, idx) => {
    const qty = document.getElementById('cnt-qty-' + idx).value;
    if(qty){
      newCounts.push({
        'Count Date / Month': month,
        'Section': it['Items Type'] || 'bar',
        'Item Name': it['Name'],
        'SKU': it['SKU'] || '',
        'Storage Quantity': qty,
        'Ingredient Quantity': '',
        'Submitted By': currentStaff['Staff Full Name']
      });
    }
  });
  if(newCounts.length===0){ alert('Enter at least one quantity'); return; }
  DB.inventoryCounts = (DB.inventoryCounts || []).concat(newCounts);
  if(SHEET_URL){
    await fetch(SHEET_URL, {method:'POST', body:JSON.stringify({action:'saveAllCounts', inventoryCounts:DB.inventoryCounts})});
  }
  alert('Inventory Count Submitted Successfully!');
  render();
}

function renderHistoryTab(){
  const myName = currentStaff['Staff Full Name'];
  const myCounts = (DB.inventoryCounts || []).filter(c => c['Submitted By'] === myName);
  return '<div class="card"><h3>My Submitted Inventory History</h3>' +
    '<div class="table-wrap"><table><tr><th>Month</th><th>Section</th><th>Item Name</th><th>Storage Qty</th></tr>' + myCounts.map(c=>'<tr><td>' + escHtml(c['Count Date / Month']) + '</td><td>' + escHtml(c['Section']) + '</td><td><strong>' + escHtml(c['Item Name']) + '</strong></td><td>' + c['Storage Quantity'] + '</td></tr>').join('') + '</table></div></div>';
}

boot();
</script>
</body>
</html>
